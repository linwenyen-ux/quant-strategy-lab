document.querySelectorAll('#mkSeg button').forEach(b => b.onclick = () => {
  if (b.dataset.m === MK.key) return;
  applyMarket(b.dataset.m, true);
});
$('#adjChk').onchange = e => { CFG.adj = e.target.checked; if (APP.ctx) load('api'); };
$('#btnRun').onclick = () => load('api');
$('#btnDemo').onclick = () => load('demo');
$('#btnCfg').onclick = showCfg;
function applyTheme(t) {
  if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('qlab.theme', t); } catch (e) { }
}
$('#btnTheme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  applyTheme(cur === 'light' ? 'dark' : 'light');
};
try { applyTheme(localStorage.getItem('qlab.theme') || 'dark'); } catch (e) { }

/* 手機的 KPI 卡片列：同步指示點、點擊可跳卡 */
function syncKpiDots() {
  const k = $('#kpis'), d = $('#kpidots');
  if (!k || !d) return;
  const n = k.children.length;
  if (window.innerWidth > 640 || n < 2) { if (d.innerHTML) d.innerHTML = ''; return; }
  if (d.children.length !== n) {
    d.innerHTML = Array.from({ length: n }, (_, i) => `<i data-i="${i}"></i>`).join('');
    d.querySelectorAll('i').forEach(e => e.onclick = () => {
      const c = k.children[+e.dataset.i];
      if (!c) return;
      // offsetLeft 的參考點不一定是捲動容器，改用 rect 推算實際位移
      const left = c.getBoundingClientRect().left - k.getBoundingClientRect().left + k.scrollLeft;
      try { k.scrollTo({ left, behavior: 'smooth' }); } catch (_) { }
      // 有些環境（或使用者偏好減少動態）不會執行平滑捲動，補上保險
      setTimeout(() => { if (Math.abs(k.scrollLeft - left) > 4) k.scrollLeft = left; syncKpiDots(); }, 360);
    });
  }
  const step = k.children[0].getBoundingClientRect().width + 9;
  const idx = Math.min(n - 1, Math.max(0, Math.round(k.scrollLeft / step)));
  [...d.children].forEach((e, i) => e.classList.toggle('on', i === idx));
}
$('#kpis').addEventListener('scroll', syncKpiDots, { passive: true });
window.addEventListener('resize', syncKpiDots);

/* 分頁列可捲動時才顯示右側漸層提示 */
function syncTabFade() {
  const tb = $('#tabs'), w = $('#tabwrap');
  if (!tb || !w) return;
  const more = tb.scrollWidth - tb.clientWidth - tb.scrollLeft > 4;
  w.classList.toggle('scrollable', more);
}
$('#tabs').addEventListener('scroll', syncTabFade, { passive: true });
window.addEventListener('resize', syncTabFade);
setTimeout(syncTabFade, 50);

/* 窄螢幕的狀態列預設收合，點一下展開 */
function syncStatusCollapse() {
  const st = $('#status');
  if (window.innerWidth <= 640) { if (!st.dataset.init) { st.classList.add('collapsed'); st.dataset.init = '1'; } }
  else { st.classList.remove('collapsed'); st.dataset.init = ''; }
}
$('#status').addEventListener('click', () => { if (window.innerWidth <= 640) $('#status').classList.toggle('collapsed'); });
window.addEventListener('resize', syncStatusCollapse);
setTimeout(syncStatusCollapse, 50);
$('#btnExport').onclick = exportReport;
$('#btnPdf').onclick = printReport;
$('#btnPptx').onclick = makePptx;
$('#btnCsv').onclick = () => $('#fileCsv').click();
$('#sym').addEventListener('keydown', e => { if (e.key === 'Enter') load('api'); });
$('#fileCsv').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const bars = parseCSV(await f.text());
    if (bars.length < 60) throw new Error('有效資料不足 60 根');
    const dates = bars.map(r => r[0]);
    APP.ctx = makeCtx(bars, dates, null); APP.res = runAll(APP.ctx);
    APP.sym = f.name.replace(/\.csv$/i, ''); APP.name = APP.sym; APP.source = '使用者上傳 CSV：' + f.name; APP.sel = null;
    setMeta(esc(APP.sym), `${dsp(dates[0])} ～ ${dsp(dates[bars.length - 1])} · ${bars.length} 根<br>來源：上傳 CSV · 無基準指數（Beta 不計算）`);
    setStatus(`<span class="dotok">✅</span> <b>${STRATS.length} 支策略回測完成</b>（${APP.res.ms} ms）<span class="dim">·</span> 資料來自上傳 CSV<span class="dim">·</span> 無基準指數，Beta 欄位為「—」`);
    renderKPIs(); renderRank(); renderDetail(); renderOpt(); renderRisk();
  } catch (err) { alert('CSV 解析失敗：' + (err.message || err)); }
  e.target.value = '';
};
let savedMk = 'TW';
try { savedMk = localStorage.getItem('qlab.market') || 'TW'; } catch (e) { }
loadCustom();
applyMarket(MARKETS[savedMk] ? savedMk : 'TW', false);
renderLib();
load('api');
</script>
