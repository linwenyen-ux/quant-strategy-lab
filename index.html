<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- PWA：manifest 給 Android／Chrome；apple-* 給 iOS（iOS 不讀 manifest 的 display/icons） -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="量化實驗室">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<title>量化策略實驗室</title>
<style>
:root{
  --bg:#060a14; --bg2:#0a1120; --panel:#0d1524; --panel2:#111b2e;
  --line:#1b2740; --line2:#243b5c;
  color-scheme:dark;
  --tx:#dce5f5; --mut:#7e90b2; --dim:#5a6b8a;
  --teal:#2dd4bf; --tealdim:#0f766e;
  --ov0:rgba(255,255,255,.012); --ov1:rgba(255,255,255,.022); --ov2:rgba(255,255,255,.04);
  --ov3:rgba(255,255,255,.065); --ov4:rgba(255,255,255,.09); --ov5:rgba(255,255,255,.25);
  --thead:#0e1829; --tfirst:#0b1322;
  --up:#ff5f56; --dn:#1fc77d; --gold:#f2b544; --vio:#a78bfa; --blue:#60a5fa;
}
:root{--line2:#243b5c;}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f1f4f9; --bg2:#ffffff; --panel:#ffffff; --panel2:#f6f8fc;
  --line:#dde4ee; --line2:#c3d0e0;
  --tx:#17233a; --mut:#5a6b84; --dim:#8a99ae;
  --teal:#0d9488; --tealdim:#0f766e;
  --up:#d93025; --dn:#1a8f58; --gold:#b7791f; --vio:#6d4fd6; --blue:#1a73e8;
  --ov0:rgba(16,32,56,.015); --ov1:rgba(16,32,56,.028); --ov2:rgba(16,32,56,.045);
  --ov3:rgba(16,32,56,.07); --ov4:rgba(16,32,56,.1); --ov5:rgba(16,32,56,.25);
  --thead:#e9eef6; --tfirst:#f6f8fc;
}
:root[data-theme="light"] body{
  background:radial-gradient(1100px 520px at 12% -8%, #e4ecf7 0%, transparent 62%), var(--bg);
}
:root[data-theme="light"] .card,
:root[data-theme="light"] .kpi{background:var(--panel);box-shadow:0 1px 2px rgba(20,40,70,.06)}
:root[data-theme="light"] th{color:#44536a}
:root[data-theme="light"] .logo{box-shadow:0 4px 12px rgba(224,130,31,.22)}
:root[data-theme="light"] .btn.primary{background:rgba(13,148,136,.12);color:#0b6b61;border-color:rgba(13,148,136,.45)}
:root[data-theme="light"] .seg button.on{background:rgba(13,148,136,.14);color:#0b6b61}
:root[data-theme="light"] .chip.on{background:rgba(183,121,31,.14);border-color:rgba(183,121,31,.5);color:#8a5a12}
:root[data-theme="light"] .note-ok,
:root[data-theme="light"] .warn{color:inherit}
:root[data-theme="light"] tbody tr:hover td{background:rgba(26,115,232,.07)}
:root[data-theme="light"] tbody tr:hover td:first-child{background:rgba(26,115,232,.1)}
:root[data-theme="light"] .crow .cs,
:root[data-theme="light"] .crow .cp,
:root[data-theme="light"] select,
:root[data-theme="light"] input{background:var(--panel2)}
*{box-sizing:border-box}
body{margin:0;background:
   radial-gradient(1200px 600px at 15% -10%, #12203a 0%, transparent 60%),
   radial-gradient(900px 500px at 95% 0%, #15243f 0%, transparent 55%),
   var(--bg);
  color:var(--tx);font:14px/1.5 "Inter","Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding:18px 20px 60px;}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--mut)} .dim{color:var(--dim)}

/* ---------- shell ---------- */
.wrap{max-width:1680px;margin:0 auto}
.card{background:linear-gradient(180deg,var(--ov2),var(--ov0));border:1px solid var(--line);border-radius:16px}

/* header */
.hd{display:flex;align-items:flex-start;gap:14px;padding:16px 20px 14px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#f2b544,#e0821f);display:grid;place-items:center;font-size:22px;flex:none;box-shadow:0 6px 18px rgba(224,130,31,.28)}
.hd h1{font-size:23px}
.hd .sub{color:var(--mut);font-size:12.5px;margin-top:3px}
.hd .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;border:1px solid var(--line2);background:var(--ov2);color:var(--tx);font-size:13px;cursor:pointer;transition:.14s;white-space:nowrap}
.btn:hover{border-color:#36507d}
.btn.gold{background:linear-gradient(180deg,#f2b544,#da9420);border-color:#c98a1c;color:#241400;font-weight:600}
.btn.gold:hover{filter:brightness(1.07)}
.btn.primary{background:linear-gradient(180deg,rgba(45,212,191,.22),rgba(13,148,136,.16));border-color:rgba(45,212,191,.5);color:#8ff3e6;font-weight:600}
.btn.primary:hover{background:rgba(45,212,191,.3)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* control bar */
.ctrl{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;padding:14px 20px 16px;border-top:1px solid var(--line)}
.ctrl .btn{height:38px}
.ctrl #btnRun{margin-left:6px}   /* 輸入區與動作區之間留一點呼吸 */
.fld label:not(.chk){display:block;font-size:11px;color:var(--mut);margin-bottom:5px;letter-spacing:.06em}
.fld input:not([type=checkbox]),.fld select{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:10px;height:38px;padding:0 11px;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box}
.fld input:not([type=checkbox]):focus,.fld select:focus{border-color:var(--teal)}
.fld input:not([type=checkbox]){width:130px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel2)}
.seg button{all:unset;padding:0 15px;height:36px;display:flex;align-items:center;font-size:14px;color:var(--mut);cursor:pointer;transition:.14s;font-family:inherit;text-align:center}
.seg button:hover{color:var(--tx)}
.seg button.on{background:linear-gradient(180deg,rgba(45,212,191,.22),rgba(13,148,136,.16));color:#8ff3e6;font-weight:600}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--tx);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:0 12px;height:38px;cursor:pointer;user-select:none;white-space:nowrap}
.chk input{accent-color:var(--teal);margin:0}
.meta{margin-left:auto;text-align:right;font-size:12px;color:var(--mut);line-height:1.7}
.meta .t1{font-size:15px;color:var(--tx);font-weight:600}

/* status */
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);padding:11px 2px 14px}
.status b{color:var(--tx);font-weight:600}
.dotok{color:var(--dn)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:18px}
.kpi{display:flex;flex-direction:column;padding:15px 17px 16px;border-radius:15px;background:linear-gradient(180deg,var(--ov2),var(--ov0));border:1px solid var(--line)}
.kpi .k{font-size:11.5px;color:var(--mut);letter-spacing:.06em}
.kpi .v{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:27px;font-weight:700;margin:7px 0 5px;letter-spacing:-.02em;line-height:1.1}
.kpi .v.sm{font-size:21px;font-family:inherit;letter-spacing:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kpi .f{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:auto;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.lowq td{opacity:.42}
.lowq:hover td{opacity:.78}
.flaw{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:999px;font-size:10.5px;
  color:var(--up);background:rgba(255,95,86,.12);border:1px solid rgba(255,95,86,.3);white-space:nowrap;cursor:help}
.tiptip{position:fixed;z-index:9999;max-width:min(78vw,340px);padding:9px 12px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line2);color:var(--tx);font-size:12.5px;line-height:1.6;
  box-shadow:0 8px 26px rgba(0,0,0,.34);white-space:pre-wrap;opacity:0;pointer-events:none;
  transform:translateY(4px);transition:opacity .14s,transform .14s}
.tiptip.on{opacity:1;transform:none}
.libneed{margin-top:7px;font-size:11.5px;color:var(--mut)}
.shortrow td{color:var(--mut);font-size:12.5px;background:var(--ov0)}
.shortrow td b{color:var(--tx)}
.shortrow{cursor:default}
.kpidots{display:none;justify-content:center;align-items:center;gap:6px;margin:-8px 0 14px}
.kpidots i{width:6px;height:6px;border-radius:50%;background:var(--ov4);cursor:pointer;transition:width .2s,background .2s}
.kpidots i.on{background:var(--teal);width:18px;border-radius:3px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:11px 16px;font-size:14px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center;transition:.14s}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.pane{display:none}
.pane.on{display:block}

/* panel head */
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap}
.ph h2{font-size:15px}
.ph .sp{flex:1}
.chips{display:flex;gap:6px}
.chip{padding:5px 13px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;color:var(--mut);cursor:pointer;transition:.14s}
.chip:hover{color:var(--tx)}
.chip.on{background:rgba(242,181,68,.14);border-color:rgba(242,181,68,.55);color:var(--gold)}
.subtabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);margin-bottom:2px}
.subtab{padding:9px 15px;font-size:13.5px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;transition:.14s}
.subtab:hover{color:var(--tx)}
.subtab.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.crow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.crow .cs{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:8px;padding:6px 9px;font-size:12.5px;font-family:inherit}
.crow .cp{width:68px;background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:8px;padding:6px 8px;font-size:12.5px;font-family:var(--mono,ui-monospace)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;padding:4px 0 14px}
.pick{display:flex;align-items:center;gap:8px;font-size:12.8px;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;background:var(--ov1)}
.pick:hover{border-color:var(--teal)}
.pick input{accent-color:var(--teal);margin:0;flex:none}
.pick .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .sh{margin-left:auto;font-family:var(--mono,ui-monospace);color:var(--mut);font-size:11.5px}
.corr td{text-align:center;padding:5px 6px;font-size:11.5px;border:1px solid var(--ov3)}
.corr th{text-align:center;position:static;background:var(--thead);font-size:11px;padding:6px}

/* table */
.tblwrap{overflow:auto;max-height:620px;border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;letter-spacing:.03em;background:var(--thead);z-index:2;text-align:right;padding:10px 11px;font-size:12px;color:var(--mut);font-weight:500;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--tfirst);z-index:1}
th:first-child{z-index:3}
th:hover{color:var(--tx)}
th.srt{color:var(--gold)}
td{padding:9px 11px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--ov2);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(96,165,250,.09)}
tbody tr:hover td:first-child{background:rgba(96,165,250,.13)}
tr.base td{background:rgba(242,181,68,.055)}
tr.base td:first-child{background:rgba(242,181,68,.07)}
tr.sel td{background:rgba(45,212,191,.13)!important}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;border:1px solid}
.tag.趨勢{color:#7dd3fc;border-color:rgba(125,211,252,.4);background:rgba(125,211,252,.1)}
.tag.動能{color:#c4b5fd;border-color:rgba(196,181,253,.4);background:rgba(196,181,253,.1)}
.tag.均值回歸{color:#fca5a5;border-color:rgba(252,165,165,.4);background:rgba(252,165,165,.1)}
.tag.其他{color:#94a3b8;border-color:rgba(148,163,184,.4);background:rgba(148,163,184,.1)}
.tag.台股常用{color:#fca5a5;border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.12)}
.tag.自訂{color:#5eead4;border-color:rgba(94,234,212,.45);background:rgba(94,234,212,.12)}
.nodata{display:inline-block;font-size:10.5px;color:var(--gold);border:1px solid rgba(242,181,68,.4);border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:1px}
.tag.基準{color:var(--gold);border-color:rgba(242,181,68,.45);background:rgba(242,181,68,.12)}

/* detail */
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.mini>div{background:var(--panel);padding:10px 12px}
.mini .k{font-size:11px;color:var(--mut)}
.mini .v{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:16px;font-weight:650;margin-top:3px}
.rules{font-size:13px;line-height:1.75}
.rules b{color:var(--teal);font-weight:600}
.rules code{background:var(--ov3);padding:1.5px 6px;border-radius:5px;font-size:12px;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.pill{display:inline-block;padding:3px 10px;border-radius:7px;background:var(--ov3);border:1px solid var(--line2);font-size:12px;margin:0 5px 5px 0}
svg{display:block;max-width:100%}
.lgd{display:flex;gap:16px;font-size:12px;color:var(--mut);padding:0 18px 12px}
.lgd i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* heat */
.heat td{text-align:center;padding:6px 4px;border:none;font-size:11.5px}
.heat th{text-align:center;position:static;background:transparent}

/* lib */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:13px;padding:16px 18px}
.libcard{border:1px solid var(--line);border-radius:13px;padding:14px 15px;background:var(--ov1)}
.libcard h3{font-size:14px;margin-bottom:4px}
.libcard .src{font-size:11px;color:var(--dim);margin-bottom:9px;word-break:break-all}
.libcard .r{font-size:12.3px;color:var(--mut);line-height:1.65}
.libcard .r b{color:var(--tx);font-weight:600}

/* modal */
.mask{position:fixed;inset:0;background:rgba(2,6,14,.74);backdrop-filter:blur(3px);display:none;z-index:50;padding:40px 20px;overflow:auto}
.mask.on{display:block}
.modal{max-width:640px;margin:0 auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:20px 22px}
.modal h2{font-size:17px;margin-bottom:4px}
.frow{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.frow .fld input{width:110px}
.warn{background:rgba(242,181,68,.09);border:1px solid rgba(242,181,68,.3);border-radius:11px;padding:11px 14px;font-size:12.5px;color:#f7d79a;line-height:1.65;margin-bottom:14px}
.err{background:rgba(255,95,86,.1);border:1px solid rgba(255,95,86,.35);border-radius:11px;padding:11px 14px;font-size:12.5px;color:#ffb0ab;line-height:1.65}
.empty{padding:50px 20px;text-align:center;color:var(--dim);font-size:13.5px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--ov5);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:5px;border-radius:3px;background:var(--ov4);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue))}
.hdbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* 分頁列：溢出時用右側漸層提示可左右捲動 */
.tabwrap{position:relative;margin-bottom:18px}
.tabwrap::after{content:"";position:absolute;right:0;top:0;bottom:1px;width:36px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--bg));opacity:0;transition:opacity .2s}
.tabwrap.scrollable::after{opacity:1}
.tabs{margin-bottom:0}

@media(max-width:1250px){
  .kpis{grid-template-columns:repeat(3,1fr)}          /* 5 張 → 3+2，不產生孤兒 */
  .tab{padding:11px 12px;font-size:13.5px;gap:5px}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media(max-width:900px){ .kpis{grid-template-columns:repeat(2,1fr)} }
@media(max-width:640px){
  body{padding:10px}
  .hd{flex-wrap:wrap;padding:14px 14px 12px}
  .hd .sub{display:none}                               /* 窄螢幕隱藏裝飾性副標 */
  .hdbtns{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
  .hdbtns .btn{justify-content:center;padding:9px 6px;font-size:12.5px}
  /* 觸控目標至少 44px（iOS HIG） */
  .btn{min-height:44px}
  .seg button{height:44px}
  .fld input:not([type=checkbox]),.fld select,.chk{height:44px}
  /* 膠囊原本是 flex 子項會被壓縮，6 顆擠在 375px 會變直書；改成整列橫向捲動 */
  .chips{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
  .ctrl{padding:12px 14px 14px;gap:10px 12px;align-items:end}
  .ctrl .fld{flex:1 1 calc(50% - 6px);min-width:0}
  .ctrl .fld input:not([type=checkbox]),.ctrl .fld select,.ctrl .seg,.ctrl .chk{width:100%}
  .ctrl .chk input[type=checkbox]{width:16px;flex:none}
  .ctrl .seg button{flex:1;justify-content:center}
  #btnRun{flex:1 1 100%;justify-content:center}
  #btnCsv,#btnDemo{flex:1 1 calc(50% - 6px);justify-content:center;min-width:0}
  .meta{margin-left:0;text-align:left;width:100%;padding-top:4px;border-top:1px solid var(--line)}
  /* KPI 改成橫向捲動的卡片列：一次只佔一張卡的高度，右側露出下一張暗示可滑動 */
  .kpis{display:flex;grid-template-columns:none;gap:9px;overflow-x:auto;overscroll-behavior-x:contain;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .kpis::-webkit-scrollbar{display:none}
  .kpi{flex:0 0 84%;scroll-snap-align:start;padding:13px 15px 14px}
  /* 今日訊號：10 欄表格在手機上要捲 2.2 個螢幕，改成一檔一張卡 */
  #p-sig .tblwrap{max-height:none!important;overflow:visible}
  #p-sig thead{display:none}
  #p-sig table,#p-sig tbody{display:block;width:100%}
  #p-sig tbody tr{display:flex;flex-wrap:wrap;gap:1px 12px;align-items:baseline;
    border:1px solid var(--line);border-radius:12px;background:var(--ov0);
    padding:10px 13px 11px;margin-bottom:9px}
  #p-sig tbody td{display:block;order:5;border:none!important;padding:1px 0;text-align:left!important;font-size:12.5px}

<script>
/* =========================================================================
   量化策略實驗室 — Pine Script 相容指標核心
   以 TradingView Pine v4/v5 的 ta.* 語意實作（含 na 暖機期），
   讓移植過來的 30 支策略訊號與原始 .pine 一致。
   ========================================================================= */
const NA = NaN;
const isNA = v => v === undefined || v === null || Number.isNaN(v);
const nz = (v, d = 0) => (isNA(v) ? d : v);

function sma(src, n) {
  const o = new Array(src.length).fill(NA); let s = 0, c = 0;
  for (let i = 0; i < src.length; i++) {
    const v = src[i];
    if (isNA(v)) { s = 0; c = 0; continue; }
    s += v; c++;
    if (c > n) { s -= src[i - n]; c = n; }
    if (c === n) o[i] = s / n;
  }
  return o;
}
function ema(src, n) {
  const o = new Array(src.length).fill(NA), a = 2 / (n + 1); const sm = sma(src, n);
  for (let i = 0; i < src.length; i++) {
    if (isNA(o[i - 1])) { o[i] = sm[i]; }          // Pine: 以 sma 當種子
    else o[i] = a * src[i] + (1 - a) * o[i - 1];
  }
  return o;
}
function rma(src, n) {                               // Wilder smoothing
  const o = new Array(src.length).fill(NA); const sm = sma(src, n);
  for (let i = 0; i < src.length; i++) {
    if (isNA(o[i - 1])) o[i] = sm[i];
    else o[i] = (src[i] + (n - 1) * o[i - 1]) / n;
  }
  return o;
}
function stdev(src, n) {                             // Pine 用母體標準差
  const o = new Array(src.length).fill(NA);
  for (let i = n - 1; i < src.length; i++) {
    let m = 0, ok = true;
    for (let k = 0; k < n; k++) { const v = src[i - k]; if (isNA(v)) { ok = false; break; } m += v; }
    if (!ok) continue; m /= n;
    let s = 0; for (let k = 0; k < n; k++) { const d = src[i - k] - m; s += d * d; }
    o[i] = Math.sqrt(s / n);
  }
  return o;
}
function dev(src, n) {                               // Pine ta.dev：平均絕對離差，不是標準差
  const o = new Array(src.length).fill(NA);
  for (let i = n - 1; i < src.length; i++) {
    let m = 0, ok = true;
    for (let k = 0; k < n; k++) { const v = src[i - k]; if (isNA(v)) { ok = false; break; } m += v; }
    if (!ok) continue; m /= n;
    let s = 0; for (let k = 0; k < n; k++) s += Math.abs(src[i - k] - m);
    o[i] = s / n;
  }
  return o;
}
function cci(src, n) {                               // Pine ta.cci = (src − sma) / (0.015 × dev)
  const m = sma(src, n), d = dev(src, n);
  return src.map((v, i) => (isNA(v) || isNA(m[i]) || isNA(d[i]) || d[i] === 0) ? NA : (v - m[i]) / (0.015 * d[i]));
}
const hlc3 = b => b.c.map((v, i) => (b.h[i] + b.l[i] + v) / 3);
function change(src, k = 1) { return src.map((v, i) => (i < k || isNA(src[i - k]) || isNA(v)) ? NA : v - src[i - k]); }
function highest(src, n) {
  const o = new Array(src.length).fill(NA);
  for (let i = n - 1; i < src.length; i++) { let m = -Infinity, ok = true; for (let k = 0; k < n; k++) { const v = src[i - k]; if (isNA(v)) { ok = false; break; } if (v > m) m = v; } if (ok) o[i] = m; }
  return o;
}
function lowest(src, n) {
  const o = new Array(src.length).fill(NA);
  for (let i = n - 1; i < src.length; i++) { let m = Infinity, ok = true; for (let k = 0; k < n; k++) { const v = src[i - k]; if (isNA(v)) { ok = false; break; } if (v < m) m = v; } if (ok) o[i] = m; }
  return o;
}
function highestbars(src, n) {                       // 回傳最高點的位移（0 或負數）
  const o = new Array(src.length).fill(NA);
  for (let i = n - 1; i < src.length; i++) { let m = -Infinity, b = 0; for (let k = 0; k < n; k++) { const v = src[i - k]; if (isNA(v)) { m = NA; break; } if (v > m) { m = v; b = -k; } } if (!isNA(m)) o[i] = b; }
  return o;
}
function lowestbars(src, n) {
  const o = new Array(src.length).fill(NA);
  for (let i = n - 1; i < src.length; i++) { let m = Infinity, b = 0; for (let k = 0; k < n; k++) { const v = src[i - k]; if (isNA(v)) { m = NA; break; } if (v < m) { m = v; b = -k; } } if (!isNA(m)) o[i] = b; }
  return o;
}
function linreg(src, n, off = 0) {                   // ta.linreg
  const o = new Array(src.length).fill(NA);
  const sx = (n - 1) * n / 2, sxx = (n - 1) * n * (2 * n - 1) / 6;
  for (let i = n - 1; i < src.length; i++) {
    let sy = 0, sxy = 0, ok = true;
    for (let k = 0; k < n; k++) { const v = src[i - (n - 1 - k)]; if (isNA(v)) { ok = false; break; } sy += v; sxy += k * v; }
    if (!ok) continue;
    const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx);
    const inter = (sy - slope * sx) / n;
    o[i] = inter + slope * (n - 1 - off);
  }
  return o;
}
function rsi(src, n) {
  const ch = change(src);
  const up = rma(ch.map(v => isNA(v) ? NA : Math.max(v, 0)), n);
  const dn = rma(ch.map(v => isNA(v) ? NA : Math.max(-v, 0)), n);
  return up.map((u, i) => {
    if (isNA(u) || isNA(dn[i])) return NA;
    if (dn[i] === 0) return 100; if (u === 0) return 0;
    return 100 - 100 / (1 + u / dn[i]);
  });
}
function trueRange(b) {
  return b.h.map((h, i) => i === 0 ? h - b.l[i] : Math.max(h - b.l[i], Math.abs(h - b.c[i - 1]), Math.abs(b.l[i] - b.c[i - 1])));
}
function atr(b, n) { return rma(trueRange(b), n); }
function macdOf(src, f, s, sig) {
  const fa = ema(src, f), sl = ema(src, s);
  const m = fa.map((v, i) => (isNA(v) || isNA(sl[i])) ? NA : v - sl[i]);
  const g = ema(m, sig);
  return { macd: m, signal: g, hist: m.map((v, i) => (isNA(v) || isNA(g[i])) ? NA : v - g[i]) };
}
function dmi(b, len, lensig) {
  const n = b.c.length;
  const up = change(b.h), dw = change(b.l).map(v => isNA(v) ? NA : -v);
  const pdm = up.map((u, i) => isNA(u) ? NA : (u > dw[i] && u > 0 ? u : 0));
  const mdm = dw.map((d, i) => isNA(d) ? NA : (d > up[i] && d > 0 ? d : 0));
  const trur = rma(trueRange(b), len);
  const rp = rma(pdm, len), rm = rma(mdm, len);
  const plus = new Array(n).fill(NA), minus = new Array(n).fill(NA);
  for (let i = 0; i < n; i++) {
    if (!isNA(rp[i]) && !isNA(trur[i]) && trur[i] !== 0) plus[i] = 100 * rp[i] / trur[i];
    else if (i > 0) plus[i] = plus[i - 1];
    if (!isNA(rm[i]) && !isNA(trur[i]) && trur[i] !== 0) minus[i] = 100 * rm[i] / trur[i];
    else if (i > 0) minus[i] = minus[i - 1];
  }
  const dx = plus.map((p, i) => { if (isNA(p) || isNA(minus[i])) return NA; const s = p + minus[i]; return Math.abs(p - minus[i]) / (s === 0 ? 1 : s); });
  const adx = rma(dx, lensig).map(v => isNA(v) ? NA : 100 * v);
  return { plus, minus, adx };
}
function supertrend(b, factor, atrPeriod) {          // ta.supertrend：direction -1 = 多頭
  const n = b.c.length, a = atr(b, atrPeriod);
  const st = new Array(n).fill(NA), dir = new Array(n).fill(NA);
  let pUB = NA, pLB = NA, pST = NA, pDir = NA;
  for (let i = 0; i < n; i++) {
    const hl2 = (b.h[i] + b.l[i]) / 2;
    if (isNA(a[i])) { continue; }
    let ub = hl2 + factor * a[i], lb = hl2 - factor * a[i];
    const plb = nz(pLB, lb), pub = nz(pUB, ub);
    lb = (lb > plb || (i > 0 && b.c[i - 1] < plb)) ? lb : plb;
    ub = (ub < pub || (i > 0 && b.c[i - 1] > pub)) ? ub : pub;
    let d;
    if (isNA(a[i - 1]) || isNA(pDir)) d = 1;
    else if (pST === pUB) d = b.c[i] > ub ? -1 : 1;
    else d = b.c[i] < lb ? 1 : -1;
    const s = d === -1 ? lb : ub;
    st[i] = s; dir[i] = d; pUB = ub; pLB = lb; pST = s; pDir = d;
  }
  return { st, dir };
}
function kdTW(b, n, ks, ds) {                        // 台股慣用 KD：RSV 經兩次指數平滑
  const hh = highest(b.h, n), ll = lowest(b.l, n), N = b.c.length;
  const K = new Array(N).fill(NA), D = new Array(N).fill(NA);
  let k = 50, d = 50;
  for (let i = 0; i < N; i++) {
    if (isNA(hh[i]) || isNA(ll[i])) continue;
    const rng = hh[i] - ll[i];
    const rsv = rng === 0 ? 50 : (b.c[i] - ll[i]) / rng * 100;
    k = k * (1 - 1 / ks) + rsv / ks;
    d = d * (1 - 1 / ds) + k / ds;
    K[i] = k; D[i] = d;
  }
  return { K, D };
}
function stochOf(src, hi, lo, n) {
  const hh = highest(hi, n), ll = lowest(lo, n);
  return src.map((v, i) => (isNA(v) || isNA(hh[i]) || isNA(ll[i]) || hh[i] === ll[i]) ? NA : 100 * (v - ll[i]) / (hh[i] - ll[i]));
}
const crossover = (a, b2) => a.map((v, i) => i > 0 && !isNA(v) && !isNA(b2[i]) && !isNA(a[i - 1]) && !isNA(b2[i - 1]) && a[i - 1] <= b2[i - 1] && v > b2[i]);
const crossunder = (a, b2) => a.map((v, i) => i > 0 && !isNA(v) && !isNA(b2[i]) && !isNA(a[i - 1]) && !isNA(b2[i - 1]) && a[i - 1] >= b2[i - 1] && v < b2[i]);
const konst = (arr, v) => new Array(arr.length).fill(v);
function barssince(cond) {                           // ta.barssince
  const o = new Array(cond.length).fill(NA); let c = NA;
  for (let i = 0; i < cond.length; i++) { if (cond[i]) c = 0; else if (!isNA(c)) c++; o[i] = c; }
  return o;
}
/* 多週期：日線資料以「週線」替代原腳本的日內 MTF，取已完成週 K，不前視 */
function weeklyResample(b, dates) {
  const idx = [], W = { o: [], h: [], l: [], c: [], v: [] };
  let cur = null, key = null;
  const wkey = d => {                                  // 回傳該日所屬週的週一；日期無效時退回用原字串分組
    const t = new Date(d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8) + 'T00:00:00Z');
    if (isNaN(t.getTime())) return d;
    t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7));
    return t.toISOString().slice(0, 10);
  };
  for (let i = 0; i < dates.length; i++) {
    const k = wkey(dates[i]);
    if (k !== key) { if (cur) { W.o.push(cur.o); W.h.push(cur.h); W.l.push(cur.l); W.c.push(cur.c); W.v.push(cur.v); } cur = { o: b.o[i], h: b.h[i], l: b.l[i], c: b.c[i], v: b.v[i] }; key = k; }
    else { cur.h = Math.max(cur.h, b.h[i]); cur.l = Math.min(cur.l, b.l[i]); cur.c = b.c[i]; cur.v += b.v[i]; }
    idx.push(W.c.length);                            // 對應到「已完成」的週 K 索引
  }
  if (cur) { W.o.push(cur.o); W.h.push(cur.h); W.l.push(cur.l); W.c.push(cur.c); W.v.push(cur.v); }
  return { W, idx };
}
function mtfMap(weekSeries, idx) {                   // 把週線序列攤回日線（只用已完成的週）
  return idx.map(k => (k - 1 >= 0 ? weekSeries[k - 1] : NA));
}

const P = (d, lo, hi, st, label) => ({ d, lo, hi, st, label });
let STRATS = [];
const S = o => { STRATS.push(o); return o; };

/* ---------------- 趨勢 ---------------- */
S({ id:'supertrend', name:'Supertrend', cat:'趨勢', file:'strategies/trend/Supertrend.pine',
  params:{ period:P(10,5,30,1,'ATR 週期'), mult:P(3.7,1,8,.1,'ATR 倍數'), barsBack:P(2,1,20,1,'停損回看根數'), tpFactor:P(1.5,0.5,5,.1,'獲利倍數') },

  prep(c,p){ const n=c.n,a=atr(c.b,p.period),up=new Array(n).fill(NA),dn=new Array(n).fill(NA),tr=new Array(n).fill(1);

      let u=src-p.mult*a[i],d=src+p.mult*a[i]; const u1=nz(up[i-1],u),d1=nz(dn[i-1],d);
      u=(i>0&&c.b.c[i-1]>u1)?Math.max(u,u1):u; d=(i>0&&c.b.c[i-1]<d1)?Math.min(d,d1):d;
      let t=i>0?tr[i-1]:1; if(t===-1&&c.b.c[i]>d1)t=1; else if(t===1&&c.b.c[i]<u1)t=-1;
      up[i]=u;dn[i]=d;tr[i]=t; }
    return { tr, slc: lowest(c.b.l,p.barsBack) }; },
  sig(i,S_,pos,p,c){ const en=i>0&&S_.tr[i]===1&&S_.tr[i-1]===-1; let stop=NA,lim=NA;
    if(pos.in){ const k=pos.entryBar-1, sl=S_.slc[k], ep=c.b.c[k];
      if(!isNA(sl)){ stop=sl; lim=ep+(ep-sl)*p.tpFactor; } }
    return { enter:en, exit:false, stop, limit:lim }; } });

S({ id:'qqe', name:'QQE signals', cat:'動能', file:'strategies/momentum/QQE signals.pine',
  params:{ rsiLen:P(14,5,30,1,'RSI 長度'), sf:P(5,1,15,1,'RSI 平滑'), qqe:P(4.238,1,8,.05,'QQE 因子') },
  entry:'QQE 趨勢線由上方跌破 RSI 平滑線的第一根（多方轉折）', exit:'QQE 趨勢線重新站回 RSI 平滑線之上',
  prep(c,p){ const n=c.n,W=p.rsiLen*2-1;
    const R=rsi(c.b.c,p.rsiLen), X=ema(R,p.sf);
    const AtrRsi=X.map((v,i)=>i===0||isNA(X[i-1])||isNA(v)?NA:Math.abs(X[i-1]-v));
    const dar=ema(ema(AtrRsi,W),W).map(v=>isNA(v)?NA:v*p.qqe);
    const lb=new Array(n).fill(0), sb=new Array(n).fill(0), tr=new Array(n).fill(1), tl=new Array(n).fill(NA);
    const cross=(a,b,a1,b1)=>!isNA(a)&&!isNA(b)&&!isNA(a1)&&!isNA(b1)&&((a1-b1)*(a-b)<0);
    for(let i=0;i<n;i++){
      const x=X[i], D=dar[i];
      if(isNA(x)||isNA(D)){ lb[i]=i>0?lb[i-1]:0; sb[i]=i>0?sb[i-1]:0; tr[i]=i>0?tr[i-1]:1; continue; }
      const pl=i>0?lb[i-1]:0, ps=i>0?sb[i-1]:0, px=i>0?X[i-1]:NA;
      lb[i]=(!isNA(px)&&px>pl&&x>pl)?Math.max(pl,x-D):(x-D);
      sb[i]=(!isNA(px)&&px<ps&&x<ps)?Math.min(ps,x+D):(x+D);
      // cross(RSIndex, shortband[1]) 與 cross(longband[1], RSIndex)
      const cUp = cross(x, ps, px, i>1?sb[i-2]:NA);
      const cDn = cross(pl, x, i>1?lb[i-2]:NA, px);
      tr[i] = cUp ? 1 : (cDn ? -1 : (i>0?tr[i-1]:1));
      tl[i] = tr[i]===1 ? lb[i] : sb[i];
    }
    const xl=new Array(n).fill(0), xs=new Array(n).fill(0);
    for(let i=0;i<n;i++){ const x=X[i], T=tl[i];
      if(isNA(x)||isNA(T)){ xl[i]=0; xs[i]=0; continue; }
      xl[i]=T<x?(i>0?xl[i-1]:0)+1:0; xs[i]=T>x?(i>0?xs[i-1]:0)+1:0; }
    return { xl, xs }; },
  sig(i,S_){ return { enter:S_.xl[i]===1, exit:S_.xs[i]===1 }; } });

S({ id:'macd_dmi', name:'MACD + DMI', cat:'動能', file:'strategies/momentum/MACD + DMI.pine',

  entry:'MACD 金叉 且 +DI > −DI', exit:'MACD 死叉且 +DI < −DI，或跌破 Volatility Stop',
  prep(c,p){ const m=macdOf(c.b.c,p.fast,p.slow,p.sgn), d=dmi(c.b,14,14), n=c.n;
    const a=atr(c.b,p.vsLen), tr0=trueRange(c.b), vs=new Array(n).fill(NA);
    let mx=c.b.c[0],mn=c.b.c[0],up=true,stop=0;
    for(let i=0;i<n;i++){ const src=c.b.c[i], aM=isNA(a[i])?tr0[i]:a[i]*p.vsF;
      mx=Math.max(mx,src); mn=Math.min(mn,src);
      stop=up?Math.max(stop,mx-aM):Math.min(stop,mn+aM); if(isNA(stop))stop=src;
      const nu=src-stop>=0; if(nu!==up){ mx=src; mn=src; stop=nu?mx-aM:mn+aM; } up=nu; vs[i]=stop; }
    return { co:crossover(m.macd,m.signal), cu:crossunder(m.macd,m.signal), d, vs, cvs:crossunder(c.b.c,vs) }; },
  sig(i,S_){ return { enter:S_.co[i]&&S_.d.plus[i]>S_.d.minus[i], exit:(S_.cu[i]&&S_.d.plus[i]<S_.d.minus[i])||S_.cvs[i] }; } });

  prep(c,p){ const m=macdOf(c.b.c,p.fast,p.slow,p.sgn), r=rsi(c.b.c,p.rsiLen);
    return { co:crossover(m.macd,m.signal), cu:crossunder(m.macd,m.signal),
      os:barssince(r.map(v=>!isNA(v)&&v<=30)), ob:barssince(r.map(v=>!isNA(v)&&v>=70)) }; },
  sig(i,S_,pos,p){ const wos=!isNA(S_.os[i])&&S_.os[i]<=10, wob=!isNA(S_.ob[i])&&S_.ob[i]<=10;
    return { enter:S_.co[i]&&wos, exit:S_.cu[i]&&wob,
      stop:pos.in?pos.avg*(1-p.sl/100):NA, limit:pos.in?pos.avg*(1+p.tp/100):NA }; } });

S({ id:'stochrsi_st', name:'StochRSI + Supertrend', cat:'動能', file:'strategies/momentum/StochRSI + Supertrend Strategy.pine',
  params:{ k:P(3,1,10,1,'K 平滑'), d:P(3,1,10,1,'D 平滑'), rsiLen:P(14,5,30,1,'RSI'), stochLen:P(14,5,30,1,'Stoch 長度'), maLen:P(200,20,300,5,'趨勢 EMA'), atrLen:P(11,5,30,1,'ST ATR'), f:P(2,1,6,.1,'ST 倍數') },
  entry:'站上 EMA200、K < 20 且 K 上穿 D、Supertrend 多方', exit:'K > 80 且 K 下穿 D',
  prep(c,p){ const r=rsi(c.b.c,p.rsiLen), k=sma(stochOf(r,r,r,p.stochLen),p.k), d=sma(k,p.d);
    return { k,d, co:crossover(k,d), cu:crossunder(k,d), ma:ema(c.b.c,p.maLen), dir:supertrend(c.b,p.f,p.atrLen).dir }; },
  sig(i,S_,pos,p,c){ return { enter:c.b.c[i]>S_.ma[i]&&S_.k[i]<20&&S_.co[i]&&S_.dir[i]<0,
    exit:S_.k[i]>80&&S_.cu[i] }; } });

S({ id:'wvf', name:'Williams Vix Fix', cat:'動能', file:'strategies/momentum/Williams Vix Fix.pine',
  params:{ bbl:P(20,10,40,1,'BB 長度'), mult:P(2,1,4,.1,'BB 標準差'), pd:P(20,10,40,1,'WVF 回看'), lb:P(50,20,100,1,'百分位回看'), ph:P(85,50,100,1,'高百分位 %') },
  entry:'WVF 突破上軌或百分位高點連 2 根，且收盤跌破布林下軌（恐慌底部）', exit:'反向 WVF 條件消失且收盤站上布林上軌',
  prep(c,p){ const cl=c.b.c, basis=sma(cl,p.bbl), dev=stdev(cl,p.bbl);
    const up=basis.map((v,i)=>isNA(v)?NA:v+p.mult*dev[i]), lo=basis.map((v,i)=>isNA(v)?NA:v-p.mult*dev[i]);
    const hc=highest(cl,p.pd), lcs=lowest(cl,p.pd);
    const wvf=hc.map((v,i)=>isNA(v)?NA:(v-c.b.l[i])/v*100);
    const wvfI=lcs.map((v,i)=>isNA(v)?NA:(c.b.h[i]-v)/v*100);
    const sdW=stdev(wvf,p.bbl), sdI=stdev(wvfI,p.bbl);
    const ub=sma(wvf,p.bbl).map((v,i)=>isNA(v)?NA:v+p.mult*sdW[i]);
    const ubI=sma(wvfI,p.bbl).map((v,i)=>isNA(v)?NA:v+p.mult*sdI[i]);
    const rh=highest(wvf,p.lb).map(v=>isNA(v)?NA:v*p.ph/100), rhI=lowest(wvfI,p.lb).map(v=>isNA(v)?NA:v*0.99);
    return { up, lo, wvf, wvfI, ub, ubI, rh, rhI }; },
  sig(i,S_,pos,p,c){ if(i<1) return {enter:false,exit:false};
    const hit=k=>!isNA(S_.wvf[k])&&(S_.wvf[k]>=S_.ub[k]||S_.wvf[k]>=S_.rh[k]);
    const hitI=k=>!isNA(S_.wvfI[k])&&(S_.wvfI[k]<=S_.ubI[k]||S_.wvfI[k]<=S_.rhI[k]);
    const en=hit(i)&&hit(i-1)&&c.b.c[i]<S_.lo[i];
    const sellCond=!(hitI(i)&&hitI(i-1)&&c.b.c[i]<S_.up[i]);
    return { enter:en, exit:sellCond&&c.b.c[i]>S_.up[i] }; } });

S({ id:'bb_aroon', name:'BB + Aroon', cat:'均值回歸', file:'strategies/mean-reversion/BB + Aroon.pine',
  params:{ len:P(20,10,40,1,'BB 長度'), mult:P(2,1,4,.1,'標準差'), ar:P(288,20,320,1,'Aroon 長度'), conf:P(90,50,100,1,'Aroon 確認'), stop:P(70,30,95,1,'Aroon 停止') },
  entry:'收盤跌破布林下軌，且 Aroon Up > 90（長多格局中的回檔）', exit:'收盤跌破上軌，或 Aroon Up < 70',
  prep(c,p){ const basis=sma(c.b.c,p.len), dev=stdev(c.b.c,p.len);
    const up=basis.map((v,i)=>isNA(v)?NA:v+p.mult*dev[i]), lo=basis.map((v,i)=>isNA(v)?NA:v-p.mult*dev[i]);
    const hb=highestbars(c.b.h,p.ar+1);
    return { cuL:crossunder(c.b.c,lo), cuU:crossunder(c.b.c,up), aru:hb.map(v=>isNA(v)?NA:100*(v+p.ar)/p.ar) }; },
  sig(i,S_,pos,p){ const a=S_.aru[i]; if(isNA(a)) return {enter:false,exit:false};
    return { enter:S_.cuL[i]&&a>p.conf, exit:S_.cuU[i]||a<p.stop }; } });

S({ id:'bb_winner_lite', name:'BB Winner LITE', cat:'均值回歸', file:'strategies/mean-reversion/BB Winner LITE.pine',
  params:{ len:P(20,10,40,1,'BB 長度'), mult:P(2,1,4,.1,'標準差'), pct:P(30,10,60,1,'K 棒比例 %') },
  entry:'K 棒下緣 30% 位置已跌破布林下軌，但實體 60% 未破（下影線測試）', exit:'K 棒上緣 30% 位置突破布林上軌',
  prep(c,p){ const basis=sma(c.b.c,p.len), dev=stdev(c.b.c,p.len);
    return { up:basis.map((v,i)=>isNA(v)?NA:v+p.mult*dev[i]), lo:basis.map((v,i)=>isNA(v)?NA:v-p.mult*dev[i]) }; },
  sig(i,S_,pos,p,c){ const cs=c.b.h[i]-c.b.l[i], bz=cs*p.pct/100+c.b.l[i], sz=c.b.h[i]-cs*p.pct/100;
    const bs=Math.abs(c.b.c[i]-c.b.o[i])*0.6, bsB=c.b.l[i]+bs;
    return { enter:!isNA(S_.lo[i])&&bz<S_.lo[i]&&!(bsB<S_.lo[i]), exit:!isNA(S_.up[i])&&sz>S_.up[i] }; } });

S({ id:'bb_divergence', name:'BB Divergence', cat:'均值回歸', file:'strategies/mean-reversion/BB Divergence.pine',
  params:{ len:P(20,10,40,1,'BB 長度'), mult:P(2,1,4,.1,'標準差'), pct:P(30,10,60,1,'K 棒比例 %') },
  entry:'收盤突破上軌、上軌走揚同時下軌走跌（通道擴張）且收紅 K', exit:'收盤跌破布林中軌',
  prep(c,p){ const basis=sma(c.b.c,p.len), dev=stdev(c.b.c,p.len);
    return { basis, up:basis.map((v,i)=>isNA(v)?NA:v+p.mult*dev[i]), lo:basis.map((v,i)=>isNA(v)?NA:v-p.mult*dev[i]) }; },
  sig(i,S_,pos,p,c){ if(i<1||isNA(S_.up[i])||isNA(S_.up[i-1])) return {enter:false,exit:false};
    const buy=c.b.c[i]>S_.up[i]&&S_.up[i]>S_.up[i-1]&&S_.lo[i]<S_.lo[i-1]&&c.b.c[i]>c.b.o[i];
    const cs=c.b.h[i]-c.b.l[i], bz=c.b.h[i]-cs*(100-p.pct)/100;
    return { enter:buy&&bz>S_.up[i], exit:c.b.c[i]<S_.basis[i] }; } });

S({ id:'bb_breakout', name:'Bollinger Breakout', cat:'均值回歸', file:'strategies/mean-reversion/Bollinger Breakout [kodify].pine',
  params:{ smaLen:P(350,20,400,5,'SMA 長度'), stdLen:P(350,20,400,5,'StdDev 長度'), ub:P(2.5,1,5,.1,'上軌倍數'), lb:P(2.5,1,5,.1,'下軌倍數') },
  entry:'收盤向上突破 SMA350 + 2.5σ 上軌', exit:'收盤跌破 SMA350',
  prep(c,p){ const s=sma(c.b.c,p.smaLen), d=stdev(c.b.c,p.stdLen);
    const up=s.map((v,i)=>isNA(v)?NA:v+d[i]*p.ub);
    return { co:crossover(c.b.c,up), cu:crossunder(c.b.c,s) }; },
  sig(i,S_){ return { enter:S_.co[i], exit:S_.cu[i] }; } });

S({ id:'exceeded_candle', name:'Exceeded candle', cat:'均值回歸', file:'strategies/mean-reversion/Exceeded candle.pine',
  params:{ len:P(20,10,40,1,'BB 長度'), mult:P(2,1,4,.1,'標準差') },
  entry:'紅 K 完全吞噬前一根黑 K，且收盤仍在布林中軌下方、前 3 根非連黑', exit:'收盤突破布林上軌',
  prep(c,p){ const basis=sma(c.b.c,p.len), dev=stdev(c.b.c,p.len);
    return { basis, up:basis.map((v,i)=>isNA(v)?NA:v+p.mult*dev[i]) }; },
  sig(i,S_,pos,p,c){ if(i<3) return {enter:false,exit:false};
    const g=c.b.c[i-1]<c.b.o[i-1]&&c.b.c[i]>c.b.o[i]&&c.b.c[i]>c.b.o[i-1];
    const l3=c.b.c[i-2]<c.b.o[i-2]&&c.b.c[i-3]<c.b.o[i-3];
    return { enter:g&&c.b.c[i]<S_.basis[i]&&!l3, exit:c.b.c[i]>S_.up[i] }; } });

S({ id:'mema_bb_rsi', name:'MEMA + BB + RSI', cat:'均值回歸', file:'strategies/mean-reversion/MEMA + BB + RSI [Alorse].pine',
  params:{ ma1:P(10,3,40,1,'EMA 快'), ma2:P(55,10,200,1,'EMA 慢'), len:P(20,10,40,1,'BB 長度'), mult:P(2,1,4,.1,'標準差'), rsiLen:P(14,5,30,1,'RSI'), ob:P(71,55,90,1,'出場 RSI') },
  entry:'收盤站上 EMA10，但最低價跌破布林下軌（強勢股的瞬間超賣）', exit:'RSI > 71，或收盤跌破 EMA55',

    return { e1:ema(c.b.c,p.ma1), e2:ema(c.b.c,p.ma2), lo:basis.map((v,i)=>isNA(v)?NA:v-p.mult*dev[i]), r:rsi(c.b.c,p.rsiLen) }; },
  sig(i,S_,pos,p,c){ return { enter:!isNA(S_.e1[i])&&!isNA(S_.lo[i])&&c.b.c[i]>S_.e1[i]&&c.b.l[i]<S_.lo[i],

/* ---------------- 台股常用（需 FinMind 台股資料） ---------------- */
const EX = c => (c && c.ex) ? c.ex : null;

S({ id: 'kd_cross', name: 'KD 黃金交叉（台股 9,3,3）', cat: '台股常用', file: '台股常用策略',
  params: { n: P(9, 5, 30, 1, 'RSV 期數'), ks: P(3, 2, 6, 1, 'K 平滑'), ds: P(3, 2, 6, 1, 'D 平滑'),
    buyZone: P(30, 10, 50, 1, '進場 K 上限'), sellZone: P(70, 50, 95, 1, '出場 K 下限') },
  entry: 'K 值由下向上穿越 D 值，且 K 仍在低檔（< 30）', exit: 'K 值跌破 D 值，且 K 已在高檔（> 70）',
  prep(c, p) { const { K, D } = kdTW(c.b, p.n, p.ks, p.ds); return { K, D, co: crossover(K, D), cu: crossunder(K, D) }; },
  sig(i, S_, pos, p) { return { enter: S_.co[i] && S_.K[i] < p.buyZone, exit: S_.cu[i] && S_.K[i] > p.sellZone }; } });

S({ id: 'ma_bull', name: '均線多頭排列', cat: '台股常用', file: '台股常用策略',
  params: { a: P(5, 3, 20, 1, '短均'), b: P(20, 10, 60, 1, '中均'), cc: P(60, 20, 120, 1, '長均') },
  entry: '5 日 > 20 日 > 60 日均線首次成立，且收盤站上 5 日線', exit: '5 日線跌破 20 日線（排列破壞）',
  prep(c, p) { const a = sma(c.b.c, p.a), b2 = sma(c.b.c, p.b), cc = sma(c.b.c, p.cc);
    const al = a.map((v, i) => !isNA(v) && !isNA(b2[i]) && !isNA(cc[i]) && v > b2[i] && b2[i] > cc[i]);
    return { a, b2, al, cu: crossunder(a, b2) }; },
  sig(i, S_, pos, p, c) { return { enter: S_.al[i] && !S_.al[i - 1] && c.b.c[i] > S_.a[i], exit: S_.cu[i] }; } });

S({ id: 'vol_break', name: '量價突破', cat: '台股常用', file: '台股常用策略',
  params: { look: P(20, 5, 60, 1, '突破回看'), volLen: P(20, 5, 60, 1, '均量期數'),
    volMult: P(1.5, 1, 5, .1, '放量倍數'), exitLook: P(10, 3, 40, 1, '出場回看') },
  entry: '收盤突破前 20 日最高，且成交量放大到 20 日均量的 1.5 倍以上', exit: '收盤跌破前 10 日最低',
  prep(c, p) { return { hh: highest(c.b.c, p.look), ll: lowest(c.b.c, p.exitLook), av: sma(c.b.v, p.volLen) }; },
  sig(i, S_, pos, p, c) { if (i < 1) return { enter: false, exit: false };
    return { enter: !isNA(S_.hh[i - 1]) && c.b.c[i] > S_.hh[i - 1] && !isNA(S_.av[i]) && c.b.v[i] > S_.av[i] * p.volMult,
      exit: !isNA(S_.ll[i - 1]) && c.b.c[i] < S_.ll[i - 1] }; } });

S({ id: 'bias_rev', name: '乖離率回歸', cat: '台股常用', file: '台股常用策略',
  params: { maLen: P(20, 5, 120, 1, '均線期數'), bias: P(-8, -25, -2, .5, '進場負乖離 %'), sl: P(10, 2, 30, .5, '停損 %') },
  entry: '收盤對 20 日均線的負乖離達 −8%（跌深）', exit: '收盤回到均線之上；−10% 停損',
  prep(c, p) { const m = sma(c.b.c, p.maLen);
    return { m, bi: m.map((v, i) => isNA(v) ? NA : (c.b.c[i] - v) / v * 100) }; },
  sig(i, S_, pos, p, c) { return { enter: !isNA(S_.bi[i]) && S_.bi[i] <= p.bias,
    exit: !isNA(S_.m[i]) && c.b.c[i] >= S_.m[i], stop: pos.in ? pos.avg * (1 - p.sl / 100) : NA }; } });

S({ id: 'gap_up', name: '跳空缺口', cat: '台股常用', file: '台股常用策略',
  params: { volLen: P(20, 5, 60, 1, '均量期數'), volMult: P(1.5, 1, 5, .1, '放量倍數'), sl: P(6, 2, 20, .5, '停損 %') },
  entry: '向上跳空（最低價高於前一根最高價）且同步放量', exit: '收盤跌回缺口下緣（回補）；−6% 停損',
  prep(c, p) { return { av: sma(c.b.v, p.volLen) }; },
  sig(i, S_, pos, p, c) { if (i < 1) return { enter: false, exit: false };
    const gap = c.b.l[i] > c.b.h[i - 1] && !isNA(S_.av[i]) && c.b.v[i] > S_.av[i] * p.volMult;
    let ex = false;
    if (pos.in && pos.entryBar >= 2) ex = c.b.c[i] < c.b.h[pos.entryBar - 2];   // 缺口下緣 = 訊號根的前一根高點
    return { enter: gap, exit: ex, stop: pos.in ? pos.avg * (1 - p.sl / 100) : NA }; } });

S({ id: 'inst_buy', name: '法人連買', cat: '台股常用', file: '台股常用策略', needs: 'inst',
  params: { days: P(3, 1, 10, 1, '連買天數'), outDays: P(2, 1, 10, 1, '連賣出場天數'), maLen: P(20, 5, 60, 1, '均線濾網') },
  entry: '三大法人合計連續 3 日淨買超，且收盤站上 20 日均線', exit: '三大法人連續 2 日淨賣超，或跌破均線',
  prep(c, p) { return { m: sma(c.b.c, p.maLen) }; },
  sig(i, S_, pos, p, c) { const e = EX(c); if (!e || !e.hasInst) return { enter: false, exit: false };
    let buyN = 0, sellN = 0;
    for (let k = 0; k < p.days; k++) { if (i - k >= 0 && e.instNet[i - k] > 0) buyN++; }
    for (let k = 0; k < p.outDays; k++) { if (i - k >= 0 && e.instNet[i - k] < 0) sellN++; }
    return { enter: buyN === p.days && !isNA(S_.m[i]) && c.b.c[i] > S_.m[i],
      exit: sellN === p.outDays || (!isNA(S_.m[i]) && c.b.c[i] < S_.m[i]) }; } });

S({ id: 'rev_high', name: '月營收創新高', cat: '台股常用', file: '台股常用策略', needs: 'rev',
  params: { maLen: P(20, 5, 60, 1, '出場均線'), sl: P(10, 3, 30, .5, '停損 %') },
  entry: '最新公布的月營收創近 12 個月新高（以次月 10 日為知悉日，不偷看未來）', exit: '收盤跌破 20 日均線；−10% 停損',
  prep(c, p) { return { m: sma(c.b.c, p.maLen) }; },
  sig(i, S_, pos, p, c) { const e = EX(c); if (!e || !e.hasRev) return { enter: false, exit: false };
    const isNew = e.revNew[i] && !isNA(e.revVal[i]) && !isNA(e.revHigh[i]) && e.revVal[i] > e.revHigh[i];
    return { enter: isNew, exit: !isNA(S_.m[i]) && c.b.c[i] < S_.m[i], stop: pos.in ? pos.avg * (1 - p.sl / 100) : NA }; } });

S({ id: 'margin_down', name: '融資減少（籌碼沉澱）', cat: '台股常用', file: '台股常用策略', needs: 'margin',
  params: { days: P(5, 2, 30, 1, '比較天數'), pct: P(5, 1, 30, .5, '融資減幅 %'), maLen: P(20, 5, 60, 1, '均線濾網') },
  entry: '融資餘額較 5 日前減少 5% 以上，但股價仍站穩 20 日均線（籌碼沉澱）', exit: '跌破均線，或融資回補 5% 以上',
  prep(c, p) { return { m: sma(c.b.c, p.maLen) }; },
  sig(i, S_, pos, p, c) { const e = EX(c); if (!e || !e.hasMargin) return { enter: false, exit: false };
    const j = i - p.days;
    if (j < 0 || isNA(e.marginBal[i]) || isNA(e.marginBal[j]) || !e.marginBal[j]) return { enter: false, exit: false };
    const chg = (e.marginBal[i] - e.marginBal[j]) / e.marginBal[j] * 100;
    const above = !isNA(S_.m[i]) && c.b.c[i] > S_.m[i];
    return { enter: chg <= -p.pct && above, exit: (!isNA(S_.m[i]) && c.b.c[i] < S_.m[i]) || chg >= p.pct }; } });

S({ id:'full_candle', name:'Full Candle', cat:'其他', file:'strategies/other/Full Candle.pine',
  params:{ len:P(10,3,40,1,'EMA 長度'), shadow:P(5,1,30,1,'影線上限 %') },
  entry:'實體幾乎無上影線（影線 ≤ 5%）的紅 K，且站上 EMA10', exit:'獲利 > 0.2% 後出現下一根紅 K',
  prep(c,p){ return { e:ema(c.b.c,p.len) }; },
  sig(i,S_,pos,p,c){ const cs=c.b.h[i]-c.b.l[i]; if(cs<=0) return {enter:false,exit:false};
    const sh=c.b.c[i]>c.b.o[i]?c.b.h[i]-c.b.c[i]:c.b.c[i]-c.b.l[i];
    const sp=sh*100/cs;
    const en=c.b.c[i]>c.b.o[i]&&!isNA(S_.e[i])&&c.b.c[i]>S_.e[i]&&sp<=p.shadow;

S({ id:'improvising', name:'Improvising', cat:'其他', file:'strategies/other/Improvising [Alorse].pine',

/* ---------------- 自訂移植 ---------------- */
/* 來源：TradingView「Dual CCI 整合版」indicator。原腳本只產生訊號、無進出場，
   且為雙向；本平台只做多，依既有慣例把空方訊號當作出場。
   原腳本中 delta_A / delta_B（波動度自適應斜率）只餵診斷表、未參與任何訊號條件，
   平滑 MA／布林預設 "None" 也不進訊號，兩者皆未移植。 */
S({ id:'dual_cci', name:'Dual CCI 雙週期', cat:'均值回歸', file:'自訂移植／TradingView「Dual CCI 整合版」',
  params:{ srcMode:P(1,0,1,1,'來源（0=收盤 1=hlc3）'),
    lenA:P(55,10,120,1,'CCI_A 週期'), lenB:P(144,40,250,2,'CCI_B 週期'), smaLen:P(20,5,60,1,'CCI 均線'),
    mode:P(2,0,2,1,'訊號模式（0=交叉 1=Tri 2=兩者）'),
    bullTh:P(-50,-150,0,10,'金叉：CCI_A 需低於'), bearTh:P(50,0,150,10,'死叉：CCI_A 需高於'),
    triBullLo:P(-100,-200,-50,10,'TriBull 下限'), triBullHi:P(-50,-120,0,10,'TriBull 上限'),
    triBearLo:P(50,0,120,10,'TriBear 下限'), triBearHi:P(100,50,200,10,'TriBear 上限'),
    bOff:P(0,0,100,10,'CCI_B 放寬量') },
  note:'建議回測期間 ≥ 2 年。CCI_B 預設 144 搭配 20 期均線，熱身期就吃掉 163 根；在「近 1 年」（約 250 根）之下樣本內只剩十餘根有效資料，參數最佳化的結果不具意義。原腳本的 cci_b_offset 預設 0（程式碼）但其註解寫 50，本平台採用程式碼的 0。',
  entry:'金叉：CCI_A 上穿自身均線，且仍在低檔（< −50）並已站上 CCI_B；或 Tri Bull 首次成立：CCI_A 落在 −100～−50、站上 CCI_B，且 CCI_B 站上自身均線',
  exit:'空方對稱訊號（死叉或 Tri Bear 首次成立）。原指標為雙向，本平台只做多，故空方訊號作為出場',
  prep(c,p){
    const src = p.srcMode >= 1 ? hlc3(c.b) : c.b.c;
    const A = cci(src, Math.round(p.lenA)), B = cci(src, Math.round(p.lenB));
    const mA = sma(A, Math.round(p.smaLen)), mB = sma(B, Math.round(p.smaLen));
    const tBull = A.map((v,i)=> !isNA(v)&&!isNA(B[i])&&!isNA(mB[i]) && v>B[i] && B[i]>mB[i]-p.bOff && v>=p.triBullLo && v<p.triBullHi);
    const tBear = A.map((v,i)=> !isNA(v)&&!isNA(B[i])&&!isNA(mB[i]) && v<B[i] && B[i]<mB[i]+p.bOff && v>p.triBearLo && v<=p.triBearHi);
    return { A, B, gc:crossover(A,mA), dc:crossunder(A,mA),
      bull: tBull.map((v,i)=> v && !tBull[i-1]),      // 只在首次觸發時進場
      bear: tBear.map((v,i)=> v && !tBear[i-1]) }; },
  sig(i,S_,pos,p){
    const A = S_.A[i], B = S_.B[i];
    if (isNA(A) || isNA(B)) return { enter:false, exit:false };
    const useX = p.mode !== 1, useT = p.mode !== 0;
    return { enter: !!((useX && S_.gc[i] && A < p.bullTh && A > B) || (useT && S_.bull[i])),
             exit:  !!((useX && S_.dc[i] && A > p.bearTh && A < B) || (useT && S_.bear[i])) }; } });

/* ---------------- 熱身期需求 ----------------
   以下每一支都已逐行核對 prep/sig：長週期指標是進場的硬需求
   （sig 裡以 isNA 直接擋掉，或 NA 參與比較恆為 false），
   資料根數不足時不可能產生任何訊號——那是「沒跑成」，不是「沒有交易」。 */
Object.entries({
  trend_ema_rsi:   p => p.cc,                               // 需 S_.a[i] > S_.cc[i]（EMA C）
  three_ema_cross: p => p.t,                                // 進場需站上趨勢線 EMA t
  rsi_ema:         p => p.ma2,                              // 進場明寫 !isNA(S_.b[i])（EMA 2）
  rsi_1200:        p => p.emaLen * 5,                       // 週線 EMA，約 5 倍日線根數
  stochrsi_st:     p => p.maLen,                            // 進場需 close > EMA maLen
  bb_aroon:        p => p.ar + 1,                           // highestbars(h, ar+1)，且 sig 以 isNA 擋
  bb_breakout:     p => Math.max(p.smaLen, p.stdLen) + 1,   // +1：crossover 需前一根
  omar_mmr:        p => p.cc,                               // 進場明寫 !isNA(S_.cc[i])
  ttm_squeeze_ema: p => p.cc,                               // 進場明寫 !isNA(S_.cc[i])（EMA 2500）
  dual_cci:        p => {
    const x = Math.max(p.lenB, p.lenA + p.smaLen - 1) + 1;  // 交叉：需 cci_B 與 sma(cci_A)，+1 給 crossover
    const t = p.lenB + p.smaLen - 1;                        // Tri：需 sma(cci_B)
    return p.mode === 0 ? x : p.mode === 1 ? t : Math.max(x, t);
  },
}).forEach(([id, fn]) => { const st = STRATS.find(x => x.id === id); if (st) st.minBars = fn; });

<script>
/* ---------- 台股升降單位（TWSE 股票）與交易單位 ---------- */
function tickSize(p, market) {
  if (market === 'US') return 0.01;
  if (p < 10) return 0.01;
  if (p < 50) return 0.05;
  if (p < 100) return 0.1;
  if (p < 500) return 0.5;
  if (p < 1000) return 1;
  return 5;
}
function roundTick(p, dir, market) {        // dir=+1 買進無條件進位、-1 賣出無條件捨去（皆對自己不利）
  if (!CFG.tick) return p;
  const t = tickSize(p, market);
  const k = dir > 0 ? Math.ceil(p / t) : Math.floor(p / t);
  return Math.round(k * t * 1e6) / 1e6;
}
function roundQty(shares) {
  if (CFG.lotMode === 'frac') return shares;
  if (CFG.lotMode === 'lot') { const L = MK.key === 'TW' ? 1000 : 1; return Math.floor(shares / L) * L; }
  return Math.floor(shares);                // share：整張＋零股，等同取整股
}
const commission = amt => Math.max(amt * CFG.fee / 100, amt > 0 ? (CFG.feeMin || 0) : 0);

/* =========================================================================
   回測引擎 — 訊號後次根開盤成交、現股做多、100% 權益部位
   成本：手續費（買賣雙邊）、證交稅／規費（賣出）、滑價 — 數值依市場切換
   ========================================================================= */
/* 市場設定：資料集欄位、基準指數、成本預設值都依市場切換 */
const MARKETS = {
  TW: {
    key: 'TW', label: '台股', ds: 'TaiwanStockPrice', info: 'TaiwanStockInfo',
    f: { o: 'open', h: 'max', l: 'min', c: 'close', v: 'Trading_Volume' },
    adj: true, bench: 'TAIEX',
    benches: [['TAIEX', '加權指數 TAIEX（不含息）'], ['TAIEX_TR', '加權報酬指數（含息）']],
    cur: 'NT$', defSym: '6672', hint: '上市櫃 4 碼',
    batch: '2330,2454,2317,3008,6672',
    cost: { fee: 0.1425, tax: 0.3, slip: 0.1, cap: 1000000, gap: 9.5, feeMin: 20, tick: 1 },
    taxLabel: '證交稅 %（賣出）',
    src: 'FinMind TaiwanStockPrice',
    note: '台股現股：手續費 0.1425% 雙邊、證交稅 0.3% 賣出課徵。還原權息由 TaiwanStockDividendResult 與 TaiwanStockSplitPrice 的參考價自行回推（FinMind 免費方案沒有還原序列）。減資的資料集需付費，故未處理。'
  },
  US: {
    key: 'US', label: '美股', ds: 'USStockPrice', info: 'USStockInfo',
    f: { o: 'Open', h: 'High', l: 'Low', c: 'Close', v: 'Volume' },
    adj: true, bench: '^GSPC',
    benches: [['^GSPC', 'S&P 500'], ['^DJI', '道瓊工業指數'], ['QQQ', 'Nasdaq 100（QQQ）'], ['SPY', 'S&P 500 ETF（SPY）']],
    cur: 'US$', defSym: 'AAPL', hint: '如 AAPL、MSFT、NVDA',
    batch: 'AAPL,MSFT,NVDA,AMZN,TSLA',
    cost: { fee: 0, tax: 0.0028, slip: 0.05, cap: 100000, gap: 0, feeMin: 0, tick: 1 },
    taxLabel: '交易規費 %（賣出）',
    src: 'FinMind USStockPrice',
    note: '美股多數券商零佣金，賣出僅收 SEC／FINRA 規費（極小且每年調整，預設 0.0028% 為概估值，請依實際帳單調整）。'
  }
};
let MK = MARKETS.TW;
const CFG = { fee: 0.1425, tax: 0.3, slip: 0.1, cap: 1000000, rf: 0, oos: 30, adj: true, bench: 'TAIEX', gap: 9.5, mkt: 0,
  sizing: 'full', sizePct: 100, sizeFixed: 200000, riskPct: 1, atrMult: 2, trail: 0, maxLoss: 0,
  feeMin: 20, lotMode: 'share', tick: 1, skipZeroVol: 1 };
const TD = 252;

function makeCtx(bars, dates, bench) {
  const b = { o: bars.map(r => r[1]), h: bars.map(r => r[2]), l: bars.map(r => r[3]), c: bars.map(r => r[4]), v: bars.map(r => r[5]) };
  const ctx = { b, dates, n: b.c.length, bench };
  ctx.wk = weeklyResample(b, dates);
  ctx.atr14 = atr(b, 14);
  return ctx;
}

function runStrategy(st, ctx, params) {
  const p = params || Object.fromEntries(Object.entries(st.params).map(([k, v]) => [k, v.d]));
  // 熱身期不足＝指標算不出值＝根本沒跑成，要和「有跑但沒觸發訊號」分開
  const need = st.minBars ? Math.ceil(st.minBars(p)) : 0;
  if (need > ctx.n) return {
    eq: new Array(ctx.n).fill(CFG.cap), trades: [], inMkt: new Array(ctx.n).fill(0),
    params: p, name: st.name, id: st.id, cat: st.cat,
    voided: 0, deferred: 0, blocked: 0, suspended: 0, signalNow: null, short: need };
  let S_; try { S_ = st.prep(ctx, p); } catch (e) { return { error: String(e) }; }
  const n = ctx.n, b = ctx.b;
  const buyC = 1 + CFG.slip / 100, selC = 1 - CFG.slip / 100;
  const feeB = CFG.fee / 100, feeS = (CFG.fee + CFG.tax) / 100;

  let cash = CFG.cap, size = 0;
  const MKT = MK.key;
  const pos = { in: false, avg: 0, entryBar: -1, bars: 0, ud: {} };
  const eq = new Array(n).fill(CFG.cap);
  const trades = []; const inMkt = new Array(n).fill(0);
  let pendE = false, pendX = false, lastStop = NA, lastLim = NA, open = null;

  const doBuy = (i, px) => {
    const price = px * buyC;
    const equity = cash + size * b.c[i];
    let budget;                                        // 這一筆要投入多少錢
    switch (CFG.sizing) {
      case 'pct':   budget = equity * CFG.sizePct / 100; break;
      case 'fixed': budget = CFG.sizeFixed; break;
      case 'atr': {                                    // ATR 風險定額：每筆只賭權益的 riskPct%
        const a = ctx.atr14[i];
        if (isNA(a) || a <= 0) { budget = equity; break; }
        const stopDist = a * CFG.atrMult;
        budget = Math.min(equity, (equity * CFG.riskPct / 100) / (stopDist / price) );
        pos.atrStop = price - stopDist;
        break;
      }
      default: budget = cash;                          // full：原本的全押行為
    }
    budget = Math.max(0, Math.min(budget, cash));
    const px2 = roundTick(price, +1, MKT);            // 成交價對齊升降單位
    const amt = budget / (1 + feeB);
    size = roundQty(amt / px2);                      // 整張＋零股（或整張、或分數股）
    if (size <= 0) { return; }
    let cost = size * px2 + commission(size * px2);
    if (cost > cash) {                               // 取整後若超出現金，退一單位
      size = roundQty(size - (CFG.lotMode === 'lot' ? (MKT === 'TW' ? 1000 : 1) : 1));
      if (size <= 0) { return; }
      cost = size * px2 + commission(size * px2);
      if (cost > cash) { size = 0; return; }
    }
    cash -= cost;
    pos.in = true; pos.avg = px2; pos.entryBar = i; pos.bars = 0; pos.ud = {};
    pos.peak = px2;
    open = { i0: i, d0: ctx.dates[i], p0: px2, cost, qty: size };
  };
  const doSell = (i, px, why, isOpen) => {
    const price = roundTick(px * selC, -1, MKT);
    const gross = size * price;
    const proceeds = gross - commission(gross) - gross * CFG.tax / 100;
    cash += proceeds;
    // MAE / MFE：持有期間相對進場價的最大不利與最大有利偏移
    let mn = Infinity, mx = -Infinity;
    for (let k = open.i0; k <= i; k++) { if (b.l[k] < mn) mn = b.l[k]; if (b.h[k] > mx) mx = b.h[k]; }
    trades.push({ ...open, i1: i, d1: ctx.dates[i], p1: price, why, openPos: !!isOpen,
      pnl: proceeds - open.cost, ret: proceeds / open.cost - 1, bars: i - open.i0,
      mae: isFinite(mn) ? mn / open.p0 - 1 : NA, mfe: isFinite(mx) ? mx / open.p0 - 1 : NA });
    size = 0; pos.in = false; pos.avg = 0; pos.entryBar = -1; pos.bars = 0; pos.ud = {}; pos.peak = 0; pos.atrStop = NA; open = null;
    lastStop = NA; lastLim = NA;
  };

  const lim = CFG.gap || 0;
  let voided = 0, deferred = 0, blocked = 0, suspended = 0;
  for (let i = 0; i < n; i++) {
    // 1) 前一根送出的委託，於本根開盤成交
    //    台股有 ±10% 漲跌停：開盤即漲停就買不到、跌停鎖死就賣不掉
    let gapUp = false, gapDn = false, locked = false;
    if (i > 0 && lim > 0) {
      const pc = b.c[i - 1];
      gapUp = b.o[i] >= pc * (1 + lim / 100);
      gapDn = b.o[i] <= pc * (1 - lim / 100);
      locked = gapDn && b.h[i] === b.l[i];          // 無量跌停鎖死
    }
    const halted = CFG.skipZeroVol && b.v[i] === 0;   // 零成交量視為處置／暫停交易
    if (halted) { suspended++; }
    if (i > 0 && !halted) {
      if (pendX) {
        if (!pos.in) pendX = false;
        else if (gapDn) deferred++;                 // 賣不掉，委託留到下一根
        else { doSell(i, b.o[i], '訊號'); pendX = false; }
      }
      if (pendE) {
        if (pos.in) pendE = false;
        else if (gapUp) { voided++; pendE = false; } // 買不到，訊號作廢
        else { doBuy(i, b.o[i]); pendE = false; }
      }
    } else if (i === 0) { pendE = false; pendX = false; }
    // 2) 盤中停損 / 停利（以前一根算出的價位）；鎖死或停止交易時無法成交
    if (pos.in && i > pos.entryBar && !locked && !halted) {
      if (!isNA(lastStop) && b.l[i] <= lastStop) doSell(i, Math.min(b.o[i], lastStop), '停損');
      else if (!isNA(lastLim) && b.h[i] >= lastLim) doSell(i, Math.max(b.o[i], lastLim), '停利');
    }
    if (pos.in) pos.bars++;
    // 3) 產生本根訊號
    let s;
    try { s = st.sig(i, S_, pos, p, ctx) || {}; } catch (e) { s = {}; }
    if (halted) s = { enter: false, exit: false };
    lastStop = isNA(s.stop) ? NA : s.stop; lastLim = isNA(s.limit) ? NA : s.limit;
    if (pos.in) {                                      // 風控疊加層：取最嚴格（最高）的停損價
      if (b.c[i] > (pos.peak || 0)) pos.peak = b.c[i];
      const cand = [];
      if (!isNA(lastStop)) cand.push(lastStop);
      if (CFG.trail > 0 && pos.peak) cand.push(pos.peak * (1 - CFG.trail / 100));
      if (CFG.maxLoss > 0) cand.push(pos.avg * (1 - CFG.maxLoss / 100));
      if (CFG.sizing === 'atr' && !isNA(pos.atrStop)) cand.push(pos.atrStop);
      if (cand.length) lastStop = Math.max(...cand);
    }
    if (halted) { inMkt[i] = pos.in ? 1 : 0; eq[i] = cash + size * b.c[i]; continue; }
    if (pos.in) { if (s.exit) pendX = true; }
    else if (s.enter) {
      if (ctx.mktOK && !ctx.mktOK[i]) blocked++;     // 大盤濾網擋下
      else pendE = true;
    }
    inMkt[i] = pos.in ? 1 : 0;
    eq[i] = cash + size * b.c[i];
  }
  const signalNow = {
    action: pendE ? '買進' : (pendX ? '賣出' : (pos.in ? '持有中' : '空手')),
    inPos: pos.in,
    entryPrice: pos.in ? pos.avg : NA,
    unreal: pos.in ? b.c[n - 1] / pos.avg - 1 : NA,
    bars: pos.in ? pos.bars : 0,
    blockedNow: !!(ctx.mktOK && !ctx.mktOK[n - 1] && !pos.in)
  };
  if (pos.in) doSell(n - 1, b.c[n - 1], '尚未平倉', true);
  eq[n - 1] = cash + size * b.c[n - 1];
  return { eq, trades, inMkt, params: p, name: st.name, id: st.id, cat: st.cat, voided, deferred, blocked, suspended, signalNow };
}

/* ---------- 績效指標 ---------- */
const retsOf = eq => eq.slice(1).map((v, i) => eq[i] === 0 ? 0 : v / eq[i] - 1);
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NA;
function sd(a) { if (a.length < 2) return NA; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1)); }
function sharpe(r) { const s = sd(r); if (!s) return NA; return (mean(r) - CFG.rf / 100 / TD) / s * Math.sqrt(TD); }
function sortino(r) { if (r.length < 2) return NA; const dd = Math.sqrt(r.reduce((s, v) => s + (v < 0 ? v * v : 0), 0) / r.length); if (!dd) return NA; return (mean(r) - CFG.rf / 100 / TD) / dd * Math.sqrt(TD); }
function ddStats(eq) {                 // 最長回撤期間（根數）與目前是否仍在回撤
  let pk = eq[0], pkI = 0, maxLen = 0, cur = 0, recover = NA, deepest = 0, deepI = 0;
  for (let i = 1; i < eq.length; i++) {
    if (eq[i] >= pk) {
      if (cur > 0 && isNA(recover) && deepI > 0) recover = i - deepI;
      pk = eq[i]; pkI = i; cur = 0;
    } else {
      cur = i - pkI;
      if (cur > maxLen) maxLen = cur;
      const d = eq[i] / pk - 1;
      if (d < deepest) { deepest = d; deepI = i; }
    }
  }
  return { ddLen: maxLen, inDD: cur > 0, curDD: cur, recover };
}
function maxDD(eq) { let pk = eq[0], m = 0; for (const v of eq) { if (v > pk) pk = v; const d = v / pk - 1; if (d < m) m = d; } return m; }
function beta(r, br) { const k = Math.min(r.length, br.length); if (k < 3) return NA; const a = r.slice(-k), c = br.slice(-k); const mb = mean(c); const vb = c.reduce((s, v) => s + (v - mb) ** 2, 0) / k; if (!vb) return NA; const ma = mean(a); return a.reduce((s, v, i) => s + (v - ma) * (c[i] - mb), 0) / k / vb; }

function metrics(res, ctx, benchRet) {
  const eq = res.eq, n = eq.length, r = retsOf(eq);
  const tot = eq[n - 1] / eq[0] - 1;
  const ann = r.length ? Math.pow(1 + tot, TD / r.length) - 1 : NA;
  const mdd = maxDD(eq);
  const closed = res.trades.filter(t => !t.openPos);
  const w = closed.filter(t => t.pnl > 0), l = closed.filter(t => t.pnl <= 0);
  const gp = w.reduce((s, t) => s + t.pnl, 0), gl = -l.reduce((s, t) => s + t.pnl, 0);
  const cut = Math.floor(r.length * (1 - CFG.oos / 100));
  return {
    id: res.id, name: res.name, cat: res.cat, eq, trades: res.trades, params: res.params, inMkt: res.inMkt,
    voided: res.voided || 0, deferred: res.deferred || 0, blocked: res.blocked || 0, suspended: res.suspended || 0, signalNow: res.signalNow,
    short: res.short || 0,                      // > 0 表示資料根數不足，數值 = 最少需要幾根
    tot, ann, sharpe: sharpe(r), sortino: sortino(r), mdd,
    calmar: (mdd && !isNA(ann)) ? ann / Math.abs(mdd) : NA,
    win: closed.length ? w.length / closed.length : NA,
    pf: gl > 0 ? gp / gl : (gp > 0 ? Infinity : NA),
    nT: closed.length, nOpen: res.trades.length - closed.length,
    hold: res.inMkt.reduce((a, b) => a + b, 0) / n,
    oos: sharpe(r.slice(cut)),
    beta: beta(r, benchRet),
    vol: sd(r) * Math.sqrt(TD),
    rets: r,
    ...tradeQuality(closed, w, l, gp, eq)
  };
}
function tradeQuality(closed, w, l, gp, eq) {
  const d = ddStats(eq);
  if (!closed.length) return { conc1: NA, conc3: NA, expect: NA, loseStreak: 0, avgMAE: NA, worstMAE: NA, avgMFE: NA, ddLen: d.ddLen, inDD: d.inDD, curDD: d.curDD, recover: d.recover };
  const wins = w.map(t => t.pnl).sort((a, b) => b - a);
  let ls = 0, mls = 0;
  closed.forEach(t => { if (t.pnl <= 0) { ls++; if (ls > mls) mls = ls; } else ls = 0; });
  const maes = closed.map(t => t.mae).filter(v => !isNA(v));
  const mfes = closed.map(t => t.mfe).filter(v => !isNA(v));
  return {
    conc1: gp > 0 && wins.length ? wins[0] / gp : NA,                       // 最大一筆佔總獲利
    conc3: gp > 0 && wins.length ? wins.slice(0, 3).reduce((a, b) => a + b, 0) / gp : NA,
    expect: mean(closed.map(t => t.ret)),                                    // 每筆期望報酬
    loseStreak: mls,
    avgMAE: maes.length ? mean(maes) : NA,
    worstMAE: maes.length ? Math.min(...maes) : NA,
    avgMFE: mfes.length ? mean(mfes) : NA,
    ddLen: d.ddLen, inDD: d.inDD, curDD: d.curDD, recover: d.recover
  };
}
function buyHold(ctx, benchRet) {
  const c = ctx.b.c, eq = c.map(v => CFG.cap * v / c[0]);
  return Object.assign(metrics({ eq, trades: [], inMkt: c.map(() => 1), params: {}, name: '買進持有（基準）', id: '__bh', cat: '基準' }, ctx, benchRet),
    { win: NA, pf: NA, nT: NA });
}
function runAll(ctx) {
  const br = ctx.bench ? retsOf(ctx.bench) : [];
  // 大盤濾網：加權指數在 N 日均線之下時不開新倉
  ctx.mktOK = null;
  if (CFG.mkt > 0 && ctx.bench) {
    const m = sma(ctx.bench, CFG.mkt);
    ctx.mktOK = ctx.bench.map((v, i) => (isNA(m[i]) || isNA(v)) ? true : v >= m[i]);
  }
  const t0 = performance.now();
  const rows = STRATS.map(st => metrics(runStrategy(st, ctx), ctx, br));
  const bh = buyHold(ctx, br);
  return { rows, bh, ms: Math.round(performance.now() - t0), br };
}
</script>

<script>
/* =========================================================================
   介面層
   ========================================================================= */
const $ = s => document.querySelector(s);
const el = (t, a = {}, h = '') => { const e = document.createElement(t); Object.assign(e, a); if (h) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
/* CSV 欄位跳脫：含逗號／引號／換行就加引號，內部引號成對。
   策略名如「KD 黃金交叉（台股 9,3,3）」本身含逗號，不跳脫會把欄位切錯。 */
const csvCell = v => { const t = (v === null || v === undefined) ? '' : String(v);
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
const csvRow = a => a.map(csvCell).join(',');
const pc = (v, d = 1) => isNA(v) ? '—' : (v >= 0 ? '+' : '') + (v * 100).toFixed(d) + '%';
const pu = (v, d = 1) => isNA(v) ? '—' : (v * 100).toFixed(d) + '%';
const nf = (v, d = 2) => isNA(v) ? '—' : (v === Infinity ? '∞' : v.toFixed(d));
const cls = v => isNA(v) ? 'dim' : (v > 0 ? 'up' : v < 0 ? 'dn' : '');
const dsp = d => d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8);

let APP = { ctx: null, res: null, sel: null, krange: '250', filter: '全部', sortKey: 'sharpe', sortDir: -1, name: '', sym: '', source: '' };

/* ---------- SVG 折線圖 ---------- */
function lineChart(series, opt = {}) {
  const W = opt.w || 760, H = opt.h || 260, padL = 52, padR = 12, padT = 14, padB = 24;
  const all = series.flatMap(s => s.data.filter(v => !isNA(v)));
  let mn = opt.min !== undefined ? opt.min : Math.min(...all), mx = opt.max !== undefined ? opt.max : Math.max(...all);
  if (mn === mx) { mn -= 1; mx += 1; }
  const pad = (mx - mn) * .06; mn -= pad; mx += pad;
  const N = series[0].data.length;
  const X = i => padL + (W - padL - padR) * (N < 2 ? 0 : i / (N - 1));
  const Y = v => padT + (H - padT - padB) * (1 - (v - mn) / (mx - mn));
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = mn + (mx - mn) * k / 4, y = Y(v);
    g += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity=".09"/>
<text x="${padL - 7}" y="${y + 4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".5">${opt.fmt ? opt.fmt(v) : nf(v, 0)}</text>`;
  }
  for (const s of series) {
    let d = '', started = false;
    s.data.forEach((v, i) => { if (isNA(v)) return; d += (started ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; started = true; });
    if (s.area) g += `<path d="${d}L${X(N - 1)} ${Y(mn)} L${X(0)} ${Y(mn)} Z" fill="${s.color}" fill-opacity=".14" stroke="none"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 1.8}" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="4 3"' : ''}/>`;
  }
  if (opt.labels) {
    const step = Math.max(1, Math.floor(N / 6));
    for (let i = 0; i < N; i += step) g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".45">${opt.labels[i].slice(2, 6)}</text>`;
  }
  if (opt.marks) for (const m of opt.marks) {
    if (isNA(series[0].data[m.i])) continue;
    g += `<circle cx="${X(m.i)}" cy="${Y(series[0].data[m.i])}" r="3" fill="${m.c}" stroke="#0a1120" stroke-width="1"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--tx)">${g}</svg>`;
}

/* ---------- K 線圖（含買賣點與成交量） ---------- */
function candleChart(ctx, trades, range, upTo) {
  const n = (upTo === undefined || upTo === null) ? ctx.n : Math.min(ctx.n, upTo + 1), b = ctx.b;
  const from = range === 'all' ? 0 : Math.max(0, n - range);
  const N = n - from;
  if (N < 2) return '<div class="empty">資料不足</div>';
  const W = 1000, H = 300, VH = 72, padL = 8, padR = 56, padT = 10, padB = 20;
  const inner = W - padL - padR;
  const cw = Math.max(1.2, Math.min(14, inner / N * 0.68));
  const X = i => padL + inner * ((i - from) + 0.5) / N;

  let mn = Infinity, mx = -Infinity, vmx = 0;
  for (let i = from; i < n; i++) { if (b.l[i] < mn) mn = b.l[i]; if (b.h[i] > mx) mx = b.h[i]; if (b.v[i] > vmx) vmx = b.v[i]; }
  const pad = (mx - mn) * 0.06 || 1; mn -= pad; mx += pad;
  const Y = v => padT + (H - padT - padB) * (1 - (v - mn) / (mx - mn));
  const VY = v => H + VH - 6 - (VH - 10) * (vmx ? v / vmx : 0);

  let g = '';
  for (let k = 0; k <= 4; k++) {                       // 價格格線與右側刻度
    const v = mn + (mx - mn) * k / 4, y = Y(v);
    g += `<line x1="${padL}" x2="${W - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-opacity=".08"/>
<text x="${W - padR + 6}" y="${(y + 4).toFixed(1)}" font-size="10" fill="currentColor" opacity=".5">${v.toFixed(v > 100 ? 0 : 2)}</text>`;
  }
  // 持倉區間底色
  const held = new Array(n).fill(0);
  trades.forEach(t => { for (let i = t.i0; i <= t.i1; i++) held[i] = t.ret >= 0 ? 1 : -1; });
  let runStart = -1;
  for (let i = from; i <= n; i++) {
    const v = i < n ? held[i] : 0;
    if (v !== 0 && runStart < 0) runStart = i;
    if ((v === 0 || i === n) && runStart >= 0) {
      const x0 = X(runStart) - cw / 2, x1 = X(i - 1) + cw / 2;
      g += `<rect x="${x0.toFixed(1)}" y="${padT}" width="${Math.max(1, x1 - x0).toFixed(1)}" height="${(H - padT - padB).toFixed(1)}"
        fill="${held[runStart] > 0 ? 'var(--up)' : 'var(--dn)'}" fill-opacity=".07"/>`;
      runStart = -1;
    }
  }
  // K 棒與成交量（台股慣例：紅漲綠跌）
  for (let i = from; i < n; i++) {
    const up = b.c[i] >= b.o[i], col = up ? 'var(--up)' : 'var(--dn)';
    const x = X(i), yo = Y(b.o[i]), yc = Y(b.c[i]);
    const top = Math.min(yo, yc), hgt = Math.max(0.8, Math.abs(yc - yo));
    g += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${Y(b.h[i]).toFixed(1)}" y2="${Y(b.l[i]).toFixed(1)}" stroke="${col}" stroke-width="1"/>
<rect x="${(x - cw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${cw.toFixed(1)}" height="${hgt.toFixed(1)}" fill="${col}"/>
<rect x="${(x - cw / 2).toFixed(1)}" y="${VY(b.v[i]).toFixed(1)}" width="${cw.toFixed(1)}" height="${(H + VH - 6 - VY(b.v[i])).toFixed(1)}" fill="${col}" fill-opacity=".45"/>`;
  }
  // 買賣點
  trades.forEach(t => {
    if (t.i0 >= from) {
      const x = X(t.i0), y = Y(b.l[t.i0]) + 13;
      g += `<path d="M${x.toFixed(1)} ${(y - 8).toFixed(1)} l5 9 l-10 0 Z" fill="var(--up)"><title>進場 ${dsp(t.d0)} @ ${t.p0.toFixed(2)}</title></path>`;
    }
    if (t.i1 >= from && !t.openPos) {
      const x = X(t.i1), y = Y(b.h[t.i1]) - 13;
      g += `<path d="M${x.toFixed(1)} ${(y + 8).toFixed(1)} l5 -9 l-10 0 Z" fill="var(--dn)"><title>${t.why} ${dsp(t.d1)} @ ${t.p1.toFixed(2)} ${pc(t.ret, 1)}</title></path>`;
    }
  });
  // 日期軸
  const step = Math.max(1, Math.floor(N / 7));
  for (let i = from; i < n; i += step)
    g += `<text x="${X(i).toFixed(1)}" y="${(H + VH + 10).toFixed(1)}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".45">${dsp(ctx.dates[i]).slice(2)}</text>`;
  g += `<line x1="${padL}" x2="${W - padR}" y1="${H + VH - 6}" y2="${H + VH - 6}" stroke="currentColor" stroke-opacity=".15"/>`;
  return `<svg viewBox="0 0 ${W} ${H + VH + 16}" style="width:100%;height:auto;color:var(--tx)">${g}</svg>`;
}

/* ---------- 教學播放 ---------- */
let PLAY = { on: false, i: 0, timer: null, speed: 420, speak: false, note: '' };
function playNarrate(txt) {
  PLAY.note = txt;
  const el2 = document.getElementById('playNote');
  if (el2) el2.innerHTML = txt;
  if (PLAY.speak && window.speechSynthesis) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt.replace(/<[^>]+>/g, ''));
      u.lang = 'zh-TW'; u.rate = 1.05;
      const v = speechSynthesis.getVoices().find(x => /zh[-_]TW|Chinese.*Taiwan/i.test(x.lang + x.name));
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) { }
  }
}
function playStop() {
  PLAY.on = false;
  if (PLAY.timer) { clearInterval(PLAY.timer); PLAY.timer = null; }
  if (window.speechSynthesis) try { window.speechSynthesis.cancel(); } catch (e) { }
}
function playStart(r, ctx) {
  playStop();
  const marks = {};
  r.trades.forEach((t, k) => {
    marks[t.i0] = `第 <b>${k + 1}</b> 筆：<b class="up">進場</b> ${dsp(t.d0)} @ ${t.p0.toFixed(2)}。` +
      `${esc(STRATS.find(x => x.id === r.id) ? STRATS.find(x => x.id === r.id).entry : '')}`;
    if (!t.openPos) marks[t.i1] = `第 <b>${k + 1}</b> 筆：<b class="dn">${t.why}出場</b> ${dsp(t.d1)} @ ${t.p1.toFixed(2)}，` +
      `持有 ${t.bars} 根，報酬 <b class="${cls(t.ret)}">${pc(t.ret, 2)}</b>，期間最深浮虧 ${pc(t.mae, 1)}。`;
  });
  PLAY.on = true;
  PLAY.i = Math.max(20, (r.trades[0] ? r.trades[0].i0 - 15 : 20));
  const host = document.getElementById('playChart');
  const tick = () => {
    if (!PLAY.on) return;
    PLAY.i++;
    if (PLAY.i >= ctx.n) { playStop(); playNarrate('播放結束。'); renderPlayUI(r, ctx); return; }
    if (host) host.innerHTML = candleChart(ctx, r.trades.filter(t => t.i0 <= PLAY.i), APP.krange === 'all' ? 'all' : +APP.krange, PLAY.i);
    const pr = document.getElementById('playPos'); if (pr) pr.textContent = `${PLAY.i + 1} / ${ctx.n}　${dsp(ctx.dates[PLAY.i])}`;
    if (marks[PLAY.i]) {                      // 遇到買賣點自動暫停
      playStop(); playNarrate(marks[PLAY.i]); renderPlayUI(r, ctx);
    }
  };
  PLAY.timer = setInterval(tick, PLAY.speed);
  renderPlayUI(r, ctx);
  playNarrate('開始播放。遇到買賣點會自動暫停並說明原因。');
}
function renderPlayUI(r, ctx) {
  const b = document.getElementById('playBtn');
  if (b) b.textContent = PLAY.on ? '⏸ 暫停' : '▶ 播放';
}

/* ---------- KPI 卡 ---------- */
function renderKPIs() {
  const K = $('#kpis'); if (!APP.res) { K.innerHTML = ''; return; }
  const { rows, bh } = APP.res;
  const traded = rows.filter(r => r.nT > 0 || r.nOpen > 0);
  const shortRows = rows.filter(r => r.short);                    // 資料不足：根本沒跑成
  const noTrade = rows.filter(r => !r.short && !r.nT && !r.nOpen); // 沒有交易：有跑但沒觸發
  const best = traded.slice().sort((a, b) => (isNA(b.sharpe) ? -9 : b.sharpe) - (isNA(a.sharpe) ? -9 : a.sharpe))[0];
  const beatAnn = traded.filter(r => r.ann > bh.ann).length;
  const beatShp = traded.filter(r => r.sharpe > bh.sharpe).length;
  const lvl = riskLevel(bh.vol, bh.beta);
  // 未成交清單可能長達十幾支，全列會被硬截斷；只顯示前 3 支，完整清單放 title
  const ntNames = noTrade.map(r => esc(r.name));
  const ntAll = ntNames.join('、');
  const ntBrief = (!ntNames.length ? '全部有效策略都有成交'
    : ntNames.length <= 3 ? ntAll
    : ntNames.slice(0, 3).join('、') + `…另 ${ntNames.length - 3} 支`)
    + (shortRows.length ? `　·　另有 ${shortRows.length} 支資料不足` : '');
  const ntTitle = ntAll + (shortRows.length
    ? `\n\n資料不足（需更長回測期間）：${shortRows.map(r => `${esc(r.name)}（需 ≥ ${r.short} 根）`).join('、')}` : '');
  K.innerHTML = `
  <div class="kpi"><div class="k">標的買進持有 · 年化</div><div class="v ${cls(bh.ann)}">${pc(bh.ann)}</div>
    <div class="f">夏普 ${nf(bh.sharpe)} · 最大回撤 ${pc(bh.mdd)}</div></div>
  <div class="kpi"><div class="k">夏普最高策略</div><div class="v sm" style="color:var(--teal)"${best ? ` title="${esc(best.name)}"` : ''}>${best ? esc(best.name) : '—'}</div>
    <div class="f">${best ? `夏普 ${nf(best.sharpe)} · 年化 <span class="${cls(best.ann)}">${pc(best.ann)}</span> · ${best.nT} 筆` : '本期無任何策略成交'}</div></div>
  <div class="kpi"><div class="k">年化報酬贏過買進持有</div><div class="v">${beatAnn} <span class="dim" style="font-size:17px">/ ${traded.length}</span></div>
    <div class="f">夏普贏過持有：${beatShp} 支</div></div>
  <div class="kpi"><div class="k">標的風險等級</div><div class="v sm" style="color:${lvl.c}">${lvl.t}</div>
    <div class="f">年化波動 ${pu(bh.vol)} · Beta ${nf(bh.beta)}</div></div>

function insertBase(list, bh, k) {

    <div class="ph"><h2>${isWF ? 'Walk-Forward 驗證' : '參數最佳化'}</h2>
      <span class="dim" style="font-size:12px">· ${isWF ? '分段最佳化、只採計沒看過的那一段' : '網格掃描，單格 = 一次完整回測'}</span><div class="sp"></div>
      ${opt('oStrat', OPT.id, STRATS.map(s => [s.id, s.name]))}

             : opt('oP2', OPT.p2, keys.map(k => [k, st.params[k].label]), 1)}

      <button class="btn primary" id="oRun">▶ ${isWF ? '執行 Walk-Forward' : '執行掃描'}</button></div>
    <div id="optOut" style="padding:0 18px 18px">${isWF ? wfPanel() : (OPT.grid ? optTable(st) : `<div class="empty">選好策略與要掃描的 1–2 個參數後按「執行掃描」</div>`)}</div></div>`;
  $('#oStrat').onchange = e => { OPT.id = e.target.value; OPT.p1 = null; OPT.p2 = null; OPT.grid = null; WF.res = null; renderOpt(); };
  $('#oP1').onchange = e => { OPT.p1 = e.target.value; OPT.grid = null; WF.res = null; renderOpt(); };
