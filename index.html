function axisVals(pd, steps) {
  const out = []; const span = pd.hi - pd.lo; const stp = Math.max(pd.st, span / (steps - 1));
  for (let v = pd.lo; v <= pd.hi + 1e-9 && out.length < steps; v += stp) out.push(+(Math.round(v / pd.st) * pd.st).toFixed(4));
  return [...new Set(out)];
}
function runOpt() {
  const st = STRATS.find(s => s.id === OPT.id), base = Object.fromEntries(Object.entries(st.params).map(([k, v]) => [k, v.d]));
  const a1 = axisVals(st.params[OPT.p1], OPT.steps);
  const a2 = OPT.p2 ? axisVals(st.params[OPT.p2], OPT.steps) : [null];
  const br = APP.res.br, cells = [];
  for (const v2 of a2) for (const v1 of a1) {
    const p = { ...base, [OPT.p1]: v1 }; if (OPT.p2) p[OPT.p2] = v2;
    const m = metrics(runStrategy(st, APP.ctx, p), APP.ctx, br);
    cells.push({ v1, v2, m });
  }
  OPT.grid = { a1, a2, cells, base }; renderOpt();
}
function optTable(st) {
  const { a1, a2, cells } = OPT.grid, k = OPT.metric;
  const vals = cells.map(c => isNA(c.m[k]) || c.m[k] === Infinity ? -1e9 : c.m[k]).filter(v => v > -1e8);
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const bestCell = cells.reduce((b, c) => ((isNA(c.m[k]) ? -1e9 : c.m[k]) > (isNA(b.m[k]) ? -1e9 : b.m[k]) ? c : b), cells[0]);

  /* 參數穩定度：單格最高分很可能是雜訊，鄰域一起好才算穩健區。
     對每一格取「自己 + 相鄰格」的平均，再挑鄰域平均最高、且自身不低於中位數的格子標 ★。 */
  const idx = (i1, i2) => cells.find(c => c.v1 === a1[i1] && c.v2 === a2[i2]);
  const val = c => (!c || isNA(c.m[k]) || c.m[k] === Infinity) ? NA : c.m[k];
  const nb = {};
  for (let i2 = 0; i2 < a2.length; i2++) for (let i1 = 0; i1 < a1.length; i1++) {
    const acc = [];
    for (let d2 = -1; d2 <= 1; d2++) for (let d1 = -1; d1 <= 1; d1++) {
      const j1 = i1 + d1, j2 = i2 + d2;
      if (j1 < 0 || j1 >= a1.length || j2 < 0 || j2 >= a2.length) continue;
      if (a2.length === 1 && d2 !== 0) continue;
      const v = val(idx(j1, j2)); if (!isNA(v)) acc.push(v);
    }
    nb[i1 + '_' + i2] = acc.length >= 2 ? mean(acc) : NA;     // 只有自己一格不算鄰域
  }
  const nbVals = Object.values(nb).filter(v => !isNA(v)).sort((x, y) => y - x);
  const nbCut = nbVals.length ? nbVals[Math.max(0, Math.floor(nbVals.length * 0.15) - 1)] : NA;
  const sortedVals = vals.slice().sort((x, y) => x - y);
  const medVal = sortedVals.length ? sortedVals[Math.floor(sortedVals.length / 2)] : NA;
  const isStar = (i1, i2) => { const n2 = nb[i1 + '_' + i2], v = val(idx(i1, i2));
    return !isNA(n2) && !isNA(v) && !isNA(nbCut) && n2 >= nbCut && v >= medVal; };
  let robust = null, robustN = -Infinity;
  for (let i2 = 0; i2 < a2.length; i2++) for (let i1 = 0; i1 < a1.length; i1++) {
    const n2 = nb[i1 + '_' + i2];
    if (!isNA(n2) && n2 > robustN && isStar(i1, i2)) { robustN = n2; robust = idx(i1, i2); }
  }
  const col = v => { if (isNA(v) || v === Infinity) return 'background:rgba(255,255,255,.03);color:var(--dim)'; const t = mx === mn ? .5 : (v - mn) / (mx - mn); return `background:rgba(45,212,191,${(0.08 + t * 0.62).toFixed(3)});color:${t > .55 ? '#04201c' : 'var(--tx)'}`; };
  const fm = v => k === 'ann' || k === 'tot' ? pc(v, 0) : nf(v);
  const dflt = st.params[OPT.p1].d;
  const head = `<tr><th></th>${a1.map(v => `<th style="font-size:11px">${v}${v === dflt ? '<span style="color:var(--gold)">*</span>' : ''}</th>`).join('')}</tr>`;
  const body = a2.map((v2, i2) => `<tr><td style="text-align:right;color:var(--mut);font-size:11.5px">${OPT.p2 ? v2 : st.params[OPT.p1].label}</td>
    ${a1.map((v1, i1) => { const c = cells.find(x => x.v1 === v1 && x.v2 === v2); const star = isStar(i1, i2);
      return `<td style="${col(c.m[k])};cursor:pointer${star ? ';outline:1.5px solid var(--gold);outline-offset:-2px' : ''}"
        title="交易 ${c.m.nT} 筆 · 年化 ${pc(c.m.ann)} · 回撤 ${pc(c.m.mdd)}${star ? ' · ★ 鄰域也表現好（穩健區）' : ''}"
        data-v1="${v1}" data-v2="${v2}">${fm(c.m[k])}${star ? '<span style="color:var(--gold)">★</span>' : ''}</td>`; }).join('')}</tr>`).join('');
  const d = bestCell.m;
  setTimeout(() => document.querySelectorAll('#optOut td[data-v1]').forEach(td => td.onclick = () => {
    const c = OPT.grid.cells.find(x => String(x.v1) === td.dataset.v1 && String(x.v2) === td.dataset.v2); if (c) alert(`${st.name}\n${st.params[OPT.p1].label} = ${c.v1}${OPT.p2 ? `\n${st.params[OPT.p2].label} = ${c.v2}` : ''}\n\n總報酬 ${pc(c.m.tot)}　年化 ${pc(c.m.ann)}\n夏普 ${nf(c.m.sharpe)}　卡瑪 ${nf(c.m.calmar)}\n最大回撤 ${pc(c.m.mdd)}　交易 ${c.m.nT} 筆\n勝率 ${isNA(c.m.win) ? '—' : (c.m.win * 100).toFixed(0) + '%'}　獲利因子 ${nf(c.m.pf)}`); }), 0);
  return `<div style="font-size:12.5px;color:var(--mut);margin:4px 0 12px">欄 = <b style="color:var(--tx)">${esc(st.params[OPT.p1].label)}</b>${OPT.p2 ? `　列 = <b style="color:var(--tx)">${esc(st.params[OPT.p2].label)}</b>` : ''}　顏色 = ${$('#oM').selectedOptions[0].text}　<span style="color:var(--gold)">*</span> = 原始預設值　<span style="color:var(--gold)">★</span> = 連同鄰域一起表現好的穩健區　（共 ${OPT.grid.cells.length} 次回測）</div>
  <div style="overflow:auto"><table class="heat">${head}${body}</table></div>
  <div class="warn" style="margin-top:14px">
  <b>單格最佳：</b>${esc(st.params[OPT.p1].label)} = <b>${bestCell.v1}</b>${OPT.p2 ? `、${esc(st.params[OPT.p2].label)} = <b>${bestCell.v2}</b>` : ''}　→　夏普 ${nf(d.sharpe)}、年化 ${pc(d.ann)}、回撤 ${pc(d.mdd)}、交易 ${d.nT} 筆。<br>
  ${robust ? `<b style="color:var(--gold)">★ 穩健最佳：</b>${esc(st.params[OPT.p1].label)} = <b>${robust.v1}</b>${OPT.p2 ? `、${esc(st.params[OPT.p2].label)} = <b>${robust.v2}</b>` : ''}　→　夏普 ${nf(robust.m.sharpe)}、年化 ${pc(robust.m.ann)}、交易 ${robust.m.nT} 筆。
  <b>要用就用這一組</b>——它連同周圍的參數都表現良好，比較不可能是雜訊。<br>` : '<b style="color:var(--up)">找不到穩健區</b>：沒有任何一格的鄰域一起表現良好，代表這個參數的效果很可能全是雜訊。<br>'}
  ⚠ 這是<b>單一標的、單一期間</b>的網格最佳化，極易過度配適（overfitting）。熱力圖上一整片都好的區域，才比較可能是真實的參數穩健區；只有孤立一格特別好，通常是雜訊。</div>`;
}

/* =========================================================================
   隨機基準檢定（蒙地卡羅）
   虛無假說：交易筆數與每筆持有長度都與實際策略相同，但「進場時點隨機」。
   若策略夏普落不進隨機分布的右尾，代表它的進出場時機沒有資訊含量——
   漂亮的數字只是從 30 支策略裡挑出運氣最好的那一支。
   ========================================================================= */
let MC = { iters: 1000, rows: null, sel: null, dist: {}, running: false };

/* 讓出主執行緒但不被背景分頁節流：setTimeout(0) 在隱藏分頁會被 clamp 到 1 秒以上，
   MessageChannel 的訊息是不受該限制的 macrotask。 */
const yieldNow = (() => {
  if (typeof MessageChannel === 'function') {
    const ch = new MessageChannel();
    let resolve = null;
    ch.port1.onmessage = () => { const r = resolve; resolve = null; if (r) r(); };
    return () => new Promise(r => { resolve = r; ch.port2.postMessage(0); });
  }
  return () => new Promise(r => setTimeout(r, 0));
})();

function mcOnce(ctx, holds, W) {
  const n = ctx.n, o = ctx.b.o, c = ctx.b.c, k = holds.length;
  const buyC = 1 + CFG.slip / 100, selC = 1 - CFG.slip / 100;
  const feeB = CFG.fee / 100, feeS = (CFG.fee + CFG.tax) / 100;

  // 1) 洗牌持有長度（Fisher-Yates）
  const h = W.h;
  for (let i = 0; i < k; i++) h[i] = holds[i];
  for (let i = k - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = h[i]; h[i] = h[j]; h[j] = t; }

  // 2) 把剩餘的空手根數隨機分配到各個間隙（stars and bars）
  let sum = 0; for (let i = 0; i < k; i++) sum += h[i];
  const G = (n - 1) - 1 - sum - (k - 1);
  if (G < 0) return NA;
  const cc = W.cuts.subarray(0, k);
  for (let i = 0; i < k; i++) cc[i] = (Math.random() * (G + 1)) | 0;
  cc.sort();

  let prev = 0, pos = 1;
  for (let i = 0; i < k; i++) {
    pos += cc[i] - prev; prev = cc[i];
    W.st[i] = pos; W.en[i] = pos + h[i];
    pos = W.en[i] + 1;
  }

  // 3) 以相同的成本模型模擬權益曲線
  let cash = 1, size = 0, ti = 0;
  const eq = W.eq;
  for (let i = 0; i < n; i++) {
    if (ti < k && i === W.st[ti]) { const p = o[i] * buyC; size = cash / (1 + feeB) / p; cash -= size * p * (1 + feeB); }
    else if (ti < k && i === W.en[ti]) { const p = o[i] * selC; cash += size * p * (1 - feeS); size = 0; ti++; }
    eq[i] = cash + size * c[i];
  }

  // 4) 夏普
  const N = n - 1, r = W.r;
  let m = 0;
  for (let i = 1; i < n; i++) { const x = eq[i] / eq[i - 1] - 1; r[i - 1] = x; m += x; }
  m /= N;
  let v = 0; for (let i = 0; i < N; i++) { const d = r[i] - m; v += d * d; }
  const sd = Math.sqrt(v / (N - 1));
  return sd ? (m - CFG.rf / 100 / TD) / sd * Math.sqrt(TD) : NA;
}

function mcWorkspace(n, kMax) {
  return { h: new Int32Array(kMax), cuts: new Int32Array(kMax), st: new Int32Array(kMax),
           en: new Int32Array(kMax), eq: new Float64Array(n), r: new Float64Array(n) };
}

async function runMC() {
  if (MC.running || !APP.res) return;
  MC.running = true; MC.rows = null; MC.dist = {};
  MC.iters = +$('#mcIters').value;
  const cand = APP.res.rows.filter(r => r.trades.length >= 2 && !isNA(r.sharpe));
  const W = mcWorkspace(APP.ctx.n, Math.max(2, ...cand.map(r => r.trades.length)));
  const out = [];
  for (let ci = 0; ci < cand.length; ci++) {
    const r = cand[ci];
    $('#mcOut').innerHTML = `<div class="empty"><span class="spin"></span> 檢定中 ${ci + 1}/${cand.length}　${esc(r.name)}
      <div class="bar" style="max-width:320px;margin:14px auto 0"><i style="width:${((ci / cand.length) * 100).toFixed(1)}%"></i></div></div>`;
    await yieldNow();
    const holds = r.trades.map(t => Math.max(1, t.bars));
    const arr = new Float64Array(MC.iters);
    let ok = 0;
    const CH = 500;                                     // 單一區塊上限，避免長時間卡住 UI
    for (let base = 0; base < MC.iters; base += CH) {
      const end = Math.min(MC.iters, base + CH);
      for (let i = base; i < end; i++) { const v = mcOnce(APP.ctx, holds, W); if (!isNA(v)) arr[ok++] = v; }
      if (end < MC.iters) await yieldNow();
    }
    if (!ok) { out.push({ ...r, mcNA: true }); continue; }
    const a = Array.from(arr.subarray(0, ok)).sort((x, y) => x - y);
    const q = p => a[Math.min(a.length - 1, Math.max(0, Math.floor(p * (a.length - 1))))];
    let below = 0; for (const v of a) if (v < r.sharpe) below++;
    const pct = below / a.length;
    out.push({ id: r.id, name: r.name, cat: r.cat, nT: r.nT, nOpen: r.nOpen, sharpe: r.sharpe, ann: r.ann,
      mcMed: q(0.5), mcP95: q(0.95), mcMax: a[a.length - 1], pct, pval: 1 - pct, n: a.length });
    MC.dist[r.id] = a;
  }
  // Benjamini-Hochberg FDR：30+ 支策略各做一次檢定，不校正的話「至少一支顯著」幾乎必然發生
  const m = out.filter(r => !r.mcNA).length;
  const sorted = out.filter(r => !r.mcNA).slice().sort((a, b) => a.pval - b.pval);
  let prev = 1;
  for (let i = sorted.length - 1; i >= 0; i--) {
    const q = Math.min(1, sorted[i].pval * m / (i + 1));
    prev = Math.min(prev, q);
    sorted[i].qval = prev;
  }
  out.forEach(r => { r.bonf = isNA(r.pval) ? NA : Math.min(1, r.pval * m); r.m = m; });
  MC.rows = out; MC.running = false;
  if (!MC.sel && out.length) MC.sel = out.slice().sort((x, y) => x.pval - y.pval)[0].id;
  renderMC();
}

function mcVerdict(p, q) {
  const use = (q === undefined || isNA(q)) ? p : q;
  if (use <= 0.05) return { t: '顯著', c: 'var(--dn)', d: '校正多重比較後仍達顯著' };
  if (p <= 0.05) return { t: '校正後不顯著', c: 'var(--gold)', d: '單獨看 p ≤ 0.05，但把「同時檢定數十支」算進去後就不成立了' };
  if (p <= 0.20) return { t: '存疑', c: 'var(--gold)', d: '贏過多數隨機排列，但還不到統計顯著' };
  return { t: '與隨機無異', c: 'var(--up)', d: '隨機進場也能輕易做到同樣的結果' };
}

/* ---------- 成本敏感度 ---------- */
let COST = { mults: [0.5, 1, 2, 3], rows: null, summary: null, running: false };

function runCost() {
  if (!APP.res || COST.running) return;
  COST.running = true;
  const base = { fee: CFG.fee, tax: CFG.tax, slip: CFG.slip };
  const per = {}, summary = [];
  for (const m of COST.mults) {
    CFG.fee = base.fee * m; CFG.tax = base.tax * m; CFG.slip = base.slip * m;
    const R = runAll(APP.ctx);
    const traded = R.rows.filter(r => r.nT > 0 || r.nOpen > 0);
    const shs = traded.map(r => r.sharpe).filter(v => !isNA(v)).sort((a, b) => a - b);
    const best = traded.slice().sort((a, b) => (isNA(b.sharpe) ? -9 : b.sharpe) - (isNA(a.sharpe) ? -9 : a.sharpe))[0];
    summary.push({
      m, beatAnn: traded.filter(r => r.ann > R.bh.ann).length,
      beatSh: traded.filter(r => r.sharpe > R.bh.sharpe).length,
      traded: traded.length,
      posAnn: traded.filter(r => r.ann > 0).length,
      medSh: shs.length ? shs[Math.floor(shs.length / 2)] : NA,
      best: best ? best.name : '—', bestSh: best ? best.sharpe : NA
    });
    R.rows.forEach(r => { (per[r.id] = per[r.id] || { name: r.name, cat: r.cat, nT: r.nT, v: {} }).v[m] = { sharpe: r.sharpe, ann: r.ann }; });
  }
  CFG.fee = base.fee; CFG.tax = base.tax; CFG.slip = base.slip;
  COST.rows = Object.values(per).filter(x => x.nT > 0);
  COST.summary = summary; COST.running = false;
  renderMC();
}

function costTable() {
  if (!COST.summary) {
    return `<div class="empty">把手續費、稅費與滑價整組乘上 0.5／1／2／3 倍重跑，<br>

  }
  const S = COST.summary, base = COST.summary.find(x => x.m === 1);
  const rows = COST.rows.slice().sort((a, b) => (b.v[1].sharpe || -9) - (a.v[1].sharpe || -9));
  const die = rows.filter(r => r.v[1].ann > 0 && r.v[2] && r.v[2].ann <= 0).length;
  return `
  <div class="warn" style="margin:0 0 14px">成本放大 2 倍後，原本年化為正的策略有 <b>${die}</b> 支由正轉負。
    基準成本為手續費 ${CFG.fee}%、稅費 ${CFG.tax}%、滑價 ${CFG.slip}%。買進持有不受成本影響（只買一次）。</div>
  <div class="tblwrap" style="max-height:240px"><table><thead><tr>
    <th>成本倍率</th><th>手續費</th><th>稅費</th><th>滑價</th><th>年化為正</th><th>贏過持有(年化)</th><th>贏過持有(夏普)</th><th>夏普中位數</th><th>最佳策略</th><th>最佳夏普</th></tr></thead>
    <tbody>${S.map(x => `<tr${x.m === 1 ? ' class="base"' : ''}>
      <td><b>×${x.m}</b></td><td class="mono dim">${(CFG.fee * x.m).toFixed(4)}%</td><td class="mono dim">${(CFG.tax * x.m).toFixed(4)}%</td><td class="mono dim">${(CFG.slip * x.m).toFixed(3)}%</td>
      <td>${x.posAnn} / ${x.traded}</td><td>${x.beatAnn} / ${x.traded}</td><td>${x.beatSh} / ${x.traded}</td>
      <td class="mono">${nf(x.medSh)}</td><td style="text-align:left;color:var(--teal)">${esc(x.best)}</td><td class="mono">${nf(x.bestSh)}</td></tr>`).join('')}
    </tbody></table></div>
  <div style="font-size:13px;color:var(--mut);margin:16px 0 6px">各策略的夏普隨成本變化　<span class="dim">· 紅色代表該倍率下年化已轉負</span></div>
  <div class="tblwrap" style="max-height:380px"><table><thead><tr>
    <th>策略</th><th>類別</th><th>交易數</th>${COST.mults.map(m => `<th>×${m}</th>`).join('')}<th>耐受度</th></tr></thead>
    <tbody>${rows.map(r => {
      let tol = '—';
      for (let i = COST.mults.length - 1; i >= 0; i--) { const m = COST.mults[i]; if (r.v[m] && r.v[m].ann > 0) { tol = '×' + m; break; } }
      if (r.v[0.5] && r.v[0.5].ann <= 0) tol = '始終為負';
      return `<tr><td>${esc(r.name)}</td><td><span class="tag ${r.cat}">${r.cat}</span></td><td>${r.nT}</td>
        ${COST.mults.map(m => { const v = r.v[m]; if (!v || isNA(v.sharpe)) return '<td class="dim">—</td>';
          return `<td class="mono" style="color:${v.ann > 0 ? 'var(--tx)' : 'var(--up)'}">${nf(v.sharpe)}</td>`; }).join('')}
        <td style="color:${tol === '始終為負' ? 'var(--up)' : tol === '×3' ? 'var(--dn)' : 'var(--gold)'}">${tol}</td></tr>`;
    }).join('')}</tbody></table></div>
  <div class="rules" style="font-size:12.8px;color:var(--mut);margin-top:14px;line-height:1.8">
    <b style="color:var(--tx)">耐受度</b>＝年化報酬仍為正的最高成本倍率。
    只在 ×0.5 或 ×1 才成立的策略，代表它的優勢比摩擦成本還薄——
    實際交易時券商折扣、流動性、成交價差任何一項不如預期，它就不成立了。
    值得採用的策略應該在 <b style="color:var(--dn)">×2 以上</b>仍為正。
  </div>`;
}

/* ---------- 交易序列模擬 ----------
   打亂順序：同一組已實現交易換順序重算。乘積不變，所以最終報酬每次都一樣，
             只有「路徑」會變——變的是最大回撤。
   重抽樣：  從已實現交易中有放回地重抽同樣筆數，最終報酬與回撤都會變。 */
let SEQ = { id: null, mode: 'shuffle', iters: 1000, res: null, running: false };

function seqRun() {
  if (!APP.res || SEQ.running) return;
  const r = APP.res.rows.find(x => x.id === SEQ.id);
  if (!r || r.trades.length < 3) { SEQ.res = { tooFew: true }; renderMC(); return; }
  SEQ.running = true;
  const rets = r.trades.map(t => t.ret), k = rets.length, N = SEQ.iters;
  const finals = new Float64Array(N), dds = new Float64Array(N);
  const path = new Float64Array(k + 1);
  for (let it = 0; it < N; it++) {
    let eq = 1, pk = 1, mdd = 0;
    if (SEQ.mode === 'shuffle') {
      const a = rets.slice();
      for (let i = k - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
      for (let i = 0; i < k; i++) { eq *= (1 + a[i]); if (eq > pk) pk = eq; const d = eq / pk - 1; if (d < mdd) mdd = d; }
    } else {
      for (let i = 0; i < k; i++) { eq *= (1 + rets[(Math.random() * k) | 0]); if (eq > pk) pk = eq; const d = eq / pk - 1; if (d < mdd) mdd = d; }
    }
    finals[it] = eq - 1; dds[it] = mdd;
  }
  // 實際路徑
  let eq = 1, pk = 1, amdd = 0;
  for (let i = 0; i < k; i++) { eq *= (1 + rets[i]); if (eq > pk) pk = eq; const d = eq / pk - 1; if (d < amdd) amdd = d; }
  const q = (arr, p) => { const a = Array.from(arr).sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.max(0, Math.floor(p * (a.length - 1))))]; };
  SEQ.res = { name: r.name, k, iters: N, mode: SEQ.mode,
    actFinal: eq - 1, actDD: amdd,
    fin: { p5: q(finals, .05), p25: q(finals, .25), p50: q(finals, .5), p75: q(finals, .75), p95: q(finals, .95) },
    dd: { p5: q(dds, .05), p25: q(dds, .25), p50: q(dds, .5), p75: q(dds, .75), p95: q(dds, .95), worst: Math.min(...dds) },
    ddArr: Array.from(dds).sort((x, y) => x - y), finArr: Array.from(finals).sort((x, y) => x - y),
    worseDD: Array.from(dds).filter(v => v < amdd).length / N };
  SEQ.running = false; renderMC();
}

function seqPanel() {
  const cand = APP.res.rows.filter(r => r.trades.length >= 3).sort((a, b) => (isNA(b.sharpe) ? -9 : b.sharpe) - (isNA(a.sharpe) ? -9 : a.sharpe));
  if (!cand.length) return `<div class="empty">沒有任何策略的交易筆數達到 3 筆，無法做序列模擬。</div>`;
  if (!SEQ.id || !cand.find(c => c.id === SEQ.id)) SEQ.id = cand[0].id;
  const R = SEQ.res;
  const sel = `<select id="seqStrat" style="background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:9px;padding:7px 10px;font-size:13px">
    ${cand.map(c => `<option value="${c.id}" ${c.id === SEQ.id ? 'selected' : ''}>${esc(c.name)}（${c.trades.length} 筆）</option>`).join('')}</select>`;
  const modes = `<div class="chips">${[['shuffle', '打亂順序'], ['boot', '重抽樣']].map(m =>
    `<div class="chip ${m[0] === SEQ.mode ? 'on' : ''}" data-sq="${m[0]}">${m[1]}</div>`).join('')}</div>`;
  const iters = `<select id="seqIters" style="background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:9px;padding:7px 10px;font-size:13px">
    ${[500, 1000, 2000, 3000].map(v => `<option value="${v}" ${v === SEQ.iters ? 'selected' : ''}>${v} 次</option>`).join('')}</select>`;
  let body;
  if (!R) {
    body = `<div class="empty">把這支策略<b>已實現的每一筆交易報酬</b>重新排列或重抽，看最終報酬與最大回撤的分布。<br><br>
      <b>打亂順序</b>：同一組交易換順序。乘積不變，所以最終報酬每次都一樣，<b>只有回撤會變</b>——回答「我運氣好在順序」。<br>
      <b>重抽樣</b>：有放回地重抽同樣筆數。最終報酬與回撤都會變——回答「報酬本身有多少不確定性」。<br><br>按「執行模擬」開始。</div>`;
  } else if (R.tooFew) {
    body = `<div class="empty">這支策略的交易筆數不足 3 筆，無法模擬。</div>`;
  } else {
    const row = (k2, o, act, fm) => `<tr><td style="text-align:left">${k2}</td>
      <td class="mono">${fm(o.p5)}</td><td class="mono">${fm(o.p25)}</td><td class="mono"><b>${fm(o.p50)}</b></td>
      <td class="mono">${fm(o.p75)}</td><td class="mono">${fm(o.p95)}</td>
      <td class="mono" style="color:var(--teal)"><b>${fm(act)}</b></td></tr>`;
    body = `
    <div class="warn" style="margin:0 0 14px">
      <b>${esc(R.name)}</b>　${R.k} 筆交易　${R.iters} 次${R.mode === 'shuffle' ? '順序重排' : '重抽樣'}。<br>
      ${R.mode === 'shuffle'
        ? `最終報酬固定為 <b class="${cls(R.actFinal)}">${pc(R.actFinal)}</b>（換順序不改變乘積），但最大回撤在
           <b>${pc(R.dd.p95)}</b> 到 <b>${pc(R.dd.worst)}</b> 之間跑動。實際走到的 ${pc(R.actDD)} 落在第
           <b>${((1 - R.worseDD) * 100).toFixed(0)}</b> 百分位——${R.worseDD > 0.5
             ? `有 ${(R.worseDD * 100).toFixed(0)}% 的排列比實際更慘，代表<b>實際路徑算是運氣不錯的</b>。`
             : `只有 ${(R.worseDD * 100).toFixed(0)}% 的排列比實際更慘，代表實際路徑已偏向不利。`}`
        : `重抽 ${R.k} 筆後，最終報酬的 90% 區間是 <b class="${cls(R.fin.p5)}">${pc(R.fin.p5)}</b> ～ <b class="${cls(R.fin.p95)}">${pc(R.fin.p95)}</b>，
           中位數 <b>${pc(R.fin.p50)}</b>。實際的 ${pc(R.actFinal)} 只是這個分布裡的一次抽樣。`}
    </div>
    <div class="tblwrap" style="max-height:200px"><table><thead><tr>
      <th>項目</th><th>5%</th><th>25%</th><th>中位數</th><th>75%</th><th>95%</th><th>實際</th></tr></thead>
      <tbody>
        ${R.mode === 'boot' ? row('最終報酬', R.fin, R.actFinal, v => pc(v)) : ''}
        ${row('最大回撤', R.dd, R.actDD, v => pc(v))}
      </tbody></table></div>
    <div style="font-size:13px;color:var(--mut);margin:16px 0 6px">最大回撤分布（${R.iters} 次）</div>
    ${seqHist(R.ddArr, R.actDD, v => pc(v, 0))}
    ${R.mode === 'boot' ? `<div style="font-size:13px;color:var(--mut);margin:16px 0 6px">最終報酬分布</div>${seqHist(R.finArr, R.actFinal, v => pc(v, 0))}` : ''}
    <div class="rules" style="font-size:12.8px;color:var(--mut);margin-top:14px;line-height:1.85">
      <b style="color:var(--tx)">怎麼用：</b>看「最大回撤」那一列的 <b>5% 欄位</b>——那是同一組交易在壞運氣下會走出的回撤。
      如果你只準備好承受實際回測的 ${pc(R.actDD)}，但 5% 情境是 ${pc(R.dd.p5)}，那實際操作時很可能會在半路被洗出去。<br>
      <b style="color:var(--tx)">兩種模式的差別：</b>打亂順序保留了「這些交易確實發生過」這個事實，只問順序運氣；
      重抽樣則把交易當成同一個分布的抽樣，連「會不會出現這麼好的一批交易」都一起問。後者更嚴格。
    </div>`;
  }
  return `<div class="ph" style="padding-left:0"><h2 style="font-size:15px">交易序列模擬</h2>
      <span class="dim" style="font-size:12px">· 同一組交易，不同的順序或抽樣</span><div class="sp"></div>
      ${sel}${modes}${iters}<button class="btn primary" id="seqRunBtn">▶ 執行模擬</button></div>${body}`;
}
function seqHist(sorted, actual, fmt) {
  const bins = 36, mn = Math.min(sorted[0], actual), mx = Math.max(sorted[sorted.length - 1], actual);
  const w = (mx - mn) / bins || 1, h = new Array(bins).fill(0);
  sorted.forEach(v => h[Math.min(bins - 1, Math.floor((v - mn) / w))]++);
  const hm = Math.max(...h), W = 760, H = 180, pb = 24;
  const X = v => 10 + (W - 20) * (v - mn) / (mx - mn);
  let g = '';
  h.forEach((v, i) => { const x = 10 + (W - 20) * i / bins, bw = (W - 20) / bins - 1.5, bh = (H - pb - 12) * v / hm;
    const center = mn + w * (i + .5);
    g += `<rect x="${x.toFixed(1)}" y="${(H - pb - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5"
      fill="${center < actual ? 'var(--up)' : 'var(--blue)'}" fill-opacity=".6"/>`; });
  const xa = X(actual);
  g += `<line x1="${xa.toFixed(1)}" x2="${xa.toFixed(1)}" y1="6" y2="${H - pb}" stroke="var(--teal)" stroke-width="2"/>
    <text x="${Math.min(W - 80, xa + 6).toFixed(1)}" y="16" font-size="11" fill="var(--teal)">實際 ${fmt(actual)}</text>
    <line x1="10" x2="${W - 10}" y1="${H - pb}" y2="${H - pb}" stroke="currentColor" stroke-opacity=".2"/>
    <text x="10" y="${H - 7}" font-size="10" fill="currentColor" opacity=".5">${fmt(mn)}</text>
    <text x="${W - 10}" y="${H - 7}" text-anchor="end" font-size="10" fill="currentColor" opacity=".5">${fmt(mx)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--tx)">${g}</svg>`;
}

let MCTAB = 'mc';
function renderMC() {
  const P2 = $('#p-mc');
  if (!APP.res) { P2.innerHTML = `<div class="card empty">先載入資料並執行回測</div>`; return; }
  const sel = `<select id="mcIters" style="background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:9px;padding:7px 10px;font-size:13px">
    ${[200, 500, 1000, 2000, 5000].map(v => `<option value="${v}" ${v === MC.iters ? 'selected' : ''}>${v} 次</option>`).join('')}</select>`;
  let body;
  if (!MC.rows) {
    body = `<div class="empty">對每支策略產生 N 組「筆數與持有長度相同、但進場時點隨機」的交易，<br>
      得到夏普的分布，再看實際策略落在第幾百分位。<br><br>按「執行檢定」開始。</div>`;
  } else {
    const rawPass = MC.rows.filter(r => r.pval <= 0.05).length;
    const pass = MC.rows.filter(r => !isNA(r.qval) && r.qval <= 0.05).length;
    const doubt = MC.rows.filter(r => r.pval > 0.05 && r.pval <= 0.20).length;
    const mm = MC.rows.length, bonfCut = 0.05 / Math.max(1, mm);
    const rows = MC.rows.slice().sort((a, b) => a.pval - b.pval);
    const d = MC.dist[MC.sel], cur = MC.rows.find(r => r.id === MC.sel);
    body = `
    <div class="warn" style="margin:0 0 14px">檢定結果：<b>${mm}</b> 支有效策略，各跑 ${MC.iters} 次隨機排列。<br>
      未校正：<b>${rawPass}</b> 支 p ≤ 0.05。
      <b>經 Benjamini-Hochberg 多重比較校正後：<span style="color:${pass ? 'var(--dn)' : 'var(--up)'}">${pass}</span> 支達顯著</b>（q ≤ 0.05）。
      另有 <b style="color:var(--gold)">${doubt}</b> 支存疑、<b>${mm - rawPass - doubt}</b> 支與隨機無異。<br>
      <span class="dim">同時檢定 ${mm} 支，就算全是亂數也會有約 ${(mm * 0.05).toFixed(1)} 支「碰巧」p ≤ 0.05。
      Bonferroni 的嚴格門檻是 p ≤ ${bonfCut.toFixed(4)}。</span></div>
    <div class="tblwrap" style="max-height:430px"><table><thead><tr>
      <th>策略</th><th>類別</th><th>交易數</th><th>實際夏普</th><th>隨機中位數</th><th>隨機 95%</th><th>百分位</th><th>p 值</th><th title="Benjamini-Hochberg 多重比較校正">校正後 q</th><th>判定</th></tr></thead>
      <tbody>${rows.map(r => { const v = mcVerdict(r.pval, r.qval); return `<tr data-id="${r.id}" class="${r.id === MC.sel ? 'sel' : ''}">
        <td>${esc(r.name)}</td><td><span class="tag ${r.cat}">${r.cat}</span></td>
        <td>${r.nT}${r.nOpen ? ' <span class="dim">+' + r.nOpen + '</span>' : ''}</td>
        <td class="mono"><b>${nf(r.sharpe)}</b></td><td class="mono dim">${nf(r.mcMed)}</td>
        <td class="mono dim">${nf(r.mcP95)}</td>
        <td class="mono">${(r.pct * 100).toFixed(1)}%</td><td class="mono">${r.pval < 0.001 ? '&lt;0.001' : r.pval.toFixed(3)}</td>
        <td class="mono" style="color:${isNA(r.qval) ? 'var(--dim)' : (r.qval <= 0.05 ? 'var(--dn)' : 'var(--mut)')}">${isNA(r.qval) ? '—' : (r.qval < 0.001 ? '&lt;0.001' : r.qval.toFixed(3))}</td>
        <td style="color:${v.c};font-weight:600">${v.t}</td></tr>`; }).join('')}</tbody></table></div>
    ${cur && d ? `<div style="margin-top:18px">
      <div style="font-size:13px;color:var(--mut);margin-bottom:6px">
        <b style="color:var(--tx)">${esc(cur.name)}</b> 的隨機夏普分布（${d.length} 次）　
        <span class="dim">· 點上表任一列可切換</span></div>
      ${mcHist(d, cur)}
      <div class="note-ish" style="font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.8">
        ${mcVerdict(cur.pval, cur.qval).d}。實際夏普 <b class="mono" style="color:var(--teal)">${nf(cur.sharpe)}</b>
        落在隨機分布的第 <b>${(cur.pct * 100).toFixed(1)}</b> 百分位，
        p 值 <b>${cur.pval < 0.001 ? '<0.001' : cur.pval.toFixed(3)}</b>
        （${Math.round(cur.pval * cur.n)} / ${cur.n} 次隨機排列的表現不輸給它）、
        校正後 q 值 <b>${isNA(cur.qval) ? '—' : (cur.qval < 0.001 ? '<0.001' : cur.qval.toFixed(3))}</b>。</div>
    </div>` : ''}`;
  }
  const subs = [['mc', '🎲 隨機基準檢定'], ['cost', '💰 成本敏感度'], ['seq', '🔀 交易序列模擬']];
  const head = `<div class="subtabs">${subs.map(x => `<div class="subtab ${x[0] === MCTAB ? 'on' : ''}" data-s="${x[0]}">${x[1]}</div>`).join('')}</div>`;

  if (MCTAB === 'seq') {
    P2.innerHTML = `<div class="card">${head}<div style="padding:4px 18px 18px">${seqPanel()}</div></div>`;
    const sb = $('#seqRunBtn'); if (sb) sb.onclick = () => {
      SEQ.id = $('#seqStrat').value; SEQ.iters = +$('#seqIters').value; seqRun();
    };
    if ($('#seqStrat')) $('#seqStrat').onchange = e => { SEQ.id = e.target.value; SEQ.res = null; renderMC(); };
    P2.querySelectorAll('.chip[data-sq]').forEach(c => c.onclick = () => { SEQ.mode = c.dataset.sq; SEQ.res = null; renderMC(); });
  } else if (MCTAB === 'cost') {
    P2.innerHTML = `<div class="card">${head}
      <div class="ph"><h2>成本敏感度</h2><span class="dim" style="font-size:12px">· 把全部交易成本整組放大，看排行會不會垮</span>
        <div class="sp"></div><button class="btn primary" id="costRunBtn">▶ 執行掃描</button></div>
      <div style="padding:0 18px 18px">${costTable()}</div></div>`;
    const cb = $('#costRunBtn'); if (cb) cb.onclick = runCost;
  } else {
    P2.innerHTML = `<div class="card">${head}
      <div class="ph"><h2>隨機基準檢定</h2><span class="dim" style="font-size:12px">· 交易筆數與持有長度相同，只把進場時點隨機化</span>
        <div class="sp"></div>${sel}<button class="btn primary" id="mcRunBtn">▶ 執行檢定</button></div>
      <div id="mcOut" style="padding:0 18px 18px">${body}</div></div>
      <div class="card" style="margin-top:16px"><div class="ph"><h2>這張表在回答什麼</h2></div>
        <div style="padding:0 18px 18px" class="rules">
          排行榜是一次 <b>30 選 1</b> 的事後篩選——就算 30 支全是亂數訊號，也必然會有一支「看起來最好」。
          這一頁用來回答：<b>把這支策略的交易筆數與持有長度原封不動保留，只把進場時點打散，它還做得到同樣的成績嗎？</b><br><br>
          <b>p 值</b>＝隨機排列中表現不輸給實際策略的比例。p = 0.30 代表三成的隨機進場就能做到一樣好，那它的「選時能力」是幻覺。<br>
          <b>判定門檻：</b>p ≤ 0.05 顯著｜0.05 &lt; p ≤ 0.20 存疑｜p &gt; 0.20 與隨機無異。<br><br>
          <b>校正後 q 值（Benjamini-Hochberg）：</b>同時檢定 N 支策略時，就算全部都是亂數，
          也會有約 N × 5% 支「碰巧」p ≤ 0.05。BH 校正把這個偽陽性率算進去——
          <b>請以 q 值而不是 p 值做判斷</b>。表格的「判定」欄已經改用 q 值；
          標成「校正後不顯著」的，就是單獨看很漂亮、但放進整批比較就站不住的那種。<br><br>
          <b>仍要注意：</b>這個檢定只檢驗「進場時點是否帶有資訊」，不檢驗參數是否過度配適。
          真正值得採用的是<b>同時</b>通過本檢定（q ≤ 0.05）、成本耐受度 ×2 以上、樣本外夏普為正、且交易筆數足夠的策略。
        </div></div>`;
    const btn = $('#mcRunBtn'); if (btn) btn.onclick = runMC;
    P2.querySelectorAll('#p-mc tbody tr').forEach(tr => { if (tr.dataset.id) tr.onclick = () => { MC.sel = tr.dataset.id; renderMC(); }; });
  }
  P2.querySelectorAll('.subtab').forEach(t => t.onclick = () => { MCTAB = t.dataset.s; renderMC(); });
}

function mcHist(sorted, cur) {
  const bins = 40, mn = Math.min(sorted[0], cur.sharpe), mx = Math.max(sorted[sorted.length - 1], cur.sharpe);
  const w = (mx - mn) / bins || 1, h = new Array(bins).fill(0);
  sorted.forEach(v => h[Math.min(bins - 1, Math.floor((v - mn) / w))]++);
  const hm = Math.max(...h), W = 760, H = 220, pb = 26;
  const X = v => 10 + (W - 20) * (v - mn) / (mx - mn);
  let g = '';
  h.forEach((v, i) => {
    const x = 10 + (W - 20) * i / bins, bw = (W - 20) / bins - 1.5, bh = (H - pb - 14) * v / hm;
    const center = mn + w * (i + 0.5);
    g += `<rect x="${x.toFixed(1)}" y="${(H - pb - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5"
      fill="${center >= cur.sharpe ? 'var(--up)' : 'var(--blue)'}" fill-opacity=".6"></rect>`;
  });
  const xa = X(cur.sharpe);
  g += `<line x1="${xa.toFixed(1)}" x2="${xa.toFixed(1)}" y1="6" y2="${H - pb}" stroke="var(--teal)" stroke-width="2"/>
    <text x="${Math.min(W - 70, xa + 6).toFixed(1)}" y="16" font-size="11" fill="var(--teal)">實際 ${nf(cur.sharpe)}</text>
    <line x1="10" x2="${W - 10}" y1="${H - pb}" y2="${H - pb}" stroke="currentColor" stroke-opacity=".2"/>
    <text x="10" y="${H - 8}" font-size="10" fill="currentColor" opacity=".5">${nf(mn)}</text>
    <text x="${W - 10}" y="${H - 8}" text-anchor="end" font-size="10" fill="currentColor" opacity=".5">${nf(mx)}</text>
    <text x="${(W / 2).toFixed(0)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".45">隨機排列的夏普值</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--tx)">${g}</svg>`;
}

/* =========================================================================
   Walk-Forward：用前一段最佳化、在下一段驗證
   網格掃描是在全段資料上找最好的格子＝偷看答案。這裡只採計「沒看過的那一段」。
   作法：每個候選參數在完整資料上各跑一次（保持指標暖機），
   再分段取用權益曲線的報酬，避免切片造成指標重啟。
   ========================================================================= */
let WF = { folds: 5, res: null, running: false };

function sharpeRange(eq, a, b) {                  // 取 [a,b) 區間的日報酬夏普
  if (b - a < 3) return NA;
  const r = [];
  for (let i = Math.max(1, a); i < b; i++) r.push(eq[i] / eq[i - 1] - 1);
  return sharpe(r);
}
function retRange(eq, a, b) {
  const i0 = Math.max(0, a - 1);
  return (b - 1 > i0) ? eq[b - 1] / eq[i0] - 1 : NA;
}

function runWF() {
  if (!APP.res || WF.running) return;
  WF.running = true;
  const st = STRATS.find(x => x.id === OPT.id), base = Object.fromEntries(Object.entries(st.params).map(([k, v]) => [k, v.d]));
  const vals = axisVals(st.params[OPT.p1], OPT.steps);
  const n = APP.ctx.n, F = WF.folds;

  // 每個候選值各跑一次完整回測
  const runs = vals.map(v => ({ v, m: metrics(runStrategy(st, APP.ctx, { ...base, [OPT.p1]: v }), APP.ctx, APP.res.br) }));
  const defRun = runs.find(r => r.v === st.params[OPT.p1].d) ||
    { v: st.params[OPT.p1].d, m: metrics(runStrategy(st, APP.ctx, base), APP.ctx, APP.res.br) };

  // 切成 F+1 段：用第 i 段訓練、第 i+1 段測試
  const seg = i => [Math.floor(n * i / (F + 1)), Math.floor(n * (i + 1) / (F + 1))];
  const folds = [], oosRet = new Array(n).fill(0);
  for (let i = 0; i < F; i++) {
    const [ta, tb] = seg(i), [va, vb] = seg(i + 1);
    let best = null;
    for (const r of runs) {
      const sIS = sharpeRange(r.m.eq, ta, tb);
      if (isNA(sIS)) continue;
      if (!best || sIS > best.sIS) best = { v: r.v, sIS, run: r };
    }
    if (!best) { folds.push({ i, ta, tb, va, vb, na: true }); continue; }
    const sOOS = sharpeRange(best.run.m.eq, va, vb);
    const rOOS = retRange(best.run.m.eq, va, vb);
    const sDef = sharpeRange(defRun.m.eq, va, vb);
    const rDef = retRange(defRun.m.eq, va, vb);
    const sBH = sharpeRange(APP.res.bh.eq, va, vb);
    const rBH = retRange(APP.res.bh.eq, va, vb);
    for (let k = Math.max(1, va); k < vb; k++) oosRet[k] = best.run.m.eq[k] / best.run.m.eq[k - 1] - 1;
    folds.push({ i, ta, tb, va, vb, best: best.v, sIS: best.sIS, sOOS, rOOS, sDef, rDef, sBH, rBH });
  }

  // 串接樣本外權益曲線（只在測試段推進，其餘持平）
  const first = folds.find(f => !f.na);
  const start = first ? first.va : 0;
  const eqOOS = new Array(n).fill(NA);
  let e = 1;
  for (let i = start; i < n; i++) { e *= (1 + (oosRet[i] || 0)); eqOOS[i] = e; }
  const rr = []; for (let i = start + 1; i < n; i++) if (!isNA(eqOOS[i])) rr.push(eqOOS[i] / eqOOS[i - 1] - 1);
  const oosSharpe = sharpe(rr), oosTot = e - 1;
  const defTot = retRange(defRun.m.eq, start, n), defSharpe = sharpeRange(defRun.m.eq, start, n);
  const bhTot = retRange(APP.res.bh.eq, start, n), bhSharpe = sharpeRange(APP.res.bh.eq, start, n);
  const wfe = (!isNA(oosSharpe) && folds.filter(f => !f.na).length)
    ? oosSharpe / (mean(folds.filter(f => !f.na).map(f => f.sIS)) || 1) : NA;

  WF.res = { id: OPT.id, param: OPT.p1, vals, folds, eqOOS, start,
    oosSharpe, oosTot, defTot, defSharpe, bhTot, bhSharpe, wfe, defVal: defRun.v, defEq: defRun.m.eq };
  WF.running = false; renderOpt();
}

function wfPanel() {
  const st = STRATS.find(x => x.id === OPT.id);
  if (!WF.res || WF.res.id !== OPT.id || WF.res.param !== OPT.p1) {
    return `<div class="empty">把資料切成 ${WF.folds + 1} 段，用第 i 段挑最佳參數、<b>只在第 i+1 段計分</b>，<br>
      再把各段的樣本外報酬串起來。這是唯一能回答「調參數到底有沒有用」的方法。<br><br>按「執行 Walk-Forward」開始。</div>`;
  }
  const R = WF.res, ok = R.folds.filter(f => !f.na);
  const winDef = ok.filter(f => f.sOOS > f.sDef).length;
  const ctx = APP.ctx;
  const norm = (a, from) => a.map((v, i) => (i < from || isNA(v)) ? NA : v / a[from] * 100);
  const cmp = (a, b) => isNA(a) || isNA(b) ? '' : (a > b ? 'up' : a < b ? 'dn' : '');
  return `
  <div class="warn" style="margin:0 0 14px">
    串接後的樣本外結果：總報酬 <b class="${cls(R.oosTot)}">${pc(R.oosTot)}</b>、夏普 <b>${nf(R.oosSharpe)}</b>。
    同期間固定用預設值 <code>${esc(st.params[OPT.p1].label)} = ${R.defVal}</code>：總報酬 <b class="${cls(R.defTot)}">${pc(R.defTot)}</b>、夏普 <b>${nf(R.defSharpe)}</b>。
    買進持有：<b class="${cls(R.bhTot)}">${pc(R.bhTot)}</b>、夏普 <b>${nf(R.bhSharpe)}</b>。<br>
    ${ok.length} 段中有 <b>${winDef}</b> 段的最佳化參數在樣本外贏過預設值。
    Walk-Forward 效率（樣本外夏普 ÷ 訓練夏普平均）＝ <b>${nf(R.wfe)}</b>。
  </div>
  <div class="tblwrap" style="max-height:300px"><table><thead><tr>
    <th>分段</th><th>訓練期間</th><th>測試期間</th><th>訓練最佳值</th><th>訓練夏普</th><th>測試夏普</th><th>測試報酬</th><th>預設值測試夏普</th><th>持有測試夏普</th><th>勝負</th></tr></thead>
    <tbody>${R.folds.map(f => f.na ? `<tr><td>${f.i + 1}</td><td colspan="9" class="dim">資料不足</td></tr>` :
      `<tr><td>${f.i + 1}</td>
        <td class="mono dim">${dsp(ctx.dates[f.ta])}~${dsp(ctx.dates[Math.min(f.tb - 1, ctx.n - 1)])}</td>
        <td class="mono dim">${dsp(ctx.dates[f.va])}~${dsp(ctx.dates[Math.min(f.vb - 1, ctx.n - 1)])}</td>
        <td class="mono"><b>${f.best}</b></td><td class="mono dim">${nf(f.sIS)}</td>
        <td class="mono"><b>${nf(f.sOOS)}</b></td><td class="mono ${cls(f.rOOS)}">${pc(f.rOOS)}</td>
        <td class="mono dim">${nf(f.sDef)}</td><td class="mono dim">${nf(f.sBH)}</td>
        <td class="${cmp(f.sOOS, f.sDef)}">${isNA(f.sOOS) || isNA(f.sDef) ? '—' : (f.sOOS > f.sDef ? '勝' : f.sOOS < f.sDef ? '敗' : '平')}</td></tr>`).join('')}
    </tbody></table></div>
  <div class="lgd" style="padding:14px 0 8px"><span><i style="background:var(--teal)"></i>Walk-Forward 樣本外</span><span><i style="background:var(--vio)"></i>固定預設參數</span><span><i style="background:var(--gold)"></i>買進持有</span></div>
  ${lineChart([
      { data: norm(APP.res.bh.eq, R.start), color: 'var(--gold)', w: 1.3, dash: 1 },
      { data: norm(R.defEq, R.start), color: 'var(--vio)', w: 1.4 },
      { data: norm(R.eqOOS.map(v => isNA(v) ? NA : v), R.start), color: 'var(--teal)', w: 2, area: 1 }],
      { labels: ctx.dates, fmt: v => v.toFixed(0) })}
  <div class="rules" style="font-size:12.8px;color:var(--mut);margin-top:12px;line-height:1.8">
    <b style="color:var(--tx)">怎麼判讀：</b>如果「測試夏普」多數段都輸給「預設值測試夏普」，代表最佳化是在追雜訊——
    與其調參數，不如直接用原始預設值。Walk-Forward 效率顯著低於 1（例如 &lt; 0.5）也是同樣的警訊。<br>
    <b style="color:var(--tx)">和網格掃描的差別：</b>熱力圖告訴你「哪一格在這段歷史上最好」，Walk-Forward 告訴你
    「照這個方法挑參數，在沒看過的資料上會發生什麼事」。後者才是你實際操作時的處境。
  </div>`;
}

async function runBatch() {
  if (BATCH.running) return; BATCH.running = true;
  BATCH.syms = $('#bSyms').value;
  const bParsed = parseSyms(BATCH.syms, BATCH_MAX, MK.key === 'US');
  BATCH.parsed = bParsed;
  const syms = bParsed.syms;
  const yrs = +$('#period').value, out = [];
  $('#bOut').innerHTML = `<div class="empty"><span class="spin"></span> 批次執行中…</div>`;
  const bench = await fetchBars(CFG.bench, yrs).catch(() => null);
  for (let i = 0; i < syms.length; i++) {
    $('#bOut').innerHTML = `<div class="empty"><span class="spin"></span> (${i + 1}/${syms.length}) 處理 ${esc(syms[i])} …</div>`;
    try {
      const bars = await fetchBars(syms[i], yrs);
      if (!bars || bars.length < 60) { out.push({ sym: syms[i], err: '資料不足（少於 60 根）' }); continue; }
      const dates = bars.map(r => r[0]);
      const ctx = makeCtx(bars, dates, bench ? alignBench(bench, dates) : null);
      const R = runAll(ctx);
      const traded = R.rows.filter(x => x.nT > 0 || x.nOpen > 0);
      const best = traded.slice().sort((a, b) => (isNA(b.sharpe) ? -9 : b.sharpe) - (isNA(a.sharpe) ? -9 : a.sharpe))[0];
      if (!best) { out.push({ sym: syms[i], err: '全部策略皆無成交' }); continue; }
      out.push({ sym: syms[i], name: await fetchName(syms[i]).catch(() => ''), bh: R.bh, best, traded: traded.length, beat: traded.filter(x => x.ann > R.bh.ann).length, noTrade: R.rows.length - traded.length });
    } catch (e) { out.push({ sym: syms[i], err: '載入失敗：' + (e.message || e) }); }
  }
  BATCH.rows = out; BATCH.running = false; renderBatch();
}

/* =========================================================================
   今日訊號：自選股清單 × 全部策略，列出最新交易日的動作
   訊號在收盤後產生、次一個交易日開盤才成交，所以這裡列的是「明天要做什麼」。
   ========================================================================= */
let SIG = { syms: null, rows: null, running: false, filter: '動作', asOf: '', hideLow: false };

const SIG_MAX = 20, BATCH_MAX = 10;

/* 自選股清單：每個市場各存一份。
   舊版用單一 key 'qlab.watch'，而且因為 applyMarket 會搶先覆寫 SIG.syms，
   那個值其實從來沒被讀回來過——等於存了也白存。這裡一併修掉。 */
const WATCH_KEY = k => 'qlab.watch.' + k;
function loadWatch(k) { try { return localStorage.getItem(WATCH_KEY(k)) || ''; } catch (e) { return ''; } }
function saveWatch(k, v) { try { localStorage.setItem(WATCH_KEY(k), v); return true; } catch (e) { return false; } }
function clearWatch(k) { try { localStorage.removeItem(WATCH_KEY(k)); } catch (e) { } }
/* 舊 key 遷移：qlab.market 記得當時是哪個市場，照那個市場歸位，只做一次 */
(function migrateWatch() {
  try {
    const old = localStorage.getItem('qlab.watch');
    if (!old) return;
    const mk = localStorage.getItem('qlab.market') || 'TW';
    if (!localStorage.getItem(WATCH_KEY(mk))) localStorage.setItem(WATCH_KEY(mk), old);
    localStorage.removeItem('qlab.watch');
  } catch (e) { }
})();

/* 解析代號清單。原本直接 .slice() 會無聲吃掉超出的代號，
   使用者以為全掃了、其實沒有。改成把「重複」與「超出」都回報出來。 */
function parseSyms(raw, max, upper) {
  const all = raw.split(/[,，\s]+/).filter(Boolean).map(x => upper ? x.toUpperCase() : x);
  const seen = new Set(), uniq = [], dup = [];
  for (const x of all) { if (seen.has(x)) dup.push(x); else { seen.add(x); uniq.push(x); } }
  return { syms: uniq.slice(0, max), dropped: uniq.slice(max), dup, max };
}

/* 輸入框旁的即時計數：還沒按掃描就看得到會不會超限 */
function wireSymCount(inputId, outId, max, btnId) {
  const i = $('#' + inputId), o = $('#' + outId); if (!i || !o) return;
  const upd = () => {
    const p = parseSyms(i.value, max, MK.key === 'US');
    const n = p.syms.length + p.dropped.length;
    const over = p.dropped.length, dup = p.dup.length;
    o.innerHTML = !n ? ''
      : `<b style="color:${over ? 'var(--up)' : 'var(--mut)'}">${p.syms.length}</b>/${max} 檔`
        + (over ? `<span style="color:var(--up)"> · 超出 ${over} 檔不會掃描</span>` : '')
        + (dup ? `<span class="dim"> · ${dup} 個重複已略過</span>` : '');
    const b = btnId && $('#' + btnId); if (b) b.disabled = !p.syms.length;
  };
  i.addEventListener('input', upd); upd();
}

/* 儲存／重設的即時回饋，不用彈 alert 打斷操作 */
function toastSig(msg, bad) {
  const host = $('#sigCount'); if (!host) return;
  const old = host.innerHTML;
  host.innerHTML = `<span style="color:${bad ? 'var(--up)' : 'var(--teal)'}">${bad ? '✗' : '✓'} ${esc(msg)}</span>`;
  clearTimeout(toastSig._t);
  toastSig._t = setTimeout(() => {
    const i = $('#sigSyms');
    if (i) i.dispatchEvent(new Event('input', { bubbles: true })); else host.innerHTML = old;
  }, 2600);
}

function symNotice(p) {
  if (!p || (!p.dropped.length && !p.dup.length)) return '';
  const bits = [];
  if (p.dropped.length) bits.push(`一次最多 <b>${p.max}</b> 檔，<b>已略過後面 ${p.dropped.length} 檔</b>：${p.dropped.map(esc).join('、')}`);
  if (p.dup.length) bits.push(`已自動去除 ${p.dup.length} 個重複代號：${[...new Set(p.dup)].map(esc).join('、')}`);
  return `<div class="warn" style="margin:0 0 12px;border-left-color:var(--up)">⚠ ${bits.join('<br>')}</div>`;
}

async function runSignals() {
  if (SIG.running) return;
  SIG.running = true;

  const syms = parsed.syms;
  const yrs = +$('#period').value, out = [];

  for (let i = 0; i < syms.length; i++) {
    $('#sigOut').innerHTML = `<div class="empty"><span class="spin"></span> 掃描中 ${i + 1}/${syms.length}　${esc(syms[i])}
      <div class="bar" style="max-width:320px;margin:14px auto 0"><i style="width:${(i / syms.length * 100).toFixed(0)}%"></i></div></div>`;
    await yieldNow();
    try {
      const [bars, exRaw, divs, coName] = await Promise.all([
        fetchBars(syms[i], yrs),
        MK.key === 'TW' ? fetchExtras(syms[i], yrs).catch(() => null) : Promise.resolve(null),
        (MK.key === 'TW' && CFG.adj) ? fetchAdjEvents(syms[i], yrs).catch(() => []) : Promise.resolve([]),

      ]);
      if (!bars || bars.length < 60) { out.push({ sym: syms[i], err: '資料不足' }); continue; }
      const adjBars = (MK.key === 'TW' && CFG.adj) ? applyAdjTW(bars, divs).bars : bars;
      const dates = adjBars.map(r => r[0]);
      const ctx = makeCtx(adjBars, dates, bench ? alignBench(bench, dates) : null);
      ctx.ex = exRaw ? alignExtras(exRaw, dates) : null;
      const R = runAll(ctx);
      const n = ctx.n, last = ctx.b.c[n - 1], prev = ctx.b.c[n - 2];
      SIG.asOf = dates[n - 1];
      R.rows.forEach(r => {
        const sn = r.signalNow; if (!sn) return;
        out.push({ sym: syms[i], name: (coName && coName !== syms[i]) ? coName : '', close: last, chg: prev ? last / prev - 1 : NA,
          strat: r.name, cat: r.cat, action: sn.blockedNow && sn.action === '空手' ? '被濾網擋下' : sn.action,
          bars: sn.bars, unreal: sn.unreal, sharpe: r.sharpe, oos: r.oos, nT: r.nT });
      });
    } catch (e) { out.push({ sym: syms[i], err: '載入失敗：' + (e.message || e) }); }
  }
  SIG.rows = out; SIG.running = false; renderSignals();
}

/* 訊號品質：只判定「明顯不可信」，回傳具體理由。
   刻意不做正面評分——本平台經 BH 多重比較校正後 0 支策略通過，
   沒有任何訊號稱得上「可信」，只有「明顯不可信」與「尚未被證明不可信」。 */
function sigFlaws(r) {
  const f = [];
  if (!isNA(r.nT) && r.nT < 5) f.push(`僅 ${r.nT} 筆交易`);
  if (!isNA(r.sharpe) && r.sharpe < 0) f.push(`回測夏普 ${nf(r.sharpe)}`);
  if (!isNA(r.oos) && r.oos < 0) f.push(`樣本外夏普 ${nf(r.oos)}`);
  return f;
}

/* =========================================================================
   策略組合：把多支策略的日報酬以固定權重每日再平衡後合併
   重點不是「組合報酬更高」，而是「相關性低的策略放在一起能壓低波動」。
   ========================================================================= */
let PORT = { sel: null, mode: 'eq', res: null };

function corrOf(a, b) {
  const n = Math.min(a.length, b.length);
  if (n < 3) return NA;
  const ma = mean(a.slice(-n)), mb = mean(b.slice(-n));
  let sab = 0, sa = 0, sb = 0;
  for (let i = 0; i < n; i++) { const x = a[a.length - n + i] - ma, y = b[b.length - n + i] - mb; sab += x * y; sa += x * x; sb += y * y; }
  return (sa && sb) ? sab / Math.sqrt(sa * sb) : NA;
}

function buildPort() {
  const picked = APP.res.rows.filter(r => PORT.sel.has(r.id) && r.rets && r.rets.length);
  if (picked.length < 2) { PORT.res = null; return; }
  const n = APP.ctx.n;
  let w;
  if (PORT.mode === 'sharpe') {
    const v = picked.map(r => Math.max(0.01, isNA(r.sharpe) ? 0.01 : r.sharpe));
    const t = v.reduce((a, b) => a + b, 0); w = v.map(x => x / t);
  } else if (PORT.mode === 'invvol') {
    const v = picked.map(r => 1 / Math.max(1e-6, isNA(r.vol) ? 1 : r.vol));
    const t = v.reduce((a, b) => a + b, 0); w = v.map(x => x / t);
  } else {
    w = picked.map(() => 1 / picked.length);
  }
  const L = n - 1, pr = new Array(L).fill(0);
  for (let i = 0; i < L; i++) { let x = 0; for (let k = 0; k < picked.length; k++) x += w[k] * (picked[k].rets[i] || 0); pr[i] = x; }
  const eq = new Array(n); eq[0] = CFG.cap;
  for (let i = 1; i < n; i++) eq[i] = eq[i - 1] * (1 + pr[i - 1]);
  const m = metrics({ eq, trades: [], inMkt: picked[0].inMkt.map((_, i) => picked.some(p => p.inMkt[i]) ? 1 : 0),
    params: {}, name: '組合', id: '__port', cat: '基準' }, APP.ctx, APP.res.br);
  m.nT = picked.reduce((a, r) => a + r.nT, 0); m.win = NA; m.pf = NA;
  const C = picked.map(a => picked.map(b => a.id === b.id ? 1 : corrOf(a.rets, b.rets)));
  let cs = 0, cn = 0;
  for (let i = 0; i < picked.length; i++) for (let j = i + 1; j < picked.length; j++) { if (!isNA(C[i][j])) { cs += C[i][j]; cn++; } }
  PORT.res = { picked, w, m, C, avgCorr: cn ? cs / cn : NA };
}

function renderPort() {
  const P2 = $('#p-port');
  if (!APP.res) { P2.innerHTML = `<div class="card empty">先載入資料並執行回測</div>`; return; }
  const cand = APP.res.rows.filter(r => (r.nT > 0 || r.nOpen > 0) && !isNA(r.sharpe))
    .sort((a, b) => b.sharpe - a.sharpe);
  if (!PORT.sel) PORT.sel = new Set(cand.slice(0, 5).map(r => r.id));
  buildPort();
  const R = PORT.res, bh = APP.res.bh;
  const modes = [['eq', '等權'], ['sharpe', '夏普加權'], ['invvol', '波動度倒數']];
  const best = cand[0];
  const norm = a => a.map(v => v / a[0] * 100);
  const hm = v => { if (isNA(v)) return 'background:rgba(255,255,255,.03)';
    const t = (v + 1) / 2; return `background:rgba(${v >= 0 ? '255,95,86' : '31,199,125'},${(Math.abs(v) * 0.55 + 0.06).toFixed(3)})`; };

  P2.innerHTML = `<div class="card">
    <div class="ph"><h2>策略組合</h2><span class="dim" style="font-size:12px">· 固定權重、每日再平衡</span><div class="sp"></div>
      <div class="chips">${modes.map(m => `<div class="chip ${m[0] === PORT.mode ? 'on' : ''}" data-m="${m[0]}">${m[1]}</div>`).join('')}</div>
      <button class="btn" id="pTop5">取夏普前 5</button><button class="btn" id="pNone">全部取消</button></div>
    <div style="padding:0 18px 4px"><div class="picks">
      ${cand.map(r => `<label class="pick"><input type="checkbox" data-id="${r.id}" ${PORT.sel.has(r.id) ? 'checked' : ''}>
        <span class="nm">${esc(r.name)}</span><span class="sh">${nf(r.sharpe)}</span></label>`).join('')}
    </div></div>
    ${!R ? `<div class="empty">請至少勾選 2 支策略</div>` : `
    <div style="padding:0 18px 18px">
      <div class="mini" style="margin-bottom:16px">
        ${[['組合總報酬', pc(R.m.tot), cls(R.m.tot)], ['組合年化', pc(R.m.ann), cls(R.m.ann)], ['組合夏普', nf(R.m.sharpe), ''],
           ['組合最大回撤', pc(R.m.mdd), cls(R.m.mdd)], ['組合卡瑪', nf(R.m.calmar), ''], ['年化波動', pu(R.m.vol), ''],
           ['平均相關係數', nf(R.avgCorr), ''], ['納入策略', R.picked.length + ' 支', '']]
          .map(x => `<div><div class="k">${x[0]}</div><div class="v ${x[2]}">${x[1]}</div></div>`).join('')}
      </div>
      <div class="warn" style="margin-bottom:14px">
        最佳單一策略 <b>${esc(best.name)}</b>：夏普 ${nf(best.sharpe)}、回撤 ${pc(best.mdd)}。
        組合：夏普 <b class="${R.m.sharpe > best.sharpe ? 'up' : ''}">${nf(R.m.sharpe)}</b>、回撤 <b class="${Math.abs(R.m.mdd) < Math.abs(best.mdd) ? 'up' : ''}">${pc(R.m.mdd)}</b>。
        ${R.m.sharpe > best.sharpe
          ? '組合的風險調整後報酬優於任何單一策略——這就是分散的效果。'
          : '組合夏普未超過最佳單一策略，通常代表選到的策略彼此相關度太高，或其中混入了明顯較差的策略。'}
        ${!isNA(R.avgCorr) ? (R.avgCorr < 0.3 ? '平均相關係數偏低，分散效果好。' : R.avgCorr > 0.6 ? '平均相關係數偏高，這些策略其實在做同一件事。' : '') : ''}
      </div>
      <div class="lgd" style="padding:0 0 10px"><span><i style="background:var(--teal)"></i>組合</span><span><i style="background:var(--vio)"></i>最佳單一（${esc(best.name)}）</span><span><i style="background:var(--gold)"></i>買進持有</span></div>
      ${lineChart([
        { data: norm(bh.eq), color: 'var(--gold)', w: 1.3, dash: 1 },
        { data: norm(best.eq), color: 'var(--vio)', w: 1.4 },
        { data: norm(R.m.eq), color: 'var(--teal)', w: 2, area: 1 }],
        { labels: APP.ctx.dates, fmt: v => v.toFixed(0) })}
      <div style="font-size:13px;color:var(--mut);margin:20px 0 8px">日報酬相關矩陣　<span class="dim">· 紅＝正相關、綠＝負相關；越淡越接近 0</span></div>
      <div style="overflow:auto"><table class="corr"><thead><tr><th></th>
        ${R.picked.map((p, i) => `<th title="${esc(p.name)}">${i + 1}</th>`).join('')}</tr></thead>
        <tbody>${R.picked.map((p, i) => `<tr>
          <td style="text-align:left;white-space:nowrap;padding-right:10px">${i + 1}. ${esc(p.name)} <span class="dim">(${(R.w[i] * 100).toFixed(0)}%)</span></td>
          ${R.picked.map((_, j) => `<td style="${hm(R.C[i][j])}">${i === j ? '—' : nf(R.C[i][j])}</td>`).join('')}</tr>`).join('')}
        </tbody></table></div>
    </div>`}
  </div>
  <div class="card" style="margin-top:16px"><div class="ph"><h2>怎麼用這一頁</h2></div>
    <div style="padding:0 18px 18px" class="rules">
      實務上不會只押一支策略。兩支夏普都是 1.5、但相關係數只有 0.2 的策略放在一起，組合夏普可能到 2.0——
      這個提升不是來自任何一支變強，而是來自它們虧錢的時間點不一樣。<br><br>
      <b>挑選原則：</b>先看相關矩陣，避開整片深紅的組合（那代表它們在做同一件事，疊再多也沒用）。
      優先選彼此接近 0 或負相關的策略，即使其中某幾支的單獨夏普不是最高。<br><br>
      <b>權重模式：</b><code>等權</code>最不容易過度配適，是穩健的預設；
      <code>夏普加權</code>會把資金集中到歷史表現好的策略，但那正是最可能運氣成分最高的；
      <code>波動度倒數</code>讓每支策略貢獻相近的風險，通常回撤最小。<br><br>
      <b>⚠ 這裡有一個簡化：</b>組合是用各策略的<b>日報酬加權平均</b>計算（每日再平衡），
      不是真的同時下單——實際操作需要 N 倍資金或把部位切小，且每日再平衡本身也有成本，這些都未計入。
    </div></div>`;

  P2.querySelectorAll('.pick input').forEach(cb => cb.onchange = () => {
    if (cb.checked) PORT.sel.add(cb.dataset.id); else PORT.sel.delete(cb.dataset.id);
    renderPort();
  });
  P2.querySelectorAll('.chip').forEach(c => c.onclick = () => { PORT.mode = c.dataset.m; renderPort(); });
  $('#pTop5').onclick = () => { PORT.sel = new Set(cand.slice(0, 5).map(r => r.id)); renderPort(); };
  $('#pNone').onclick = () => { PORT.sel = new Set(); renderPort(); };
}

/* =========================================================================
   自訂策略：條件積木
   每個條件 = 左運算元 ⊕ 運算子 ⊕ 右運算元，進場與出場各是一組 AND 條件。
   ========================================================================= */
const CIND = {
  close:   { label: '收盤價', f: c => c.b.c },
  open:    { label: '開盤價', f: c => c.b.o },
  high:    { label: '最高價', f: c => c.b.h },
  low:     { label: '最低價', f: c => c.b.l },
  vol:     { label: '成交量', f: c => c.b.v },
  ma:      { label: 'MA', p: 20, f: (c, n) => sma(c.b.c, n) },
  ema:     { label: 'EMA', p: 20, f: (c, n) => ema(c.b.c, n) },
  volma:   { label: '均量', p: 20, f: (c, n) => sma(c.b.v, n) },
  rsi:     { label: 'RSI', p: 14, f: (c, n) => rsi(c.b.c, n) },
  k:       { label: 'KD 的 K', p: 9, f: (c, n) => kdTW(c.b, n, 3, 3).K },
  d:       { label: 'KD 的 D', p: 9, f: (c, n) => kdTW(c.b, n, 3, 3).D },
  macd:    { label: 'MACD 線', f: c => macdOf(c.b.c, 12, 26, 9).macd },
  macdsig: { label: 'MACD 訊號線', f: c => macdOf(c.b.c, 12, 26, 9).signal },
  bbu:     { label: '布林上軌', p: 20, f: (c, n) => { const m = sma(c.b.c, n), d2 = stdev(c.b.c, n); return m.map((v, i) => isNA(v) ? NA : v + 2 * d2[i]); } },
  bbm:     { label: '布林中軌', p: 20, f: (c, n) => sma(c.b.c, n) },
  bbl:     { label: '布林下軌', p: 20, f: (c, n) => { const m = sma(c.b.c, n), d2 = stdev(c.b.c, n); return m.map((v, i) => isNA(v) ? NA : v - 2 * d2[i]); } },
  atr:     { label: 'ATR', p: 14, f: (c, n) => c.atr14 && n === 14 ? c.atr14 : atr(c.b, n) },
  bias:    { label: '乖離率 %', p: 20, f: (c, n) => { const m = sma(c.b.c, n); return m.map((v, i) => isNA(v) ? NA : (c.b.c[i] - v) / v * 100); } },
  inst:    { label: '法人淨買超（股）', tw: 1, f: c => c.ex ? c.ex.instNet : null },
  instDays:{ label: '法人連買天數', tw: 1, f: c => { if (!c.ex) return null; let r = 0; return c.ex.instNet.map(v => (r = v > 0 ? r + 1 : 0)); } },
  marginChg:{ label: '融資 N 日變化 %', tw: 1, p: 5, f: (c, n) => { if (!c.ex) return null;
    return c.ex.marginBal.map((v, i) => { const j = i - n; return (j < 0 || isNA(v) || isNA(c.ex.marginBal[j]) || !c.ex.marginBal[j]) ? NA : (v - c.ex.marginBal[j]) / c.ex.marginBal[j] * 100; }); } },
  revYoY:  { label: '月營收年增率 %', tw: 1, f: c => { if (!c.ex) return null;
    const out = new Array(c.n).fill(NA), seen = [];
    let prev = '';
    for (let i = 0; i < c.n; i++) {
      if (c.ex.revYm[i] && c.ex.revYm[i] !== prev) { seen.push(c.ex.revVal[i]); prev = c.ex.revYm[i]; }
      if (seen.length >= 13) { const a = seen[seen.length - 1], b = seen[seen.length - 13]; if (b) out[i] = (a - b) / b * 100; }
    }
    return out; } }
};
const COPS = { gt: '大於', lt: '小於', cu: '向上穿越', cd: '向下穿越' };

const CUSTOM_TPL = [
  { name: '黃金交叉 + 量增', entry: [{ l: 'ma', lp: 5, op: 'cu', r: 'ma', rp: 20 }, { l: 'vol', op: 'gt', r: 'volma', rp: 20 }], exit: [{ l: 'ma', lp: 5, op: 'cd', r: 'ma', rp: 20 }], sl: 0, tp: 0 },
  { name: 'RSI 超賣反彈', entry: [{ l: 'rsi', lp: 14, op: 'cu', r: '#', rv: 30 }], exit: [{ l: 'rsi', lp: 14, op: 'gt', r: '#', rv: 70 }], sl: 8, tp: 0 },
  { name: 'KD 低檔黃金交叉', entry: [{ l: 'k', lp: 9, op: 'cu', r: 'd', rp: 9 }, { l: 'k', lp: 9, op: 'lt', r: '#', rv: 30 }], exit: [{ l: 'k', lp: 9, op: 'cd', r: 'd', rp: 9 }], sl: 0, tp: 0 },
  { name: '布林下軌 + 法人買超', entry: [{ l: 'close', op: 'lt', r: 'bbl', rp: 20 }, { l: 'inst', op: 'gt', r: '#', rv: 0 }], exit: [{ l: 'close', op: 'gt', r: 'bbm', rp: 20 }], sl: 10, tp: 0 },
  { name: '月營收年增 + 站上季線', entry: [{ l: 'revYoY', op: 'gt', r: '#', rv: 20 }, { l: 'close', op: 'cu', r: 'ma', rp: 60 }], exit: [{ l: 'close', op: 'cd', r: 'ma', rp: 60 }], sl: 12, tp: 0 }
];

function cKey(side, cd) { const ind = side === 'l' ? cd.l : cd.r; const p = side === 'l' ? cd.lp : cd.rp; return ind + '|' + (p || ''); }
function cSeries(ctx, ind, p) {
  const def = CIND[ind]; if (!def) return null;
  return def.p !== undefined ? def.f(ctx, p || def.p) : def.f(ctx);
}
function makeCustomStrategy(cs) {
  return {
    id: 'cx_' + cs.id, name: cs.name, cat: '自訂', file: '自訂策略（條件積木）', custom: true, def: cs,
    params: { sl: P(cs.sl || 0, 0, 30, .5, '停損 %'), tp: P(cs.tp || 0, 0, 50, .5, '停利 %') },
    entry: cs.entry.map(descCond).join(' 且 ') || '（未設定）',
    exit: (cs.exit.map(descCond).join(' 且 ') || '（未設定）') + (cs.sl ? `；−${cs.sl}% 停損` : '') + (cs.tp ? `；+${cs.tp}% 停利` : ''),
    prep(c) {
      const S_ = { ser: {}, ok: true };
      [...cs.entry, ...cs.exit].forEach(cd => {
        for (const side of ['l', 'r']) {
          const ind = side === 'l' ? cd.l : cd.r;
          if (ind === '#') continue;
          const k = cKey(side, cd);
          if (!S_.ser[k]) { const a = cSeries(c, ind, side === 'l' ? cd.lp : cd.rp); if (!a) S_.ok = false; S_.ser[k] = a; }
        }
      });
      return S_;
    },
    sig(i, S_, pos, p, c) {
      if (!S_.ok) return { enter: false, exit: false };
      const val = (cd, side) => { const ind = side === 'l' ? cd.l : cd.r;
        if (ind === '#') return side === 'l' ? NA : cd.rv;
        const a = S_.ser[cKey(side, cd)]; return a ? a[i] : NA; };
      const prevv = (cd, side) => { const ind = side === 'l' ? cd.l : cd.r;
        if (ind === '#') return cd.rv; const a = S_.ser[cKey(side, cd)]; return a ? a[i - 1] : NA; };
      const test = cd => {
        const L = val(cd, 'l'), R = val(cd, 'r');
        if (isNA(L) || isNA(R)) return false;
        if (cd.op === 'gt') return L > R;
        if (cd.op === 'lt') return L < R;
        const L1 = prevv(cd, 'l'), R1 = prevv(cd, 'r');
        if (isNA(L1) || isNA(R1)) return false;
        return cd.op === 'cu' ? (L1 <= R1 && L > R) : (L1 >= R1 && L < R);
      };
      const en = cs.entry.length > 0 && cs.entry.every(test);
      const ex = cs.exit.length > 0 && cs.exit.every(test);
      return { enter: en, exit: ex,
        stop: (pos.in && p.sl > 0) ? pos.avg * (1 - p.sl / 100) : NA,
        limit: (pos.in && p.tp > 0) ? pos.avg * (1 + p.tp / 100) : NA };
    }
  };
}
function descCond(cd) {
  const L = CIND[cd.l] ? CIND[cd.l].label + (CIND[cd.l].p !== undefined ? `(${cd.lp || CIND[cd.l].p})` : '') : cd.l;
  const R = cd.r === '#' ? String(cd.rv) : (CIND[cd.r] ? CIND[cd.r].label + (CIND[cd.r].p !== undefined ? `(${cd.rp || CIND[cd.r].p})` : '') : cd.r);
  return `${L} ${COPS[cd.op]} ${R}`;
}

let CUSTOM = { list: [], editing: null };
function loadCustom() {
  try { CUSTOM.list = JSON.parse(localStorage.getItem('qlab.custom') || '[]'); } catch (e) { CUSTOM.list = []; }
  STRATS = STRATS.filter(x => !x.custom);
  CUSTOM.list.forEach(cs => STRATS.push(makeCustomStrategy(cs)));
}
function saveCustom() {
  try { localStorage.setItem('qlab.custom', JSON.stringify(CUSTOM.list)); } catch (e) { alert('儲存失敗：瀏覽器儲存空間可能已滿'); }
  loadCustom();
  if (APP.ctx) { APP.res = runAll(APP.ctx); renderKPIs(); renderRank(); }
}

/* ---------- 標的風險卡 ---------- */
function renderRisk() {
  const P2 = $('#p-risk'); if (!APP.res) { P2.innerHTML = `<div class="card empty">先載入資料並執行回測</div>`; return; }
  const ctx = APP.ctx, bh = APP.res.bh, r = bh.rets, c = ctx.b.c;
  const srt = r.slice().sort((a, b) => a - b);
  const var95 = srt[Math.floor(srt.length * .05)], cvar = mean(srt.slice(0, Math.max(1, Math.floor(srt.length * .05))));
  const upD = r.filter(v => v > 0).length, dnD = r.filter(v => v < 0).length;
  let cu = 0, cd = 0, mu = 0, md = 0;
  r.forEach(v => { if (v > 0) { cu++; cd = 0; } else if (v < 0) { cd++; cu = 0; } mu = Math.max(mu, cu); md = Math.max(md, cd); });
  const amp = mean(ctx.b.h.map((h, i) => (h - ctx.b.l[i]) / ctx.b.c[i]));
  const br = APP.res.br, k = Math.min(r.length, br.length);
  const corr = k > 2 ? (() => { const a = r.slice(-k), b2 = br.slice(-k), ma = mean(a), mb = mean(b2);
    return a.reduce((s, v, i) => s + (v - ma) * (b2[i] - mb), 0) / Math.sqrt(a.reduce((s, v) => s + (v - ma) ** 2, 0) * b2.reduce((s, v) => s + (v - mb) ** 2, 0)); })() : NA;
  const lvl = riskLevel(bh.vol, bh.beta);
  const vol20 = []; for (let i = 0; i < r.length; i++) vol20.push(i < 19 ? NA : sd(r.slice(i - 19, i + 1)) * Math.sqrt(TD) * 100);
  const volAvg = mean(ctx.b.v.slice(-20)) / mean(ctx.b.v.slice(0, 20));
  const box = (k2, v, c2 = '', f = '') => `<div><div class="k">${k2}</div><div class="v ${c2}">${v}</div>${f ? `<div class="dim" style="font-size:11px;margin-top:2px">${f}</div>` : ''}</div>`;
  P2.innerHTML = `
  <div class="card" style="margin-bottom:16px">
    <div class="ph"><h2>${esc(APP.name || APP.sym)}（${esc(APP.sym)}）風險輪廓</h2><div class="sp"></div>
      <span style="font-size:19px;font-weight:700;color:${lvl.c}">${lvl.t}</span></div>
    <div style="padding:0 16px 16px"><div class="mini">
      ${box('年化波動', pu(bh.vol))}${box('Beta（vs ' + benchLabel() + '）', nf(bh.beta))}${box('與大盤相關係數', nf(corr))}
      ${box('最大回撤', pc(bh.mdd), cls(bh.mdd))}${box('日 VaR 95%', pc(var95, 2), 'dn', '單日最差 5% 門檻')}${box('CVaR 95%', pc(cvar, 2), 'dn', '尾端平均虧損')}
      ${box('上漲 / 下跌天數', upD + ' / ' + dnD)}${box('最長連漲 / 連跌', mu + ' / ' + md + ' 天')}${box('平均日振幅', pu(amp, 2))}

function histogram(r) {
  const bins = 25, mn = Math.min(...r), mx = Math.max(...r), w = (mx - mn) / bins;
  const h = new Array(bins).fill(0); r.forEach(v => h[Math.min(bins - 1, Math.floor((v - mn) / w))]++);
  const hm = Math.max(...h), W = 760, H = 220, pb = 26;
  let g = '';
  h.forEach((v, i) => { const x = 10 + (W - 20) * i / bins, bw = (W - 20) / bins - 2, bh2 = (H - pb - 10) * v / hm;
    const center = mn + w * (i + .5);
    g += `<rect x="${x.toFixed(1)}" y="${(H - pb - bh2).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh2.toFixed(1)}" rx="2" fill="${center >= 0 ? 'var(--up)' : 'var(--dn)'}" fill-opacity=".75"><title>${(center * 100).toFixed(1)}%：${v} 天</title></rect>`; });
  g += `<line x1="10" x2="${W - 10}" y1="${H - pb}" y2="${H - pb}" stroke="currentColor" stroke-opacity=".2"/>
  <text x="10" y="${H - 8}" font-size="10" fill="currentColor" opacity=".5">${(mn * 100).toFixed(0)}%</text>
  <text x="${W - 10}" y="${H - 8}" text-anchor="end" font-size="10" fill="currentColor" opacity=".5">+${(mx * 100).toFixed(0)}%</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--tx)">${g}</svg>`;
}

/* =========================================================================
   自我檢測：驗證 Pine 相容指標層與回測引擎
   指標層是整個系統的地基，錯了不會報錯、只會讓所有數字安靜地偏掉，
   所以用可手算的案例與數學性質把行為釘住。
   ========================================================================= */
function runSelfTest() {
  const T = [];
  const EPS = 1e-9;
  const near = (a, b, tol) => !isNA(a) && !isNA(b) && Math.abs(a - b) <= (tol === undefined ? 1e-9 : tol);
  // 字串與布林用嚴格相等；只有數字才走容差比較（否則字串會被當成 NaN 而永遠不相等）
  const eq = (a, b, tol) => (typeof b === 'string' || typeof b === 'boolean') ? a === b : near(a, b, tol);
  const arrNear = (got, want, tol) => Array.isArray(got) && got.length === want.length
    && want.every((w, i) => (isNA(w) && isNA(got[i])) || eq(got[i], w, tol));
  const one = v => typeof v === 'string' ? JSON.stringify(v)
    : typeof v === 'boolean' ? String(v)
    : isNA(v) ? 'na' : String(Math.round(v * 1e6) / 1e6);
  const fmt = a => '[' + a.map(one).join(', ') + ']';
  const t = (group, name, got, want, tol) => {
    const pass = Array.isArray(want) ? arrNear(got, want, tol) : eq(got, want, tol);
    T.push({ group, name, pass,
      got: Array.isArray(got) ? fmt(got) : one(got),
      want: Array.isArray(want) ? fmt(want) : one(want) });
  };

  /* ── 移動平均 ── */
  t('移動平均', 'sma([1..5], 3) 含暖機期', sma([1, 2, 3, 4, 5], 3), [NA, NA, 2, 3, 4]);
  t('移動平均', 'sma 常數序列不變', sma([7, 7, 7, 7], 2), [NA, 7, 7, 7]);
  t('移動平均', 'ema([1..5], 3) 以 sma 為種子', ema([1, 2, 3, 4, 5], 3), [NA, NA, 2, 3, 4]);
  t('移動平均', 'ema 常數序列不變', ema([5, 5, 5, 5, 5], 3), [NA, NA, 5, 5, 5]);
  t('移動平均', 'rma([1..5], 3) Wilder 平滑', rma([1, 2, 3, 4, 5], 3), [NA, NA, 2, 8 / 3, (5 + 2 * 8 / 3) / 3], 1e-9);

  /* ── 統計量 ── */
  t('統計量', 'stdev 母體標準差（經典例）', stdev([2, 4, 4, 4, 5, 5, 7, 9], 8)[7], 2);
  t('統計量', 'stdev 常數序列為 0', stdev([3, 3, 3, 3], 4)[3], 0);
  t('統計量', 'change([1,3,6])', change([1, 3, 6]), [NA, 2, 3]);

/* =========================================================================
   匯出 Pine Script v5
   Pine 的 strategy() 沒有獨立的證交稅欄位，因此把「賣出稅 + 雙邊滑價」
   平均攤進每一邊的手續費：每邊 = (手續費×2 + 證交稅 + 滑價×2) ÷ 2。
   ========================================================================= */
const PINE_IND = {
  close: () => 'close', open: () => 'open', high: () => 'high', low: () => 'low', vol: () => 'volume',
  ma: n => `ta.sma(close, ${n})`, ema: n => `ta.ema(close, ${n})`, volma: n => `ta.sma(volume, ${n})`,
  rsi: n => `ta.rsi(close, ${n})`, atr: n => `ta.atr(${n})`,
  bbu: n => `(ta.sma(close, ${n}) + 2 * ta.stdev(close, ${n}))`,
  bbm: n => `ta.sma(close, ${n})`,
  bbl: n => `(ta.sma(close, ${n}) - 2 * ta.stdev(close, ${n}))`,
  bias: n => `((close - ta.sma(close, ${n})) / ta.sma(close, ${n}) * 100)`,
  macd: () => 'macdLine', macdsig: () => 'macdSignal',
  k: () => 'kVal', d: () => 'dVal'
};
const PINE_TW_ONLY = ['inst', 'instDays', 'marginChg', 'revYoY'];

function pineHeader(name, extra) {

  return `//@version=5
// ${name}
// 由「量化策略實驗室」匯出於 ${new Date().toISOString().slice(0, 10)}
// 成本換算：Pine 的 strategy() 沒有獨立的證交稅欄位，
//   因此把賣出證交稅與雙邊滑價平均攤進每一邊的手續費：
//   (手續費 ${CFG.fee}% × 2 + 證交稅 ${CFG.tax}% + 滑價 ${CFG.slip}% × 2) ÷ 2 = ${perSide}% / 邊
strategy("${name} [量化實驗室]", overlay=true, pyramiding=0,
     initial_capital=${CFG.cap}, default_qty_type=strategy.percent_of_equity, default_qty_value=100,
     commission_type=strategy.commission.percent, commission_value=${perSide},
     process_orders_on_close=false)
${extra || ''}`;
}
const PINE_KD = `
// 台股慣用 KD（RSV 經兩次指數平滑，K = 2/3 前值 + 1/3 RSV）
kdLen = input.int(9, "KD 長度")
rsv = (ta.highest(high, kdLen) - ta.lowest(low, kdLen)) == 0 ? 50 :
      (close - ta.lowest(low, kdLen)) / (ta.highest(high, kdLen) - ta.lowest(low, kdLen)) * 100
var float kVal = 50.0
var float dVal = 50.0
kVal := kVal * 2 / 3 + rsv / 3
dVal := dVal * 2 / 3 + kVal / 3
`;
const PINE_MACD = `
[macdLine, macdSignal, _hist] = ta.macd(close, 12, 26, 9)
`;

function pineCond(cd) {
  const L = PINE_IND[cd.l], R = cd.r === '#' ? null : PINE_IND[cd.r];
  if (!L || (cd.r !== '#' && !R)) return null;
  const a = L(cd.lp), b = cd.r === '#' ? String(cd.rv) : R(cd.rp);
  if (cd.op === 'gt') return `${a} > ${b}`;
  if (cd.op === 'lt') return `${a} < ${b}`;
  if (cd.op === 'cu') return `ta.crossover(${a}, ${b})`;
  return `ta.crossunder(${a}, ${b})`;
}

const PINE_BUILTIN = {
  kd_cross: (p, st) => ({ pre: PINE_KD, entry: `ta.crossover(kVal, dVal) and kVal < ${p.buyZone}`, exit: `ta.crossunder(kVal, dVal) and kVal > ${p.sellZone}` }),
  ma_bull: p => ({ pre: `
maA = ta.sma(close, ${p.a})
maB = ta.sma(close, ${p.b})
maC = ta.sma(close, ${p.cc})
aligned = maA > maB and maB > maC
`, entry: `aligned and not aligned[1] and close > maA`, exit: `ta.crossunder(maA, maB)` }),
  vol_break: p => ({ pre: `
hh = ta.highest(close, ${p.look})
ll = ta.lowest(close, ${p.exitLook})
av = ta.sma(volume, ${p.volLen})
`, entry: `close > hh[1] and volume > av * ${p.volMult}`, exit: `close < ll[1]` }),
  bias_rev: p => ({ pre: `
maB = ta.sma(close, ${p.maLen})
bias = (close - maB) / maB * 100
`, entry: `bias <= ${p.bias}`, exit: `close >= maB`, sl: p.sl }),
  gap_up: p => ({ pre: `
av = ta.sma(volume, ${p.volLen})
`, entry: `low > high[1] and volume > av * ${p.volMult}`, exit: `close < high[1]`, sl: p.sl })
};

function toPine(r) {
  const st = STRATS.find(x => x.id === r.id);
  if (!st) return { err: '找不到策略定義' };
  const p = r.params || {};

  // 自訂策略：條件積木直接翻譯
  if (st.custom) {
    const bad = [...st.def.entry, ...st.def.exit].filter(c => PINE_TW_ONLY.includes(c.l) || PINE_TW_ONLY.includes(c.r));
    if (bad.length) return { err: '這支策略用到法人／融資／月營收等台股專屬資料，TradingView 取不到，無法匯出。' };
    const en = st.def.entry.map(pineCond), ex = st.def.exit.map(pineCond);
    if (en.some(x => !x) || ex.some(x => !x)) return { err: '含有無法對應到 Pine 的條件元件。' };
    const needKD = [...st.def.entry, ...st.def.exit].some(c => c.l === 'k' || c.l === 'd' || c.r === 'k' || c.r === 'd');
    const needMACD = [...st.def.entry, ...st.def.exit].some(c => ['macd', 'macdsig'].includes(c.l) || ['macd', 'macdsig'].includes(c.r));
    let code = pineHeader(st.name, (needKD ? PINE_KD : '') + (needMACD ? PINE_MACD : ''));
    code += `\nlongCond = ${en.join(' and ')}\n`;
    code += `exitCond = ${ex.length ? ex.join(' and ') : 'false'}\n\n`;
    code += `if longCond\n    strategy.entry("Long", strategy.long)\nif exitCond\n    strategy.close("Long")\n`;
    if (p.sl > 0) code += `if strategy.position_size > 0\n    strategy.exit("SL", "Long", stop=strategy.position_avg_price * (1 - ${p.sl} / 100))\n`;
    if (p.tp > 0) code += `if strategy.position_size > 0\n    strategy.exit("TP", "Long", limit=strategy.position_avg_price * (1 + ${p.tp} / 100))\n`;
    return { code };
  }

  // 台股常用（純價量的 5 支）
  if (PINE_BUILTIN[r.id]) {
    const b = PINE_BUILTIN[r.id](p, st);
    let code = pineHeader(st.name, b.pre);
    code += `\nlongCond = ${b.entry}\nexitCond = ${b.exit}\n\n`;
    code += `if longCond\n    strategy.entry("Long", strategy.long)\nif exitCond\n    strategy.close("Long")\n`;
    if (b.sl) code += `if strategy.position_size > 0\n    strategy.exit("SL", "Long", stop=strategy.position_avg_price * (1 - ${b.sl} / 100))\n`;
    return { code };
  }

  // 需要台股籌碼／基本面的三支
  if (['inst_buy', 'rev_high', 'margin_down'].includes(r.id))
    return { err: '這支策略需要法人／月營收／融資資料，TradingView 取不到台股這些資料，無法匯出。' };

  // 其餘為 Alorse 原始 PineScript：直接給原始碼連結與該用的參數
  const url = `https://github.com/Alorse/pinescript-strategies/blob/master/${encodeURI(st.file)}`;
  const perSide = ((CFG.fee * 2 + CFG.tax + CFG.slip * 2) / 2).toFixed(4);
  const code = `//@version=5
// ${st.name}
// 這支策略的原始碼本來就是 PineScript，請直接取用：
//   ${url}
//
// 貼進 TradingView 後請把參數改成本次回測使用的值：
${Object.entries(st.params).map(([k, v]) => `//   ${v.label} = ${p[k]}`).join('\n')}
//
// 並把 strategy() 的成本參數改成：
//   commission_type=strategy.commission.percent, commission_value=${perSide}
//   （= 手續費 ${CFG.fee}% × 2 + 證交稅 ${CFG.tax}% + 滑價 ${CFG.slip}% × 2，再除以 2 攤到每一邊）
//
// 注意：TradingView 的成交模型與本工具不同，不會套用台股的
//   整張＋零股、最低手續費、升降單位、漲跌停與還原權息設定，
//   因此結果不會與本工具完全一致。
`;
  return { code, link: url };
}

function showPine() {
  if (!APP.res) return;
  const r = APP.res.rows.find(x => x.id === APP.sel);
  if (!r) return;
  const out = toPine(r);
  if (out.err) {
    modal(`<h2>匯出 Pine Script</h2><div class="err" style="margin-top:10px">${esc(out.err)}</div>
      <div style="text-align:right;margin-top:14px"><button class="btn" onclick="document.getElementById('mask').classList.remove('on')">關閉</button></div>`);
    return;
  }
  modal(`<h2>Pine Script v5 — ${esc(r.name)}</h2>
    <div class="dim" style="font-size:12px;margin-bottom:10px">貼到 TradingView 的 Pine 編輯器即可使用</div>
    <pre style="background:var(--code-bg,#0d1524);border:1px solid var(--line2);border-radius:9px;padding:12px;max-height:46vh;overflow:auto;font-size:11.5px;line-height:1.6;font-family:var(--mono,ui-monospace);white-space:pre;color:var(--tx)">${esc(out.code)}</pre>
    <div class="warn" style="margin-top:12px">TradingView 的成交模型與本工具不同——不會套用整張＋零股、最低手續費、升降單位、漲跌停與還原權息，
      因此結果<b>不會</b>與本工具完全一致。匯出主要是為了在 TradingView 上視覺化驗證進出場點。</div>
    <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
      <button class="btn" id="pineCopy">複製</button>
      <button class="btn primary" id="pineDl">下載 .pine</button>
      <button class="btn" onclick="document.getElementById('mask').classList.remove('on')">關閉</button></div>`);
  $('#pineCopy').onclick = e => { navigator.clipboard.writeText(out.code).then(() => { e.target.textContent = '已複製'; }); };
  $('#pineDl').onclick = () => dl(out.code, `${r.id}.pine`, 'text/plain');
}

  return PPTX_LOADED;
}

async function dlBlob(blob, name) {
  await DLREADY;
  if (DLCAP) { try { await DLCAP.save({ filename: name, data: blob }); return; } catch (e) { if (e && e.code === 'declined') return; } }
  const u = URL.createObjectURL(blob), a = el('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 3000);
}

async function dl(text, name, mime) {
  await DLREADY;
  if (DLCAP) {
    try { await DLCAP.save({ filename: name, data: text }); return; }
    catch (e) { if (e && e.code === 'declined') return; }   // 其他錯誤：退回瀏覽器下載
  }
  const b = new Blob([text], { type: mime + ';charset=utf-8' }), u = URL.createObjectURL(b);
  const a = el('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
/* 觸控裝置看不到 title 原生提示（全站 14 處，含策略全名、未成交清單、未平倉標記），
   改成點一下顯示浮動說明。互動元素（按鈕／核取方塊）照常作用，純資訊元素才攔下點擊。 */
/* Service Worker：只在 http(s) 下註冊；file:// 直接開也能用，只是沒有離線快取 */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
}

(function initTapTips() {
  if (!matchMedia('(hover: none)').matches) return;      // 有滑鼠就維持原生 hover
  const tip = el('div', { className: 'tiptip' });
  document.body.appendChild(tip);
  let timer = null;
  const hide = () => { tip.classList.remove('on'); clearTimeout(timer); };
  document.addEventListener('click', e => {
    const t = e.target.closest('[title]');
    const txt = t && t.getAttribute('title');
    if (!txt) { hide(); return; }
    // 本身就能按的東西讓它照常作用，只是順便顯示說明
    if (!t.matches('button,a,input,select,textarea,label,.chip,.tab,[role=button]')) {
      e.preventDefault(); e.stopPropagation();
    }
    tip.textContent = txt;
    tip.classList.add('on');
    const r = t.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, innerWidth - tw - 8)) + 'px';
    tip.style.top = (r.top - th - 8 < 8 ? r.bottom + 8 : r.top - th - 8) + 'px';
    clearTimeout(timer); timer = setTimeout(hide, 6000);
  }, true);
  addEventListener('scroll', hide, { passive: true, capture: true });
  addEventListener('resize', hide);
})();

function modal(html) { $('#modal').innerHTML = html; $('#mask').classList.add('on'); }
$('#mask').onclick = e => { if (e.target.id === 'mask') $('#mask').classList.remove('on'); };

/* ---------- 快取：同一天同一組查詢不重抓 ---------- */
const CACHE_NS = 'qlab.c1.', CACHE_TTL = 6 * 3600 * 1000;
function cacheGet(key) {
  try {
    const raw = localStorage.getItem(CACHE_NS + key);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || Date.now() - o.t > CACHE_TTL) { localStorage.removeItem(CACHE_NS + key); return null; }
    return o.v;
  } catch (e) { return null; }
}
function cacheSet(key, val) {
  const rec = JSON.stringify({ t: Date.now(), v: val });
  try { localStorage.setItem(CACHE_NS + key, rec); }
  catch (e) {                                   // 多半是配額用盡：清掉最舊的幾筆再試一次
    try {
      const ks = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(CACHE_NS)) {
          let t = 0; try { t = JSON.parse(localStorage.getItem(k)).t || 0; } catch (_) { }
          ks.push([k, t]);
        }
      }
      ks.sort((a, b) => a[1] - b[1]).slice(0, Math.max(3, Math.ceil(ks.length / 3)))
        .forEach(x => localStorage.removeItem(x[0]));
      localStorage.setItem(CACHE_NS + key, rec);
    } catch (_) { /* 快取不是必要功能，放棄就好 */ }
  }
}
function cacheClear() {
  try {
    const ks = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(CACHE_NS)) ks.push(k); }
    ks.forEach(k => localStorage.removeItem(k));
    return ks.length;
  } catch (e) { return 0; }
}
function cacheStats() {
  let n = 0, bytes = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(CACHE_NS)) { n++; bytes += (localStorage.getItem(k) || '').length; }
    }
  } catch (e) { }
  return { n, kb: Math.round(bytes / 1024) };

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function getJSON(url, tries = 3) {
  let lastErr = null;
  for (let a = 0; a < tries; a++) {
    try {
      const r = await fetch(url);
      if (r.status === 429 || r.status >= 500) throw new Error('HTTP ' + r.status);
      if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), { fatal: true });
      return await r.json();
    } catch (e) {
      lastErr = e;
      if (e.fatal || a === tries - 1) break;
      await sleep(400 * Math.pow(2, a) + Math.random() * 200);   // 400 / 800 / 1600 ms
    }
  }

async function fetchAdjEvents(sym, years) {
  const [a, b] = rangeOf(years);
  const ck = `ADJEV|${sym}|${a}|${b}`;
  const hit = cacheGet(ck);
  if (hit) return hit;
  const pull = async ds => {
    try {
      const j = await getJSON(`${API}?dataset=${ds}&data_id=${encodeURIComponent(sym)}&start_date=${a}&end_date=${b}`, 2);
      return (j.status === 200 && j.data) ? j.data : [];
    } catch (e) { return []; }
  };

  const [div, spl] = await Promise.all([pull('TaiwanStockDividendResult'), pull('TaiwanStockSplitPrice')]);

    .filter(d => d.before_price > 0 && d.after_price > 0)
    .map(d => ({ d: d.date.replace(/-/g, ''), f: d.after_price / d.before_price, t: d.type || '除權息' }))

    .sort((x, y) => x.d < y.d ? -1 : 1);

  if (!divs.length) return { bars, used: 0 };

  }).filter(x => x.rev > 0).sort((x, y) => x.know < y.know ? -1 : 1);

  const out = { inst: instMap, margin: marMap, rev: revList,
    hasInst: Object.keys(instMap).length > 0, hasMargin: Object.keys(marMap).length > 0, hasRev: revList.length > 0 };
  cacheSet(ck, out);
  return out;
}

/* 把三組資料對齊到每一根 K 棒 */
function alignExtras(ex, dates) {
  const n = dates.length;
  const instNet = new Array(n).fill(NA), marginBal = new Array(n).fill(NA);
  const revVal = new Array(n).fill(NA), revHigh = new Array(n).fill(NA), revNew = new Array(n).fill(false), revYm = new Array(n).fill('');
  let lastM = NA;
  for (let i = 0; i < n; i++) {
    const d = dates[i];
    instNet[i] = ex.inst[d] !== undefined ? ex.inst[d] : 0;      // 無資料當作零買賣超
    if (ex.margin[d] !== undefined) lastM = ex.margin[d];         // 融資餘額向前填補
    marginBal[i] = lastM;
  }
  // 月營收：取「知悉日 ≤ 本根日期」的最新一筆；創新高以首次可用的那一根為準
  let k = 0, seen = [], prevYm = '';
  for (let i = 0; i < n; i++) {
    while (k < ex.rev.length && ex.rev[k].know <= dates[i]) { seen.push(ex.rev[k].rev); k++; }
    if (seen.length) {
      const cur = seen[seen.length - 1];
      revVal[i] = cur;
      const win = seen.slice(Math.max(0, seen.length - 13), seen.length - 1);   // 前 12 個月
      revHigh[i] = win.length ? Math.max(...win) : NA;
      revYm[i] = ex.rev[Math.min(k - 1, ex.rev.length - 1)].ym;
      revNew[i] = revYm[i] !== prevYm;                                          // 這一根才首次得知
      prevYm = revYm[i];
    }
  }
  return { instNet, marginBal, revVal, revHigh, revNew, revYm,
    hasInst: ex.hasInst, hasMargin: ex.hasMargin, hasRev: ex.hasRev };
}

async function fetchName(sym, mk) {
  mk = mk || MK;

    if (j.data && j.data[0]) NAMES[k] = j.data[0].stock_name; } catch (e) { }
  return NAMES[k] || sym;
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const head = lines[0].toLowerCase().split(',').map(s => s.trim());
  const ix = k => head.findIndex(h => k.some(x => h === x || h.includes(x)));
  const iD = ix(['date', '日期']), iO = ix(['open', '開盤']), iH = ix(['high', 'max', '最高']), iL = ix(['low', 'min', '最低']), iC = ix(['close', '收盤']), iV = ix(['volume', '成交股數', '成交量']);
  if (iD < 0 || iC < 0) throw new Error('CSV 需至少包含 date 與 close 欄位');
  const body = lines.slice(1).map(l => l.split(','));
  return body.map(r => {
    const d = r[iD].trim().replace(/[-/]/g, '').slice(0, 8), c = +r[iC];
    return [d, iO < 0 ? c : +r[iO] || c, iH < 0 ? c : +r[iH] || c, iL < 0 ? c : +r[iL] || c, c, iV < 0 ? 0 : +String(r[iV]).replace(/[", ]/g, '') || 0];
  }).filter(r => r[0].length === 8 && r[4] > 0).sort((a, b) => a[0] < b[0] ? -1 : 1);
}
